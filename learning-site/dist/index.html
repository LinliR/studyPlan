686f759f27ba", "text": "完成一次告警触发与处置、一次独立实例恢复、一次失败发布回退。"}, {"id": "practice/stage-03-resilience.md::915f6577de17", "text": "使用 [故障复盘模板](../templates/incident-review.md) 写用户影响、时间线和可验证改进。"}, {"id": "practice/stage-03-resilience.md::d0ec6c22c894", "text": "变式复测：将成交事件改为客户归属变更，重新讨论权限缓存、顺序和历史数据访问。"}]}, {"path": "practice/stage-04-architecture.md", "title": "阶段 4：架构决策与最小迁移", "text": "阶段 4：架构决策与最小迁移 实践首页 · 上一阶段 · 下一阶段 目标与前置 入口：已有正确性、性能、可靠性证据。主学 M11/M12，联动 M09/M10。交付一份能评审、能验证、能回退的架构决策；使用 ADR 模板 。 统一决策题 CRM 报表与交易共享数据库和发布流程，查询增长开始影响下单尾延迟；团队希望 CRM 能独立演进，并要求未来支持租户隔离。 以下是教学假设而非已测事实：2 个开发小组，每组 3 人；峰值读 200 次/秒、写 20 次/秒；100 万客户、1,000 万订单；报表允许 60 秒延迟，库存与支付不允许由陈旧读模型判定。根据真实工作可替换，但必须记录变更后的参数与理由。 设计先计算数据增长、索引/备份/复制成本和连接/在途请求预算，再用练习机器可承受的数据规模验证机制，不能把缩小实验直接宣称满足全部目标。 任务与交付 任务 必须完成的工作 验收 S4-01 业务边界 明确 CRM、Sales、Trading、Payment 的词汇、不变量、拥有的数据与跨边界流程 系统/模块图及调用、事件与权限边界清楚 S4-02 方案比较 比较单体内优化、异步独立读模型、拆分 CRM 服务；估算开发、运行、运维、迁移成本 至少三个可行候选，决策与假设有证据，触发重评的阈值明确 S4-03 容量与可靠性 推导平均/峰值、数据保留、扩容上限、可用性和恢复目标 单位与口径一致；敏感参数变为 2 倍时重新计算 S4-04 租户隔离 增加两个练习租户，定义可信租户上下文，覆盖 DB/缓存/消息/搜索/导出 两租户同业务编号可共存；跨租户请求和事件被拒绝或隔离 S4-05 最小迁移 默认将 CRM 成交读模型迁移到独立存储，保留已有模块接口；只有 ADR 支持时再拆部署 回填、追平、对账、切换、回退各有证据 S4-06 设计评审 提交完整方案，演练旧消费者/迁移中断/服务不可用 回答失败行为、兼容与操作责任；记录评审导致的修改 默认迁移演练步骤 保留交易支付/退款事实的唯一权威写入端，停止依赖跨模块直接 JOIN，先通过明确查询接口访问。 建立新读模型与事件消费去重；先开始保留/消费增量事件，再导入历史事实，以稳定支付/退款标识幂等合并，避免快照与事件重叠重复计数。 影子查询对比客户数、成交毛额、退款额和净额；记录消费位置/未处理年龄，以及历史回填检查点。 先对少量练习客户切换读路径；阈值为同一事实截止点下金额完全一致、缺失/重复事实为零，且延迟达成事先记录的目标。未满足则停止切换。 注入回填中断、重复/乱序增量和新读模型不可用，验证恢复与降级；错误时切回旧读路径，保留增量事实便于重试。 演练中不删除旧数据源或旧接口。真正移除旧路径必须等观测和数据保留条件满足；在 ADR 写清退出条件。 如果测量不支持拆服务，就提交保留单体的决策及上述读模型迁移实验。练习目标是证明演进安全，不预设微服务更好。 安全与兼容场景 相同 customerCode 在不同租户创建；伪造 tenantId 不能切换身份。原数据迁入默认租户的步骤可回退并可核对。 缓存键、搜索过滤、数据库唯一约束与外键引用边界、事件消费上下文必须包含或校验租户归属。 旧消费者收到新增可选字段仍能处理；未知不兼容 schemaVersion 进入明确失败处理，不静默丢弃。 客户删除/停用与历史订单、审计、统计有明确保留政策；演练使用虚构数据。 阶段出口 交付业务目标、架构图、候选比较、容量/成本、安全、接口与事件契约、迁移/回滚、测量限制。 至少一次迁移中断恢复与一次切回旧路径成功。 多租户负例覆盖所有已实现的数据入口；不靠前端隐藏实现隔离。 变式复测：团队缩至 2 人或流量增加 10 倍，重新解释选择及改变决策的证据。 无外部评审者时标记模拟评审，真实协作验证留给阶段 5。", "html": "\u003ch1 id=\"heading-0\">阶段 4：架构决策与最小迁移\u003c/h1>\n\u003cp>\u003ca href=\"#doc=practice%2FREADME.md\">实践首页\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-03-resilience.md\">上一阶段\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-05-transfer.md\">下一阶段\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">目标与前置\u003c/h2>\n\u003cp>入口：已有正确性、性能、可靠性证据。主学 M11/M12，联动 M09/M10。交付一份能评审、能验证、能回退的架构决策；使用 \u003ca href=\"#doc=templates%2Farchitecture-decision.md\">ADR 模板\u003c/a>。\u003c/p>\n\u003ch2 id=\"heading-2\">统一决策题\u003c/h2>\n\u003cp>CRM 报表与交易共享数据库和发布流程，查询增长开始影响下单尾延迟；团队希望 CRM 能独立演进，并要求未来支持租户隔离。\u003c/p>\n\u003cp>以下是教学假设而非已测事实：2 个开发小组，每组 3 人；峰值读 200 次/秒、写 20 次/秒；100 万客户、1,000 万订单；报表允许 60 秒延迟，库存与支付不允许由陈旧读模型判定。根据真实工作可替换，但必须记录变更后的参数与理由。\u003c/p>\n\u003cp>设计先计算数据增长、索引/备份/复制成本和连接/在途请求预算，再用练习机器可承受的数据规模验证机制，不能把缩小实验直接宣称满足全部目标。\u003c/p>\n\u003ch2 id=\"heading-3\">任务与交付\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"任务表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">任务\u003c/th>\u003cth scope=\"col\">必须完成的工作\u003c/th>\u003cth scope=\"col\">验收\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S4-01 业务边界\u003c/td>\u003ctd>明确 CRM、Sales、Trading、Payment 的词汇、不变量、拥有的数据与跨边界流程\u003c/td>\u003ctd>系统/模块图及调用、事件与权限边界清楚\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S4-02 方案比较\u003c/td>\u003ctd>比较单体内优化、异步独立读模型、拆分 CRM 服务；估算开发、运行、运维、迁移成本\u003c/td>\u003ctd>至少三个可行候选，决策与假设有证据，触发重评的阈值明确\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S4-03 容量与可靠性\u003c/td>\u003ctd>推导平均/峰值、数据保留、扩容上限、可用性和恢复目标\u003c/td>\u003ctd>单位与口径一致；敏感参数变为 2 倍时重新计算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S4-04 租户隔离\u003c/td>\u003ctd>增加两个练习租户，定义可信租户上下文，覆盖 DB/缓存/消息/搜索/导出\u003c/td>\u003ctd>两租户同业务编号可共存；跨租户请求和事件被拒绝或隔离\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S4-05 最小迁移\u003c/td>\u003ctd>默认将 CRM 成交读模型迁移到独立存储，保留已有模块接口；只有 ADR 支持时再拆部署\u003c/td>\u003ctd>回填、追平、对账、切换、回退各有证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S4-06 设计评审\u003c/td>\u003ctd>提交完整方案，演练旧消费者/迁移中断/服务不可用\u003c/td>\u003ctd>回答失败行为、兼容与操作责任；记录评审导致的修改\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">默认迁移演练步骤\u003c/h2>\n\u003col>\u003cli>保留交易支付/退款事实的唯一权威写入端，停止依赖跨模块直接 JOIN，先通过明确查询接口访问。\u003c/li>\u003cli>建立新读模型与事件消费去重；先开始保留/消费增量事件，再导入历史事实，以稳定支付/退款标识幂等合并，避免快照与事件重叠重复计数。\u003c/li>\u003cli>影子查询对比客户数、成交毛额、退款额和净额；记录消费位置/未处理年龄，以及历史回填检查点。\u003c/li>\u003cli>先对少量练习客户切换读路径；阈值为同一事实截止点下金额完全一致、缺失/重复事实为零，且延迟达成事先记录的目标。未满足则停止切换。\u003c/li>\u003cli>注入回填中断、重复/乱序增量和新读模型不可用，验证恢复与降级；错误时切回旧读路径，保留增量事实便于重试。\u003c/li>\u003cli>演练中不删除旧数据源或旧接口。真正移除旧路径必须等观测和数据保留条件满足；在 ADR 写清退出条件。\u003c/li>\u003c/ol>\n\u003cp>如果测量不支持拆服务，就提交保留单体的决策及上述读模型迁移实验。练习目标是证明演进安全，不预设微服务更好。\u003c/p>\n\u003ch2 id=\"heading-5\">安全与兼容场景\u003c/h2>\n\u003cul>\u003cli>相同 customerCode 在不同租户创建；伪造 tenantId 不能切换身份。原数据迁入默认租户的步骤可回退并可核对。\u003c/li>\u003cli>缓存键、搜索过滤、数据库唯一约束与外键引用边界、事件消费上下文必须包含或校验租户归属。\u003c/li>\u003cli>旧消费者收到新增可选字段仍能处理；未知不兼容 schemaVersion 进入明确失败处理，不静默丢弃。\u003c/li>\u003cli>客户删除/停用与历史订单、审计、统计有明确保留政策；演练使用虚构数据。\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-6\">阶段出口\u003c/h2>\n\u003cul class=\"checklist\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-04-architecture.md::ca79d8f16689\">\u003cspan>交付业务目标、架构图、候选比较、容量/成本、安全、接口与事件契约、迁移/回滚、测量限制。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-04-architecture.md::716d9a69d6cb\">\u003cspan>至少一次迁移中断恢复与一次切回旧路径成功。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-04-architecture.md::0fdf5971a719\">\u003cspan>多租户负例覆盖所有已实现的数据入口；不靠前端隐藏实现隔离。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-04-architecture.md::dfec6c3d859a\">\u003cspan>变式复测：团队缩至 2 人或流量增加 10 倍，重新解释选择及改变决策的证据。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-04-architecture.md::0c91d2726a2b\">\u003cspan>无外部评审者时标记模拟评审，真实协作验证留给阶段 5。\u003c/span>\u003c/label>\u003c/li>\u003c/ul>", "toc": [{"id": "heading-0", "title": "阶段 4：架构决策与最小迁移", "level": 1}, {"id": "heading-1", "title": "目标与前置", "level": 2}, {"id": "heading-2", "title": "统一决策题", "level": 2}, {"id": "heading-3", "title": "任务与交付", "level": 2}, {"id": "heading-4", "title": "默认迁移演练步骤", "level": 2}, {"id": "heading-5", "title": "安全与兼容场景", "level": 2}, {"id": "heading-6", "title": "阶段出口", "level": 2}], "units": [], "checks": [{"id": "practice/stage-04-architecture.md::ca79d8f16689", "text": "交付业务目标、架构图、候选比较、容量/成本、安全、接口与事件契约、迁移/回滚、测量限制。"}, {"id": "practice/stage-04-architecture.md::716d9a69d6cb", "text": "至少一次迁移中断恢复与一次切回旧路径成功。"}, {"id": "practice/stage-04-architecture.md::0fdf5971a719", "text": "多租户负例覆盖所有已实现的数据入口；不靠前端隐藏实现隔离。"}, {"id": "practice/stage-04-architecture.md::dfec6c3d859a", "text": "变式复测：团队缩至 2 人或流量增加 10 倍，重新解释选择及改变决策的证据。"}, {"id": "practice/stage-04-architecture.md::0c91d2726a2b", "text": "无外部评审者时标记模拟评审，真实协作验证留给阶段 5。"}]}, {"path": "practice/stage-05-transfer.md", "title": "阶段 5：迁移到真实工作", "text": "阶段 5：迁移到真实工作 实践首页 · 上一阶段 · 个人进度 目标与前置 入口：已经能完成复杂模块与架构决策练习。选择一个有业务价值、范围可控、能测量反馈的实际问题，把方法用于团队交付。没有真实项目机会时继续做模拟案例，但状态记录为“模拟完成，待真实验证”。 候选问题：慢接口、频繁超时、手工发布风险、模块耦合导致改动困难、权限遗漏、昂贵报表或消息积压。优先选择能取得基线和结果的数据；不要为证明架构能力扩大改造范围。 任务与交付 任务 行动 证据与验收 S5-01 定义问题 明确受影响用户、业务损失、约束、责任人和不做什么 脱敏的问题陈述；同事认可问题确实存在 S5-02 建立基线 记录指标口径、数据窗口、典型案例和环境 原始证据可追溯；区别相关性与因果 S5-03 方案评审 至少比较小修、结构调整两类方案，列风险、成本与验证方法 评审意见和调整记录；不是只有最终结论 S5-04 小步实施 任务拆分、代码评审、发布检查点、观察和回退 依团队流程执行；可由其他人复核的变更与测试 S5-05 结果评估 同口径比较前后，注明业务量与流量结构变化 成功和退化均如实记录；没有收益也总结原因 S5-06 知识传递 给同事讲清机制，让其按文档完成一个变式任务 反馈与修订，说明哪些决策可以复用、哪些依赖本场景 验收场景 场景 应对与检验 正常 指标按预期改善，业务不变量与权限回归仍通过 边界 改造期间流量下降/业务口径变化，重新对齐基线并标注归因限制 失败 效果不明显、出现回归或团队反馈不可维护 边界场景需重新对齐基线或明确无法归因；失败场景按预定回退/缩小方案处理，形成复盘，不把“上线”当作成功。 高级工程师与架构能力复核 高级工程师证据：独立交付、关键机制解释、故障定位、测试质量、可复现结果和他人可维护的文档。 架构能力证据：从业务约束出发选方案，明确成本与数据边界，组织评审与协作，渐进迁移并观察实际反馈；知道何时撤销自己原来的判断。 产出使用 ADR 、 故障复盘 与 学习证据 。真实资料需脱敏；无权复制的公司代码和数据不放入个人学习仓库。 阶段出口 一次完整的问题→基线→评审→实施→观测→复盘闭环。 至少一位实际协作者能复核结论并提出反馈，反馈已处理或明确保留原因。 有新问题触发的下一轮学习任务，继续更新模块矩阵。 模拟成果与真实工作成果明确区分，不以一次实验推断长期生产可靠性。", "html": "\u003ch1 id=\"heading-0\">阶段 5：迁移到真实工作\u003c/h1>\n\u003cp>\u003ca href=\"#doc=practice%2FREADME.md\">实践首页\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-04-architecture.md\">上一阶段\u003c/a> · \u003ca href=\"#doc=PROGRESS.md\">个人进度\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">目标与前置\u003c/h2>\n\u003cp>入口：已经能完成复杂模块与架构决策练习。选择一个有业务价值、范围可控、能测量反馈的实际问题，把方法用于团队交付。没有真实项目机会时继续做模拟案例，但状态记录为“模拟完成，待真实验证”。\u003c/p>\n\u003cp>候选问题：慢接口、频繁超时、手工发布风险、模块耦合导致改动困难、权限遗漏、昂贵报表或消息积压。优先选择能取得基线和结果的数据；不要为证明架构能力扩大改造范围。\u003c/p>\n\u003ch2 id=\"heading-2\">任务与交付\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"任务表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">任务\u003c/th>\u003cth scope=\"col\">行动\u003c/th>\u003cth scope=\"col\">证据与验收\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S5-01 定义问题\u003c/td>\u003ctd>明确受影响用户、业务损失、约束、责任人和不做什么\u003c/td>\u003ctd>脱敏的问题陈述；同事认可问题确实存在\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S5-02 建立基线\u003c/td>\u003ctd>记录指标口径、数据窗口、典型案例和环境\u003c/td>\u003ctd>原始证据可追溯；区别相关性与因果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S5-03 方案评审\u003c/td>\u003ctd>至少比较小修、结构调整两类方案，列风险、成本与验证方法\u003c/td>\u003ctd>评审意见和调整记录；不是只有最终结论\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S5-04 小步实施\u003c/td>\u003ctd>任务拆分、代码评审、发布检查点、观察和回退\u003c/td>\u003ctd>依团队流程执行；可由其他人复核的变更与测试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S5-05 结果评估\u003c/td>\u003ctd>同口径比较前后，注明业务量与流量结构变化\u003c/td>\u003ctd>成功和退化均如实记录；没有收益也总结原因\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S5-06 知识传递\u003c/td>\u003ctd>给同事讲清机制，让其按文档完成一个变式任务\u003c/td>\u003ctd>反馈与修订，说明哪些决策可以复用、哪些依赖本场景\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">验收场景\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">应对与检验\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>指标按预期改善，业务不变量与权限回归仍通过\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>改造期间流量下降/业务口径变化，重新对齐基线并标注归因限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>效果不明显、出现回归或团队反馈不可维护\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>边界场景需重新对齐基线或明确无法归因；失败场景按预定回退/缩小方案处理，形成复盘，不把“上线”当作成功。\u003c/p>\n\u003ch2 id=\"heading-4\">高级工程师与架构能力复核\u003c/h2>\n\u003cp>高级工程师证据：独立交付、关键机制解释、故障定位、测试质量、可复现结果和他人可维护的文档。\u003c/p>\n\u003cp>架构能力证据：从业务约束出发选方案，明确成本与数据边界，组织评审与协作，渐进迁移并观察实际反馈；知道何时撤销自己原来的判断。\u003c/p>\n\u003cp>产出使用 \u003ca href=\"#doc=templates%2Farchitecture-decision.md\">ADR\u003c/a>、\u003ca href=\"#doc=templates%2Fincident-review.md\">故障复盘\u003c/a> 与 \u003ca href=\"#doc=templates%2Fevidence.md\">学习证据\u003c/a>。真实资料需脱敏；无权复制的公司代码和数据不放入个人学习仓库。\u003c/p>\n\u003ch2 id=\"heading-5\">阶段出口\u003c/h2>\n\u003cul class=\"checklist\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-05-transfer.md::88927c5f2477\">\u003cspan>一次完整的问题→基线→评审→实施→观测→复盘闭环。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-05-transfer.md::9a567c4deb14\">\u003cspan>至少一位实际协作者能复核结论并提出反馈，反馈已处理或明确保留原因。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-05-transfer.md::45f74a23695e\">\u003cspan>有新问题触发的下一轮学习任务，继续更新模块矩阵。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-05-transfer.md::1bfbd00492f4\">\u003cspan>模拟成果与真实工作成果明确区分，不以一次实验推断长期生产可靠性。\u003c/span>\u003c/label>\u003c/li>\u003c/ul>", "toc": [{"id": "heading-0", "title": "阶段 5：迁移到真实工作", "level": 1}, {"id": "heading-1", "title": "目标与前置", "level": 2}, {"id": "heading-2", "title": "任务与交付", "level": 2}, {"id": "heading-3", "title": "验收场景", "level": 2}, {"id": "heading-4", "title": "高级工程师与架构能力复核", "level": 2}, {"id": "heading-5", "title": "阶段出口", "level": 2}], "units": [], "checks": [{"id": "practice/stage-05-transfer.md::88927c5f2477", "text": "一次完整的问题→基线→评审→实施→观测→复盘闭环。"}, {"id": "practice/stage-05-transfer.md::9a567c4deb14", "text": "至少一位实际协作者能复核结论并提出反馈，反馈已处理或明确保留原因。"}, {"id": "practice/stage-05-transfer.md::45f74a23695e", "text": "有新问题触发的下一轮学习任务，继续更新模块矩阵。"}, {"id": "practice/stage-05-transfer.md::1bfbd00492f4", "text": "模拟成果与真实工作成果明确区分，不以一次实验推断长期生产可靠性。"}]}, {"path": "resources/REFERENCES.md", "title": "一手资料与版本约定", "text": "一手资料与版本约定 总纲 · 学习方法 入口核对日期：2026-09-26。这里是按问题阅读的导航，不是需要全部通读的书单。优先使用官方教程、规范、项目文档及作者原文。每份学习证据另记实际阅读章节、版本、访问日期；在线文档的默认版本可能变化。 技术基线与依赖锁定 项目 第一版约定 建立实践工程时要做的事 Java Java 21，禁用预览特性作为必修依赖 记录发行版与精确补丁版本，源码与运行时匹配 数据库 MySQL 8.4 / InnoDB 锁定镜像补丁或摘要，记录时区、字符集、隔离级别与自动提交 Spring 与 Java 21 兼容的稳定 Spring Boot；不使用 milestone/snapshot 核对下方系统要求，锁定 Boot 版本，由 BOM 管理配套 Spring/Security/测试依赖 数据访问 JDBC 对照 + MyBatis；Flyway 管理迁移 按 MyBatis Starter 兼容矩阵选版本；Flyway 核对数据库支持，不任意混用主版本 构建/测试 Maven Wrapper；JUnit Jupiter；MySQL 集成测试 固定 Maven 版本；JUnit 版本跟随所选 Boot 支持范围，不照抄“current”网页版本 中间件 Redis、RabbitMQ；可选真实 Elasticsearch 到阶段 3 再锁定稳定版本及配置，记录队列/确认/持久化设置 模块验证 依赖规则测试，Spring Modulith 可辅助 若使用 Modulith，按官方兼容说明选择对应 Boot 的版本 核对时 Spring Boot 系统要求 页面展示的 Java 兼容范围覆盖 Java 21；第三方组件仍需分别核对。当前只有学习文档，尚无 pom 或已验证的依赖组合，不把网页信息当作构建成功证明。 Java 教程：M01 主入口： Dev.java Learn 。 单元 定点阅读 M01-1/2 Language Basics、OOP、Generics、Collections M01-3/4 Exceptions，以及下方 API 的 AutoCloseable、BigDecimal、java.time M01-5/6 Streams、Pattern Matching、Annotations、Reflection 教程用于建立概念，再以固定版本 API/规范核对关键行为。站点默认最新 Java 的内容不一定适用于 21。 Java 21 规范与 API：M01/M03/M04 Java 21 API ：查 Object、BigDecimal、Map、java.time、java.util.concurrent 的契约及异常条件。 JLS Java SE 21 ：类型/泛型、表达式、执行、线程与锁；M03-1 重点第 17 章。规范不要求逐页通读。 虚拟线程：M03-6 主入口： Java 21 Virtual Threads 。阅读创建、调度、pinning、监控及使用建议；页面提供 JEP 444 的设计背景入口。这里保留已能访问的 Oracle 官方指南，JEP 站点在本次检查时返回访问限制。 尤其区分 Java 21 与后续版本的实现变化；对线程便宜的观察不能推导数据库连接或 CPU 也无限。 JVM 诊断：M04 主资料： Java 21 Troubleshooting Guide ，按诊断工具、内存问题、性能问题选择章节。 基准： OpenJDK JMH 官方仓库 ，从 samples 学习预热、fork、状态和避免优化干扰。不是把所有业务压测改成微基准。 计算机基础：M02 主资料： OSTEP 作者网站 ，进程/调度→地址空间/分页→线程/锁→IO/文件，结合问题按章阅读。 算法： MIT 6.006 官方课程 ，数据结构、排序、树、图和动态规划；将练习用 Java 实现。 HTTP： RFC 9110 ，阅读方法语义、幂等、状态码与条件请求，区分协议含义和业务幂等实现。 TCP： RFC 9293 ，按连接状态、序号/确认、重传与流量控制定点查阅。 DNS： RFC 1034 ，理解名称空间、解析与缓存；具体新增机制再查后续标准。 TLS： RFC 8446 ，TLS 1.3 握手和认证，配合请求时序学习，不背完整密码套件。 Linux 工具使用练习环境对应版本的 man pages，避免照搬 macOS 命令结果。 MySQL：M05 主资料： MySQL 8.4 Reference Manual 。 单元 手册阅读位置 M05-1/2 Data Types、SQL Statements、约束与 JOIN M05-3 Optimization：索引、EXPLAIN、统计信息；InnoDB 页/索引与缓冲池 M05-4 InnoDB Transaction Model、Locking、Isolation Levels、Consistent Nonlocking Reads M05-5/6 连接与事务使用；InnoDB 恢复；Backup and Recovery、Replication 迁移工具： Redgate Flyway 官方文档 ，先读迁移版本、校验、失败处理与数据库支持；不要假定每种 DDL 都可事务回滚。 MyBatis：M05/M06 主入口： MyBatis Spring Boot Starter 。先读 Requirements 的 Java/Boot/MyBatis-Spring 兼容矩阵，再读自动配置和配置项，并从页面导航进入 MyBatis 映射与动态 SQL 文档。 先手写一次 JDBC 事务再对照框架，理解框架隐藏了什么、没有改变什么。 Spring：M06 主资料： Spring Framework Reference ，Core/IoC → AOP → Data Access/Transaction → Web MVC → Testing。 工程入口： Spring Boot Reference ，配置、自动装配、Web、安全、测试、生产特性。 在页面版本选择器切到实际主版本；创建实验报告时引用具体小节。对代理、事务和自动配置的推断要通过实际 Bean/调用链/数据库结果验证。 测试、构建与协作：M07 JUnit 官方用户指南 ：从 Jupiter 的断言、生命周期、参数化测试与扩展机制进入；此处是已核对的版本入口，实际工程以兼容版本为准。 Maven Guides ：生命周期、依赖管理、插件、Wrapper 与可复现构建。 Pro Git 官方在线版 ：记录变更、分支与合并、远程协作、调试与恢复。 测试集成依照所选 Boot 的 Testing 章节。旧 JUnit “current”链接会跳转更新版本，因此不把 URL 名称当版本保证。 Redis、RabbitMQ、搜索：M08 Redis 官方文档 ：数据类型、Key Expiration、Key Eviction、Persistence、Replication；选择与实验版本一致的行为说明。 RabbitMQ 官方文档 ：Publisher Confirms / Consumer Acknowledgements → Reliability → Prefetch → Dead Lettering；再读对应队列类型的持久化与故障行为。 Elastic 官方文档 ：Elasticsearch 的映射、分词、查询、refresh 和 reindex；先学倒排模型，再做实际索引同步。 分布式机制：M09 主资料： Raft 作者资料与论文入口 ，先理解复制状态机、故障模型，再读选主、日志复制和安全性；不以手写完整算法作为必修。 理论课程： MIT 6.5840 ，沿讲义和阅读列表学习一致性、复制、容错与事务；实验语言不同不影响概念学习，课程实验不是本路线额外必修。 补偿事务： Saga 模式作者资料 ，比较编排与协同、本地事务和补偿的范围，映射到支付/取消/退款。 Debezium Outbox Event Router ：观察事件标识、聚合与消息路由的设计，理解 outbox 记录与事件的关系。课程先用轮询投递，不要求采用 Debezium 的具体部署栈。 可靠投递与故障处理同时参考上方 RabbitMQ Reliability，以及下方 SRE 过载与故障章节。资料中的保证均需按其故障假设解释。 SRE：M10 主资料： Google SRE 在线书 。定点读第 4 章 SLO、第 6 章监控、第 10 章告警、第 12–15 章排障/事故/复盘、第 21–22 章过载与级联失败，以及可靠性测试章节。 学习原则与方法，具体目标根据练习的用户流程定义，不照抄其他组织的可用性指标。 部署与观测工具：M10 Docker Docs ：镜像、容器、网络、卷、Compose、资源与配置。 Kubernetes Concepts ：Workloads、Services、Configuration、资源与探针；先读最小部署需要的对象。 OpenTelemetry Docs ：信号、上下文传播、采样和 Java 接入；关注高基数、敏感字段与采集成本。 业务建模与架构表达：M11 DDD Reference（Eric Evans） ：统一语言、实体/值对象、聚合和限界上下文，先映射到 CRM 与交易中的真实概念。 Spring Modulith ：模块定义、验证、模块测试与事件，作为检验业务边界的工具。 C4 model 作者网站 ：系统上下文、容器、组件图；只画能帮助当前评审的层级。 Documenting Architecture Decisions ：记录背景、决定与后果，配合仓库 ADR 模板使用。 安全：M12/M06 主资料： OWASP Cheat Sheet Series ，先读 Authorization、Input Validation、SQL Injection Prevention、CSRF、SSRF、Logging 与 Password Storage，再按项目入口补充。 框架： Spring Security Reference ，按实际版本学习 Servlet Security、Authentication、Authorization、CSRF 与测试支持。 资料入口已核对可访问。后续链接迁移时优先从同一项目官方导航寻找替代入口，并更新此页日期与具体版本，不将搜索摘要作为机制依据。", "html": "\u003ch1 id=\"heading-0\">一手资料与版本约定\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=METHOD.md\">学习方法\u003c/a>\u003c/p>\n\u003cp>入口核对日期：2026-09-26。这里是按问题阅读的导航，不是需要全部通读的书单。优先使用官方教程、规范、项目文档及作者原文。每份学习证据另记实际阅读章节、版本、访问日期；在线文档的默认版本可能变化。\u003c/p>\n\u003ca id=\"baseline\">\u003c/a>\n\u003ch2 id=\"heading-1\">技术基线与依赖锁定\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"项目表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">项目\u003c/th>\u003cth scope=\"col\">第一版约定\u003c/th>\u003cth scope=\"col\">建立实践工程时要做的事\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Java\u003c/td>\u003ctd>Java 21，禁用预览特性作为必修依赖\u003c/td>\u003ctd>记录发行版与精确补丁版本，源码与运行时匹配\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据库\u003c/td>\u003ctd>MySQL 8.4 / InnoDB\u003c/td>\u003ctd>锁定镜像补丁或摘要，记录时区、字符集、隔离级别与自动提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spring\u003c/td>\u003ctd>与 Java 21 兼容的稳定 Spring Boot；不使用 milestone/snapshot\u003c/td>\u003ctd>核对下方系统要求，锁定 Boot 版本，由 BOM 管理配套 Spring/Security/测试依赖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据访问\u003c/td>\u003ctd>JDBC 对照 + MyBatis；Flyway 管理迁移\u003c/td>\u003ctd>按 MyBatis Starter 兼容矩阵选版本；Flyway 核对数据库支持，不任意混用主版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>构建/测试\u003c/td>\u003ctd>Maven Wrapper；JUnit Jupiter；MySQL 集成测试\u003c/td>\u003ctd>固定 Maven 版本；JUnit 版本跟随所选 Boot 支持范围，不照抄“current”网页版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中间件\u003c/td>\u003ctd>Redis、RabbitMQ；可选真实 Elasticsearch\u003c/td>\u003ctd>到阶段 3 再锁定稳定版本及配置，记录队列/确认/持久化设置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模块验证\u003c/td>\u003ctd>依赖规则测试，Spring Modulith 可辅助\u003c/td>\u003ctd>若使用 Modulith，按官方兼容说明选择对应 Boot 的版本\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>核对时 \u003ca href=\"https://docs.spring.io/spring-boot/system-requirements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Spring Boot 系统要求\u003c/a> 页面展示的 Java 兼容范围覆盖 Java 21；第三方组件仍需分别核对。当前只有学习文档，尚无 pom 或已验证的依赖组合，不把网页信息当作构建成功证明。\u003c/p>\n\u003ca id=\"java\">\u003c/a>\n\u003ch2 id=\"heading-2\">Java 教程：M01\u003c/h2>\n\u003cp>主入口：\u003ca href=\"https://dev.java/learn/\" target=\"_blank\" rel=\"noopener noreferrer\">Dev.java Learn\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">定点阅读\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M01-1/2\u003c/td>\u003ctd>Language Basics、OOP、Generics、Collections\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01-3/4\u003c/td>\u003ctd>Exceptions，以及下方 API 的 AutoCloseable、BigDecimal、java.time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01-5/6\u003c/td>\u003ctd>Streams、Pattern Matching、Annotations、Reflection\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>教程用于建立概念，再以固定版本 API/规范核对关键行为。站点默认最新 Java 的内容不一定适用于 21。\u003c/p>\n\u003ca id=\"java-spec\">\u003c/a>\n\u003ch2 id=\"heading-3\">Java 21 规范与 API：M01/M03/M04\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://docs.oracle.com/en/java/javase/21/docs/api/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">Java 21 API\u003c/a>：查 Object、BigDecimal、Map、java.time、java.util.concurrent 的契约及异常条件。\u003c/li>\u003cli>\u003ca href=\"https://docs.oracle.com/javase/specs/jls/se21/html/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">JLS Java SE 21\u003c/a>：类型/泛型、表达式、执行、线程与锁；M03-1 重点第 17 章。规范不要求逐页通读。\u003c/li>\u003c/ul>\n\u003ca id=\"virtual-threads\">\u003c/a>\n\u003ch2 id=\"heading-4\">虚拟线程：M03-6\u003c/h2>\n\u003cp>主入口：\u003ca href=\"https://docs.oracle.com/en/java/javase/21/core/virtual-threads.html\" target=\"_blank\" rel=\"noopener noreferrer\">Java 21 Virtual Threads\u003c/a>。阅读创建、调度、pinning、监控及使用建议；页面提供 JEP 444 的设计背景入口。这里保留已能访问的 Oracle 官方指南，JEP 站点在本次检查时返回访问限制。\u003c/p>\n\u003cp>尤其区分 Java 21 与后续版本的实现变化；对线程便宜的观察不能推导数据库连接或 CPU 也无限。\u003c/p>\n\u003ca id=\"jvm\">\u003c/a>\n\u003ch2 id=\"heading-5\">JVM 诊断：M04\u003c/h2>\n\u003cul>\u003cli>主资料：\u003ca href=\"https://docs.oracle.com/en/java/javase/21/troubleshoot/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">Java 21 Troubleshooting Guide\u003c/a>，按诊断工具、内存问题、性能问题选择章节。\u003c/li>\u003cli>基准：\u003ca href=\"https://github.com/openjdk/jmh\" target=\"_blank\" rel=\"noopener noreferrer\">OpenJDK JMH 官方仓库\u003c/a>，从 samples 学习预热、fork、状态和避免优化干扰。不是把所有业务压测改成微基准。\u003c/li>\u003c/ul>\n\u003ca id=\"foundations\">\u003c/a>\n\u003ch2 id=\"heading-6\">计算机基础：M02\u003c/h2>\n\u003cul>\u003cli>主资料：\u003ca href=\"https://pages.cs.wisc.edu/~remzi/OSTEP/\" target=\"_blank\" rel=\"noopener noreferrer\">OSTEP 作者网站\u003c/a>，进程/调度→地址空间/分页→线程/锁→IO/文件，结合问题按章阅读。\u003c/li>\u003cli>算法：\u003ca href=\"https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/\" target=\"_blank\" rel=\"noopener noreferrer\">MIT 6.006 官方课程\u003c/a>，数据结构、排序、树、图和动态规划；将练习用 Java 实现。\u003c/li>\u003cli>HTTP：\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html\" target=\"_blank\" rel=\"noopener noreferrer\">RFC 9110\u003c/a>，阅读方法语义、幂等、状态码与条件请求，区分协议含义和业务幂等实现。\u003c/li>\u003cli>TCP：\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9293.html\" target=\"_blank\" rel=\"noopener noreferrer\">RFC 9293\u003c/a>，按连接状态、序号/确认、重传与流量控制定点查阅。\u003c/li>\u003cli>DNS：\u003ca href=\"https://www.rfc-editor.org/rfc/rfc1034.html\" target=\"_blank\" rel=\"noopener noreferrer\">RFC 1034\u003c/a>，理解名称空间、解析与缓存；具体新增机制再查后续标准。\u003c/li>\u003cli>TLS：\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8446.html\" target=\"_blank\" rel=\"noopener noreferrer\">RFC 8446\u003c/a>，TLS 1.3 握手和认证，配合请求时序学习，不背完整密码套件。\u003c/li>\u003cli>Linux 工具使用练习环境对应版本的 man pages，避免照搬 macOS 命令结果。\u003c/li>\u003c/ul>\n\u003ca id=\"mysql\">\u003c/a>\n\u003ch2 id=\"heading-7\">MySQL：M05\u003c/h2>\n\u003cp>主资料：\u003ca href=\"https://dev.mysql.com/doc/refman/8.4/en/\" target=\"_blank\" rel=\"noopener noreferrer\">MySQL 8.4 Reference Manual\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">手册阅读位置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M05-1/2\u003c/td>\u003ctd>Data Types、SQL Statements、约束与 JOIN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-3\u003c/td>\u003ctd>Optimization：索引、EXPLAIN、统计信息；InnoDB 页/索引与缓冲池\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-4\u003c/td>\u003ctd>InnoDB Transaction Model、Locking、Isolation Levels、Consistent Nonlocking Reads\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-5/6\u003c/td>\u003ctd>连接与事务使用；InnoDB 恢复；Backup and Recovery、Replication\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>迁移工具：\u003ca href=\"https://documentation.red-gate.com/fd\" target=\"_blank\" rel=\"noopener noreferrer\">Redgate Flyway 官方文档\u003c/a>，先读迁移版本、校验、失败处理与数据库支持；不要假定每种 DDL 都可事务回滚。\u003c/p>\n\u003ca id=\"mybatis\">\u003c/a>\n\u003ch2 id=\"heading-8\">MyBatis：M05/M06\u003c/h2>\n\u003cp>主入口：\u003ca href=\"https://mybatis.org/spring-boot-starter/mybatis-spring-boot-autoconfigure/\" target=\"_blank\" rel=\"noopener noreferrer\">MyBatis Spring Boot Starter\u003c/a>。先读 Requirements 的 Java/Boot/MyBatis-Spring 兼容矩阵，再读自动配置和配置项，并从页面导航进入 MyBatis 映射与动态 SQL 文档。\u003c/p>\n\u003cp>先手写一次 JDBC 事务再对照框架，理解框架隐藏了什么、没有改变什么。\u003c/p>\n\u003ca id=\"spring\">\u003c/a>\n\u003ch2 id=\"heading-9\">Spring：M06\u003c/h2>\n\u003cul>\u003cli>主资料：\u003ca href=\"https://docs.spring.io/spring-framework/reference/\" target=\"_blank\" rel=\"noopener noreferrer\">Spring Framework Reference\u003c/a>，Core/IoC → AOP → Data Access/Transaction → Web MVC → Testing。\u003c/li>\u003cli>工程入口：\u003ca href=\"https://docs.spring.io/spring-boot/reference/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">Spring Boot Reference\u003c/a>，配置、自动装配、Web、安全、测试、生产特性。\u003c/li>\u003c/ul>\n\u003cp>在页面版本选择器切到实际主版本；创建实验报告时引用具体小节。对代理、事务和自动配置的推断要通过实际 Bean/调用链/数据库结果验证。\u003c/p>\n\u003ca id=\"engineering\">\u003c/a>\n\u003ch2 id=\"heading-10\">测试、构建与协作：M07\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://docs.junit.org/6.1.3/overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">JUnit 官方用户指南\u003c/a>：从 Jupiter 的断言、生命周期、参数化测试与扩展机制进入；此处是已核对的版本入口，实际工程以兼容版本为准。\u003c/li>\u003cli>\u003ca href=\"https://maven.apache.org/guides/\" target=\"_blank\" rel=\"noopener noreferrer\">Maven Guides\u003c/a>：生命周期、依赖管理、插件、Wrapper 与可复现构建。\u003c/li>\u003cli>\u003ca href=\"https://git-scm.com/book/en/v2\" target=\"_blank\" rel=\"noopener noreferrer\">Pro Git 官方在线版\u003c/a>：记录变更、分支与合并、远程协作、调试与恢复。\u003c/li>\u003c/ul>\n\u003cp>测试集成依照所选 Boot 的 Testing 章节。旧 JUnit “current”链接会跳转更新版本，因此不把 URL 名称当版本保证。\u003c/p>\n\u003ca id=\"middleware\">\u003c/a>\n\u003ch2 id=\"heading-11\">Redis、RabbitMQ、搜索：M08\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://redis.io/docs/latest/\" target=\"_blank\" rel=\"noopener noreferrer\">Redis 官方文档\u003c/a>：数据类型、Key Expiration、Key Eviction、Persistence、Replication；选择与实验版本一致的行为说明。\u003c/li>\u003cli>\u003ca href=\"https://www.rabbitmq.com/docs\" target=\"_blank\" rel=\"noopener noreferrer\">RabbitMQ 官方文档\u003c/a>：Publisher Confirms / Consumer Acknowledgements → Reliability → Prefetch → Dead Lettering；再读对应队列类型的持久化与故障行为。\u003c/li>\u003cli>\u003ca href=\"https://www.elastic.co/docs\" target=\"_blank\" rel=\"noopener noreferrer\">Elastic 官方文档\u003c/a>：Elasticsearch 的映射、分词、查询、refresh 和 reindex；先学倒排模型，再做实际索引同步。\u003c/li>\u003c/ul>\n\u003ca id=\"distributed\">\u003c/a>\n\u003ch2 id=\"heading-12\">分布式机制：M09\u003c/h2>\n\u003cul>\u003cli>主资料：\u003ca href=\"https://raft.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Raft 作者资料与论文入口\u003c/a>，先理解复制状态机、故障模型，再读选主、日志复制和安全性；不以手写完整算法作为必修。\u003c/li>\u003cli>理论课程：\u003ca href=\"https://pdos.csail.mit.edu/6.5840/\" target=\"_blank\" rel=\"noopener noreferrer\">MIT 6.5840\u003c/a>，沿讲义和阅读列表学习一致性、复制、容错与事务；实验语言不同不影响概念学习，课程实验不是本路线额外必修。\u003c/li>\u003cli>补偿事务：\u003ca href=\"https://microservices.io/patterns/data/saga.html\" target=\"_blank\" rel=\"noopener noreferrer\">Saga 模式作者资料\u003c/a>，比较编排与协同、本地事务和补偿的范围，映射到支付/取消/退款。\u003c/li>\u003cli>\u003ca href=\"https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html\" target=\"_blank\" rel=\"noopener noreferrer\">Debezium Outbox Event Router\u003c/a>：观察事件标识、聚合与消息路由的设计，理解 outbox 记录与事件的关系。课程先用轮询投递，不要求采用 Debezium 的具体部署栈。\u003c/li>\u003cli>可靠投递与故障处理同时参考上方 RabbitMQ Reliability，以及下方 SRE 过载与故障章节。资料中的保证均需按其故障假设解释。\u003c/li>\u003c/ul>\n\u003ca id=\"reliability\">\u003c/a>\n\u003ch2 id=\"heading-13\">SRE：M10\u003c/h2>\n\u003cp>主资料：\u003ca href=\"https://sre.google/sre-book/table-of-contents/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE 在线书\u003c/a>。定点读第 4 章 SLO、第 6 章监控、第 10 章告警、第 12–15 章排障/事故/复盘、第 21–22 章过载与级联失败，以及可靠性测试章节。\u003c/p>\n\u003cp>学习原则与方法，具体目标根据练习的用户流程定义，不照抄其他组织的可用性指标。\u003c/p>\n\u003ca id=\"operations\">\u003c/a>\n\u003ch2 id=\"heading-14\">部署与观测工具：M10\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://docs.docker.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Docker Docs\u003c/a>：镜像、容器、网络、卷、Compose、资源与配置。\u003c/li>\u003cli>\u003ca href=\"https://kubernetes.io/docs/concepts/\" target=\"_blank\" rel=\"noopener noreferrer\">Kubernetes Concepts\u003c/a>：Workloads、Services、Configuration、资源与探针；先读最小部署需要的对象。\u003c/li>\u003cli>\u003ca href=\"https://opentelemetry.io/docs/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry Docs\u003c/a>：信号、上下文传播、采样和 Java 接入；关注高基数、敏感字段与采集成本。\u003c/li>\u003c/ul>\n\u003ca id=\"architecture\">\u003c/a>\n\u003ch2 id=\"heading-15\">业务建模与架构表达：M11\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.domainlanguage.com/ddd/reference/\" target=\"_blank\" rel=\"noopener noreferrer\">DDD Reference（Eric Evans）\u003c/a>：统一语言、实体/值对象、聚合和限界上下文，先映射到 CRM 与交易中的真实概念。\u003c/li>\u003cli>\u003ca href=\"https://spring.io/projects/spring-modulith/\" target=\"_blank\" rel=\"noopener noreferrer\">Spring Modulith\u003c/a>：模块定义、验证、模块测试与事件，作为检验业务边界的工具。\u003c/li>\u003cli>\u003ca href=\"https://c4model.com/\" target=\"_blank\" rel=\"noopener noreferrer\">C4 model 作者网站\u003c/a>：系统上下文、容器、组件图；只画能帮助当前评审的层级。\u003c/li>\u003cli>\u003ca href=\"https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions\" target=\"_blank\" rel=\"noopener noreferrer\">Documenting Architecture Decisions\u003c/a>：记录背景、决定与后果，配合仓库 ADR 模板使用。\u003c/li>\u003c/ul>\n\u003ca id=\"security\">\u003c/a>\n\u003ch2 id=\"heading-16\">安全：M12/M06\u003c/h2>\n\u003cul>\u003cli>主资料：\u003ca href=\"https://cheatsheetseries.owasp.org/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP Cheat Sheet Series\u003c/a>，先读 Authorization、Input Validation、SQL Injection Prevention、CSRF、SSRF、Logging 与 Password Storage，再按项目入口补充。\u003c/li>\u003cli>框架：\u003ca href=\"https://docs.spring.io/spring-security/reference/\" target=\"_blank\" rel=\"noopener noreferrer\">Spring Security Reference\u003c/a>，按实际版本学习 Servlet Security、Authentication、Authorization、CSRF 与测试支持。\u003c/li>\u003c/ul>\n\u003cp>资料入口已核对可访问。后续链接迁移时优先从同一项目官方导航寻找替代入口，并更新此页日期与具体版本，不将搜索摘要作为机制依据。\u003c/p>", "toc": [{"id": "heading-0", "title": "一手资料与版本约定", "level": 1}, {"id": "heading-1", "title": "技术基线与依赖锁定", "level": 2}, {"id": "heading-2", "title": "Java 教程：M01", "level": 2}, {"id": "heading-3", "title": "Java 21 规范与 API：M01/M03/M04", "level": 2}, {"id": "heading-4", "title": "虚拟线程：M03-6", "level": 2}, {"id": "heading-5", "title": "JVM 诊断：M04", "level": 2}, {"id": "heading-6", "title": "计算机基础：M02", "level": 2}, {"id": "heading-7", "title": "MySQL：M05", "level": 2}, {"id": "heading-8", "title": "MyBatis：M05/M06", "level": 2}, {"id": "heading-9", "title": "Spring：M06", "level": 2}, {"id": "heading-10", "title": "测试、构建与协作：M07", "level": 2}, {"id": "heading-11", "title": "Redis、RabbitMQ、搜索：M08", "level": 2}, {"id": "heading-12", "title": "分布式机制：M09", "level": 2}, {"id": "heading-13", "title": "SRE：M10", "level": 2}, {"id": "heading-14", "title": "部署与观测工具：M10", "level": 2}, {"id": "heading-15", "title": "业务建模与架构表达：M11", "level": 2}, {"id": "heading-16", "title": "安全：M12/M06", "level": 2}], "units": [], "checks": []}, {"path": "templates/architecture-decision.md", "title": "架构决策记录模板", "text": "架构决策记录模板 状态：草案 / 已评审 / 已采用 / 已替代（填写其一）。复制后填写，不预设决策结论。 架构模块 问题与约束 日期、任务 ID、参与者（真实或模拟）： 用户/业务目标与成功指标： 必须保护的不变量和安全边界： 团队、时间、预算、流量、存储、可用性约束： 实测事实与假设分别列出： 本次不解决的问题： 可行方案 候选 如何解决问题 正确性/可靠性 开发/运维/迁移成本 主要风险 验证依据 A 保持结构并局部优化 待填 待填 待填 待填 待验证 B 改变结构 待填 待填 待填 待填 待验证 决策与契约 选择与理由；不选其他方案的条件性理由： 数据拥有者、事务边界、API/事件契约、版本兼容： 失败/超时/重复/乱序时行为与恢复责任： 容量与成本估算（单位、假设、敏感性）： 权限、租户、审计和敏感数据处理： 演进与验证 步骤 检查点与通过阈值 失败回退 责任人 回填/准备 待填 待填 待填 小范围切换 待填 待填 待填 观察与扩大 待填 待填 待填 正常、边界、失败测试与证据： 新旧数据如何核对，切回后如何处理新增写入： 何时允许移除旧路径： 哪些信号会改变本决策： 评审意见、修改记录、未解决风险与后续验证：", "html": "\u003ch1 id=\"heading-0\">架构决策记录模板\u003c/h1>\n\u003cp>状态：草案 / 已评审 / 已采用 / 已替代（填写其一）。复制后填写，不预设决策结论。\u003ca href=\"#doc=modules%2Fm11-architecture.md\">架构模块\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">问题与约束\u003c/h2>\n\u003cul>\u003cli>日期、任务 ID、参与者（真实或模拟）：\u003c/li>\u003cli>用户/业务目标与成功指标：\u003c/li>\u003cli>必须保护的不变量和安全边界：\u003c/li>\u003cli>团队、时间、预算、流量、存储、可用性约束：\u003c/li>\u003cli>实测事实与假设分别列出：\u003c/li>\u003cli>本次不解决的问题：\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-2\">可行方案\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"候选表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">候选\u003c/th>\u003cth scope=\"col\">如何解决问题\u003c/th>\u003cth scope=\"col\">正确性/可靠性\u003c/th>\u003cth scope=\"col\">开发/运维/迁移成本\u003c/th>\u003cth scope=\"col\">主要风险\u003c/th>\u003cth scope=\"col\">验证依据\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A 保持结构并局部优化\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B 改变结构\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待验证\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">决策与契约\u003c/h2>\n\u003cul>\u003cli>选择与理由；不选其他方案的条件性理由：\u003c/li>\u003cli>数据拥有者、事务边界、API/事件契约、版本兼容：\u003c/li>\u003cli>失败/超时/重复/乱序时行为与恢复责任：\u003c/li>\u003cli>容量与成本估算（单位、假设、敏感性）：\u003c/li>\u003cli>权限、租户、审计和敏感数据处理：\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-4\">演进与验证\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"步骤表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">步骤\u003c/th>\u003cth scope=\"col\">检查点与通过阈值\u003c/th>\u003cth scope=\"col\">失败回退\u003c/th>\u003cth scope=\"col\">责任人\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>回填/准备\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小范围切换\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003c/tr>\u003ctr>\u003ctd>观察与扩大\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待填\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>正常、边界、失败测试与证据：\u003c/li>\u003cli>新旧数据如何核对，切回后如何处理新增写入：\u003c/li>\u003cli>何时允许移除旧路径：\u003c/li>\u003cli>哪些信号会改变本决策：\u003c/li>\u003cli>评审意见、修改记录、未解决风险与后续验证：\u003c/li>\u003c/ul>", "toc": [{"id": "heading-0", "title": "架构决策记录模板", "level": 1}, {"id": "heading-1", "title": "问题与约束", "level": 2}, {"id": "heading-2", "title": "可行方案", "level": 2}, {"id": "heading-3", "title": "决策与契约", "level": 2}, {"id": "heading-4", "title": "演进与验证", "level": 2}], "units": [], "checks": []}, {"path": "templates/evidence.md", "title": "学习证据记录模板", "text": "学习证据记录模板 复制到自己的记录文件后填写；模板本身不是已完成证据。 方法 · 进度 任务与问题 日期、任务/单元 ID、对应业务不变量： 当前要解释或解决的问题： 前置知识；本次使用了哪些帮助： 独立预测、假设与反例： 判定通过的标准（实验前填写）： 环境与来源 代码仓库/版本或提交： JDK 发行版与补丁版本、框架/数据库/组件版本： 系统、CPU/内存、容器限额、数据库隔离级别及关键配置： 一手资料链接、章节/源码位置、访问日期： 虚构数据生成方式、规模与分布： 可复现步骤 初始化与前置状态： 操作/命令/请求或故障注入时序： 收集证据的位置与方式： 恢复与清理练习环境： 结果 场景 预期 实际 证据位置 通过/未通过及原因 正常 待填 待执行 无 未执行 边界 待填 待执行 无 未执行 失败/恢复 待填 待执行 无 未执行 性能实验另记录：预热、测量时长、样本数、并发/到达率、P50/P95/P99、吞吐、错误率、CPU、内存、GC、连接/队列；相同条件至少三次及波动。并发实验记录同步方式与交错时序。 解释与复测 证据支持哪个假设，排除了什么，哪些仍不确定： 关键机制与适用边界（区分规范保证和当前实现观察）： 修复或方案的代价与退化条件： 闭卷复述：用自己的话解释因果链： 改变一个约束后的变式任务与结果： 本次可认定的等级 L1/L2/L3/L4 与理由： 下一步；在进度表记录的位置：", "html": "\u003ch1 id=\"heading-0\">学习证据记录模板\u003c/h1>\n\u003cp>复制到自己的记录文件后填写；模板本身不是已完成证据。\u003ca href=\"#doc=METHOD.md\">方法\u003c/a> · \u003ca href=\"#doc=PROGRESS.md\">进度\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">任务与问题\u003c/h2>\n\u003cul>\u003cli>日期、任务/单元 ID、对应业务不变量：\u003c/li>\u003cli>当前要解释或解决的问题：\u003c/li>\u003cli>前置知识；本次使用了哪些帮助：\u003c/li>\u003cli>独立预测、假设与反例：\u003c/li>\u003cli>判定通过的标准（实验前填写）：\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-2\">环境与来源\u003c/h2>\n\u003cul>\u003cli>代码仓库/版本或提交：\u003c/li>\u003cli>JDK 发行版与补丁版本、框架/数据库/组件版本：\u003c/li>\u003cli>系统、CPU/内存、容器限额、数据库隔离级别及关键配置：\u003c/li>\u003cli>一手资料链接、章节/源码位置、访问日期：\u003c/li>\u003cli>虚构数据生成方式、规模与分布：\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-3\">可复现步骤\u003c/h2>\n\u003col>\u003cli>初始化与前置状态：\u003c/li>\u003cli>操作/命令/请求或故障注入时序：\u003c/li>\u003cli>收集证据的位置与方式：\u003c/li>\u003cli>恢复与清理练习环境：\u003c/li>\u003c/ol>\n\u003ch2 id=\"heading-4\">结果\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">预期\u003c/th>\u003cth scope=\"col\">实际\u003c/th>\u003cth scope=\"col\">证据位置\u003c/th>\u003cth scope=\"col\">通过/未通过及原因\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待执行\u003c/td>\u003ctd>无\u003c/td>\u003ctd>未执行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>待填\u003c/td>\u003ctd>待执行\u003c/td   <script>(() => {
  'use strict';
  const docs = window.COURSE.docs;
  const byPath = Object.assign(Object.create(null), Object.fromEntries(docs.map(d => [d.path, d])));
  const modules = docs.filter(d => d.path.startsWith('modules/'));
  const stages = docs.filter(d => d.path.startsWith('practice/stage-'));
  const allUnits = modules.flatMap(d => d.units);
  const unitIds = new Set(allUnits.map(u => u.id));
  const checkIds = new Set(docs.flatMap(d => d.checks.map(c => c.id)));
  const KEY = 'java-learning-atlas-v1';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
  const route = (path, section = '') => '#doc=' + encodeURIComponent(path) + (section ? '&section=' + encodeURIComponent(section) : '');
  const moduleInfo = [
    ['语言与核心库', '对象、泛型、集合与现代 Java。把业务规则写进可靠的代码。', 0, '{ }', 'Java / Collections'],
    ['计算机基础与算法', '沿一次请求，理解数据结构、操作系统与网络的协作。', 0, 'O(n)', 'OS / Network'],
    ['并发编程', '从竞态到线程池，回答怎样保证正确、怎样限制资源。', 0, '⇄', 'JMM / Threads'],
    ['JVM 与性能诊断', '用线程、内存与性能证据，把“很慢”变成具体的原因。', 0, '⌁', 'JFR / GC'],
    ['数据库与数据访问', '建模、索引与事务。既保证数据正确，也解释查询成本。', 1, '▤', 'SQL / InnoDB'],
    ['Spring 与 Web 工程', '看清请求、代理与事务的路径，理解注解背后的行为。', 1, '↗', 'Spring / HTTP'],
    ['软件设计与工程质量', '让测试保护修改，让清晰的边界降低变化成本。', 1, '✓', 'Design / Testing'],
    ['缓存、消息与搜索', '理解加速与解耦的收益，也理解它们引入的失败方式。', 2, '≋', 'Redis / RabbitMQ'],
    ['分布式系统', '从部分失败出发，设计幂等、可靠事件与一致性策略。', 2, '⋈', 'Outbox / Saga'],
    ['部署与可靠性', '让系统可交付、可观测、可恢复，并验证服务目标。', 2, '◉', 'SLO / Recovery'],
    ['业务建模与架构设计', '根据业务和团队约束划分边界，留下有依据的取舍。', 2, '⊞', 'DDD / Decisions'],
    ['安全与技术协作', '保护身份与数据边界，让设计被团队理解和验证。', 1, '◇', 'Security / Review']
  ];
  const phaseInfo = [
    ['诊断基础', '用四个小任务定位薄弱环节，先找到自己的出发点。', '四项诊断 · 能力矩阵', '从这里开始'],
    ['业务闭环', '把客户、商机、报价和订单连起来，保护规则与数据。', '10 项任务 · 13 个验收场景', '做正确'],
    ['并发与排障', '加入库存与模拟支付，复现竞争、定位瓶颈、验证优化。', '库存与支付 · 故障诊断', '看透机制'],
    ['故障下运行', '让缓存失效、消息重投和服务重启都能得到明确处理。', '可靠事件 · 观测与恢复', '应对失败'],
    ['架构决策', '比较可行方案，再完成一次有检查点、能回退的迁移。', '方案比较 · 迁移实验', '学会取舍'],
    ['真实迁移', '将方法带回实际工作，用团队反馈和业务结果修正判断。', '真实问题 · 团队反馈', '创造价值']
  ];
  const levels = ['未开始', '学习中', 'L1 · 能解释', 'L2 · 能实现', 'L3 · 能诊断', 'L4 · 能权衡'];
  const fresh = () => ({schema: 1, units: {}, notes: {}, checks: {}, quiz: {}, bookmarks: [], last: ''});
  let state = fresh();
  let storageWarning = false;
  function validateState(input) {
    if (!input || typeof input !== 'object' || Array.isArray(input) || input.schema !== 1) throw new Error('备份格式不正确或版本不受支持。');
    const clean = fresh();
    for (const [id, value] of Object.entries(input.units || {})) {
      if (unitIds.has(id) && Number.isInteger(value) && value >= 0 && value <= 5) clean.units[id] = value;
    }
    for (const [path, text] of Object.entries(input.notes || {})) {
      if (byPath[path] && typeof text === 'string' && text.length <= 50000) clean.notes[path] = text;
    }
    for (const [id, checked] of Object.entries(input.checks || {})) {
      if (checkIds.has(id) && checked === true) clean.checks[id] = true;
    }
    for (const [id, answer] of Object.entries(input.quiz || {})) {
      if (/^q(?:[1-9]|1[0-2])$/.test(id) && Number.isInteger(answer) && answer >= 0 && answer < 3) clean.quiz[id] = answer;
    }
    clean.bookmarks = Array.isArray(input.bookmarks) ? [...new Set(input.bookmarks.filter(p => byPath[p]))] : [];
    clean.last = byPath[input.last] ? input.last : '';
    return clean;
  }
  try { const raw = localStorage.getItem(KEY); if (raw) state = validateState(JSON.parse(raw)); }
  catch (_) { storageWarning = true; }
  let toastTimer;
  function toast(message) {
    $('#toast').textContent = message; $('#toast').classList.add('visible');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('visible'), 3500);
  }

  function renderLab() {
    return pageHead('MAKE THE INVISIBLE VISIBLE', '把机制，亲手走一遍。', '先预测结果，再推进事件。观察同一段逻辑，在不同顺序下会发生什么。') +
      `<div class="experiment-tabs" role="group" aria-label="选择互动实验"><button data-lab-tab="race" class="${labType==='race'?'selected':''}" aria-pressed="${labType==='race'}">01 / 库存竞态</button><button data-lab-tab="outbox" class="${labType==='outbox'?'selected':''}" aria-pressed="${labType==='outbox'}">02 / 可靠消息</button></div><div class="lab-layout"><section class="experiment"><div class="experiment-head"><div class="eyebrow">${labType==='race'?'CONCURRENCY / INTERLEAVING':'DISTRIBUTED / FAILURE WINDOW'}</div><h2>${labType==='race'?'1 件库存，2 个请求。':'消息重复，业务不必重复。'}</h2><p>${labType==='race'?'把“读库存”和“写库存”分开，看看重复出售发生在哪里。':'订单与 outbox 同事务写入，消费者在数据库里去重。沿故障窗口检查结果。'}</p></div>${labType==='race'?`<div class="mode-switch" role="group" aria-label="选择库存方案"><button data-race-mode="unsafe" class="${!labSafe?'selected':''}" aria-pressed="${!labSafe}">先检查，再写入</button><button data-race-mode="safe" class="${labSafe?'selected':''}" aria-pressed="${labSafe}">数据库原子条件更新</button></div>`:`<div class="outbox-controls"><label>在什么时刻故障？<select id="outbox-fault"><option value="publish" ${outboxFault==='publish'?'selected':''}>提交后，发布前</option><option value="mark" ${outboxFault==='mark'?'selected':''}>发布确认后，标记前</option><option value="ack" ${outboxFault==='ack'?'selected':''}>消费者提交后，确认前</option></select></label><label class="toggle-label"><input id="deduplicate" type="checkbox" ${deduplicate?'checked':''}>消费者去重与更新同事务</label></div>`}<div id="lab-stage">${labStage()}</div><div class="lab-controls"><span class="mono" id="lab-step-count">STEP ${labStep} / ${labLimit()}</span><div class="actions"><button class="btn secondary" data-lab-action="reset">重新开始</button><button class="btn" data-lab-action="next" ${labStep>=labLimit()?'disabled':''}>下一步 →</button></div></div></section><aside class="lab-guide"><span class="pill">思考提示</span><h3>${labType==='race'?'余量没有变成负数，就一定没超卖？':'确认成功，确认的究竟是什么？'}</h3><p>${labType==='race'?'同时关注“数据库余量”和“成功卖出数”。两个请求各拿着旧快照，可能都成功写入 0，却卖出了 2 件。':'区分业务提交、broker 接受、消费者提交和消息确认。它们之间的任一间隙，都可能发生故障。'}</p><details class="answer-card"><summary>看完演示后，再想一步</summary><p>${labType==='race'?'如果服务变成两个实例，本地 synchronized 还能保护同一份库存吗？原子边界应放在共同访问的资源处。':'如果先提交去重记录，再单独更新统计，中途退出会不会漏处理？两个动作必须共享正确的事务边界。'}</p></details><a class="text-link" href="${route(modules[labType==='race'?2:8].path)}">回到模块，继续实验 ↗</a><div class="lab-disclaimer">这是固定时序的教学模型，不运行真实线程、数据库或消息队列。请按实践手册在真实组件上复现。</div></aside></div>`;
  }
  function labLimit(){return labType==='race'?(labSafe?2:4):4;}
  function labStage(){
    if(labType==='outbox')return outboxStage();
    const step=labStep;
    const stock=labSafe?(step>=1?0:1):(step>=3?0:1);
    const sold=labSafe?(step>=1?1:0):(step>=3?step-2:0);
    const a=labSafe?(step>=1?'条件满足，原子扣减成功':'等待提交条件更新'):(step===0?'等待读取':step<3?'已读到 1，准备写入':'按旧值 1 写入 0，成功');
    const b=labSafe?(step>=2?'条件不满足，影响 0 行，拒绝':'等待提交条件更新'):(step<2?'等待读取':step<4?'已读到 1，准备写入':'也按旧值 1 写入 0，成功');
    const messages=labSafe?['先预测：两个请求会成功几个？把检查和扣减放入数据库同一条原子更新。','A 的条件更新匹配一行并扣减成功。库存从 1 变成 0。','B 的条件更新不匹配，影响 0 行。只有 A 成功，库存和成功数保持一致。']:['初始库存为 1。两个请求准备执行“读取 → 判断 → 写回”。','A 读到 1。它还没有写回；另一个请求仍能读到同样的值。','B 也读到 1。现在两个请求都认为自己可以购买。','A 根据自己读到的 1，写回 0，并向调用方返回成功。','B 也根据旧值 1，写回 0，并返回成功。余量仍是 0，但成功卖出 2 件：超卖了。'];
    return `<div class="race-diagram"><div class="request-box ${(labSafe?step===1:step===1||step===3)?'active':''}"><span class="request-label">REQUEST A</span><h3>请求 A</h3><p>${a}</p></div><div class="stock-box"><span>共享库存</span><strong>${stock}</strong><small>初始 1 件</small></div><div class="request-box ${(labSafe?step===2:step===2||step===4)?'active':''}"><span class="request-label">REQUEST B</span><h3>请求 B</h3><p>${b}</p></div></div><div class="lab-metrics"><div><span>剩余库存</span><strong>${stock}</strong></div><div><span>成功卖出</span><strong class="${sold>1?'bad-text':''}">${sold}</strong></div><div><span>业务不变量</span><strong class="${sold>1?'bad-text':''}">${sold>1?'已破坏':step===labLimit()?'通过':'观察中'}</strong></div></div><div class="lab-event ${sold>1?'warning':''}" role="status" aria-live="polite"><b>${step===0?'先想一想':`第 ${step} 步`}</b><p>${messages[step]}</p></div><pre class="experiment-code"><code>${labSafe?'UPDATE inventory\nSET available = available - 1\nWHERE sku = ? AND available > 0;\n// 以受影响行数判断是否成功': 'int seen = readStock();\nif (seen > 0) {\n    writeStock(seen - 1);\n    return SUCCESS;\n}'}</code></pre>`;
  }
  function outboxStage(){
    const step=labStep, duplicate=outboxFault!=='publish';
    const committed=step>=1;
    const sent=step>=3?(duplicate?2:1):step>=2&&duplicate?1:0;
    const effects=step>=4?(duplicate&&!deduplicate?2:1):step>=2&&outboxFault==='ack'?1:0;
    const explanations={publish:['本地事务还未提交。预测：提交后立刻退出，事件会丢吗？','订单和 outbox 一起提交。即使尚未发布，事件记录已经持久存在。','发布前进程退出。订单仍然有效，outbox 也仍然待投递。','投递器重启，从 outbox 重新读取并发送事件。','消费者处理并提交业务变化，随后确认消息。业务效果出现一次。'],mark:['预测：broker 已接受事件，但发送标记没写入，会发生什么？','订单和 outbox 一起提交。事件现在可以被投递。','broker 接受了一次事件，投递器在标记已发送前退出。','重启后 outbox 仍显示待发送，投递器再发一次；同一事件出现两次投递。',deduplicate?'消费者持久化去重与业务更新同事务，第二次事件不重复增加成交额。':'没有业务去重，两次投递各增加一次成交额。Outbox 解决漏发，不能代替消费者幂等。'],ack:['预测：CRM 已提交，但消息确认还没发出，重启后怎样？','订单和 outbox 一起提交。事件投递给消费者。','消费者已提交一次 CRM 更新，但在确认消息前退出。','消息没有被确认，broker 再次投递同一事件。',deduplicate?'去重记录与第一次 CRM 更新同事务提交，重投时可识别，业务效果仍为一次。':'没有持久化去重，重投再次更新 CRM，业务效果变成两次。']};
    return `<div class="delivery-flow"><div class="${committed?'done':''}"><b>01</b><strong>订单</strong><small>${committed?'已提交':'待提交'}</small></div><span>→</span><div class="${committed?'done':''}"><b>02</b><strong>Outbox</strong><small>${committed?'记录已持久化':'同事务写入'}</small></div><span>→</span><div class="${sent?'done':''}"><b>03</b><strong>消息投递</strong><small>${sent} 次</small></div><span>→</span><div class="${effects?'done':''}"><b>04</b><strong>CRM 更新</strong><small>${effects} 次生效</small></div></div><div class="lab-metrics"><div><span>订单事实</span><strong>${committed?1:0}</strong></div><div><span>消息投递</span><strong>${sent}</strong></div><div><span>业务效果</span><strong class="${effects>1?'bad-text':''}">${effects}</strong></div></div><div class="lab-event ${effects>1?'warning':''}" role="status" aria-live="polite"><b>${step===0?'先想一想':`第 ${step} 步`}</b><p>${explanations[outboxFault][step]}</p></div><div class="outbox-rule"><strong>两个原子边界</strong><p>生产端：业务事实 + Outbox。<br>消费端：去重记录 + 业务更新。提交后再确认消息。</p></div>`;
  }
  function updateLab(){
    $('#lab-stage').innerHTML=labStage();$('#lab-step-count').textContent=`STEP ${labStep} / ${labLimit()}`;
    $('[data-lab-action="next"]').disabled=labStep>=labLimit();
  }
  function renderQuiz() {
    const q=questions[quizIndex];
    const chosen=state.quiz[q.id];
    const answered=Number.isInteger(chosen);
    const correct=questions.filter(x=>state.quiz[x.id]===x.answer).length;
    return pageHead('THINK BEFORE YOU REVEAL','先判断，再找到依据。','12 个真实情景，检查你能否把原理迁移到业务。答题不计入掌握进度。')+
      `<div class="quiz-layout"><section class="quiz-card"><div class="quiz-meta"><span class="pill">${q.unit} / ${moduleInfo[q.module][0]}</span><span class="mono">${String(quizIndex+1).padStart(2,'0')} / 12</span></div><h2>${q.title}</h2><p class="quiz-prompt">${q.prompt}</p><div class="quiz-options" role="group" aria-label="选择一个答案">${q.options.map((option,i)=>`<button data-answer="${i}" class="quiz-option ${answered&&i===q.answer?'correct':''} ${answered&&i===chosen&&chosen!==q.answer?'incorrect':''}" ${answered?'disabled':''}><span>${String.fromCharCode(65+i)}</span><p>${option}</p>${answered&&i===q.answer?'<b>✓</b>':answered&&i===chosen?'<b>×</b>':''}</button>`).join('')}</div><div id="quiz-feedback" class="quiz-feedback ${answered?(chosen===q.answer?'good':'review'):''}" role="status" aria-live="polite">${answered?`<strong>${chosen===q.answer?'判断正确。再试着解释为什么。':'这个问题值得再想一步。'}</strong><p>${q.explanation}</p><a class="text-link" href="${route(modules[q.module].path)}">回到 ${q.unit} 深入学习 ↗</a>`:'选择之后会显示判断依据。先不要查资料，试着说出自己的理由。'}</div><div class="quiz-controls"><button class="btn secondary" data-quiz-action="prev" ${quizIndex===0?'disabled':''}>← 上一题</button>${answered?'<button class="text-link" data-quiz-action="retry">重新思考这道题</button>':''}<button class="btn" data-quiz-action="next" ${quizIndex===11?'disabled':''}>下一题 →</button></div></section><aside class="quiz-aside"><div class="eyebrow">YOUR CHECKPOINTS</div><h3>理解，逐点连接。</h3><div class="question-dots">${questions.map((x,i)=>`<button data-question="${i}" class="${i===quizIndex?'current':''} ${state.quiz[x.id]===x.answer?'passed':Number.isInteger(state.quiz[x.id])?'review':''}" aria-label="第 ${i+1} 题：${x.title}" ${i===quizIndex?'aria-current="step"':''}>${String(i+1).padStart(2,'0')}</button>`).join('')}</div><p class="quiz-score"><strong>${correct}</strong> / 12 当前答对</p><p class="muted" style="font-size:11px">正确答案只是一小步。回到实验，用证据证明自己的理解。</p><a class="text-link" href="${route(modules[q.module].path,modules[q.module].toc.find(h=>h.title==='自测与模块验收').id)}" style="margin-top:20px">继续本模块的开放题 ↗</a></aside></div>`;
  }
  let currentDoc = null;
  function closeMenu() { document.body.classList.remove('nav-open'); $('#menu-button').setAttribute('aria-expanded','false'); $('#nav-scrim').hidden=true; }
  function navigate() {
    const hash=location.hash.slice(1)||'home';
    // #main is a skip link, not an application route.
    if(hash==='main'){ $('#main').focus(); window.scrollTo({top:0}); return; }
    currentDoc=null;
    let content, active;
    if(hash.startsWith('doc=')){
      const params=new URLSearchParams(hash); const path=params.get('doc');
      currentDoc=byPath[path]; active=currentDoc?.units.length?'modules':path?.startsWith('practice/')?'stages':'reader';
      content=currentDoc?renderDoc(currentDoc):`<div class="empty-state"><h1>没有找到这份资料</h1><p>入口可能已变更，可以回到全部文档继续查找。</p><a href="#library" class="btn" style="margin-top:20px">打开文档书架</a></div>`;
    }else{
      document.body.classList.remove('reader-focus');
      const pages={home:renderHome,modules:renderModules,stages:renderStages,library:renderLibrary,progress:renderProgress,lab:renderLab,quiz:renderQuiz};
      active=pages[hash]?hash:'home'; content=pages[active]();
    }
    $('#main').innerHTML=content; updateChrome(active); closeMenu();
    document.title=(currentDoc?currentDoc.title:$('#main h1')?.textContent||'学习地图')+' · Java 进阶图谱';
    document.querySelectorAll('[data-check]').forEach(el=>{el.checked=!!state.checks[el.dataset.check];});
    $('#main').focus({preventScroll:true});
    const section=new URLSearchParams(hash).get('section');
    if(section && document.getElementById(section)) document.getElementById(section).scrollIntoView({behavior:'instant',block:'start'});
    else window.scrollTo({top:0,behavior:'instant'});
  }
  function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  document.addEventListener('click',event=>{
    const labTab=event.target.closest('[data-lab-tab]');
    if(labTab){labType=labTab.dataset.labTab;labStep=0;$('#main').innerHTML=renderLab();$(`[data-lab-tab="${labType}"]`).focus();return;}
    const mode=event.target.closest('[data-race-mode]');
    if(mode){labSafe=mode.dataset.raceMode==='safe';labStep=0;$('#main').innerHTML=renderLab();$(`[data-race-mode="${labSafe?'safe':'unsafe'}"]`).focus();return;}
    const labAction=event.target.closest('[data-lab-action]');
    if(labAction){labStep=labAction.dataset.labAction==='reset'?0:Math.min(labStep+1,labLimit());updateLab();return;}
    const answer=event.target.closest('[data-answer]');
    if(answer){const q=questions[quizIndex];if(!Number.isInteger(state.quiz[q.id])){state.quiz[q.id]=Number(answer.dataset.answer);save();$('#main').innerHTML=renderQuiz();$('#quiz-feedback').setAttribute('tabindex','-1');$('#quiz-feedback').focus({preventScroll:true});}return;}
    const question=event.target.closest('[data-question]');
    const quizAction=event.target.closest('[data-quiz-action]');
    if(question||quizAction){if(question)quizIndex=Number(question.dataset.question);else if(quizAction.dataset.quizAction==='retry'){delete state.quiz[questions[quizIndex].id];save();}else quizIndex=Math.max(0,Math.min(11,quizIndex+(quizAction.dataset.quizAction==='next'?1:-1)));$('#main').innerHTML=renderQuiz();$('.quiz-card h2').setAttribute('tabindex','-1');$('.quiz-card h2').focus({preventScroll:true});return;}
    const filter=event.target.closest('[data-filter]');
    if(filter){document.querySelectorAll('[data-filter]').forEach(el=>{const on=el===filter;el.classList.toggle('selected',on);el.setAttribute('aria-pressed',String(on));});document.querySelectorAll('.module-card').forEach(el=>{el.hidden=filter.dataset.filter!=='-1'&&el.dataset.group!==filter.dataset.filter;});}
    const phase=event.target.closest('[data-phase]');
    if(phase){document.querySelectorAll('[data-phase]').forEach(el=>{const on=el===phase;el.classList.toggle('selected',on);el.setAttribute('aria-pressed',String(on));});$('#phase-detail').innerHTML=phaseDetail(Number(phase.dataset.phase));}
    const action=event.target.closest('[data-action]');
    if(!action)return;
    switch(action.dataset.action){
      case 'focus': document.body.classList.toggle('reader-focus');action.textContent=document.body.classList.contains('reader-focus')?'退出专注':'专注阅读';break;
      case 'print': window.print();break;
      case 'bookmark': {const path=action.dataset.path;const found=state.bookmarks.includes(path);state.bookmarks=found?state.bookmarks.filter(p=>p!==path):[...state.bookmarks,path];save();action.textContent=found?'☆ 收藏':'★ 已收藏';action.setAttribute('aria-pressed',String(!found));break;}
      case 'export': download('java-learning-progress.json',JSON.stringify(state,null,2),'application/json');toast('已导出学习记录，请妥善保存。');break;
      case 'reset': if(confirm('确定清空当前浏览器里的自评、手记、收藏与答题记录吗？建议先导出备份。原始学习文档不受影响。')){state=fresh();save();navigate();toast('本地记录已清空。');}break;
    }
  });
  document.addEventListener('change',async event=>{
    const el=event.target;
    if(el.id==='outbox-fault'){outboxFault=el.value;labStep=0;updateLab();}
    if(el.id==='deduplicate'){deduplicate=el.checked;labStep=0;updateLab();}
    if(el.matches('[data-unit]')){state.units[el.dataset.unit]=Number(el.value);save();const status=document.querySelector(`[data-status="${el.dataset.unit}"]`);if(status)status.textContent=levels[Number(el.value)];updateChrome('modules');}
    if(el.matches('[data-check]')){if(el.checked)state.checks[el.dataset.check]=true;else delete state.checks[el.dataset.check];save();}
    if(el.id==='import-progress'&&el.files[0]){
      try{if(el.files[0].size>3000000)throw new Error('文件过大，请选择本页面导出的 JSON 备份。');const imported=validateState(JSON.parse(await el.files[0].text()));if(confirm('导入将替换当前浏览器里的学习记录。确定继续吗？')){state=imported;save();navigate();toast('学习记录已导入。');}}
      catch(error){toast(error.message||'无法读取备份，请检查文件。');}
      el.value='';
    }
  });
  document.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-note]')){state.notes[el.dataset.note]=el.value;$('#note-status').textContent=save()?'已保存到当前浏览器':'未能持久保存，请导出备份';}});
  const dialog=$('#search-dialog');
  function openSearch(){if(!dialog.open)dialog.showModal();$('#search-input').focus();search($('#search-input').value);}
  function highlight(text,query){const idx=text.toLowerCase().indexOf(query.toLowerCase());if(idx<0)return esc(text);return esc(text.slice(0,idx))+'<mark>'+esc(text.slice(idx,idx+query.length))+'</mark>'+esc(text.slice(idx+query.length));}
  function search(value){
    const q=value.trim();
    if(!q){$('#search-count').textContent='搜索 27 份学习文档，支持中文与单元编号。';$('#search-results').innerHTML='<div class="empty-state"><h3>你想弄懂哪个问题？</h3><p>例如：事务、库存、JVM、Outbox、M03。</p></div>';return;}
    const matches=docs.map(doc=>({doc,index:doc.text.toLowerCase().indexOf(q.toLowerCase())})).filter(x=>x.index>=0).sort((a,b)=>Number(b.doc.title.toLowerCase().includes(q.toLowerCase()))-Number(a.doc.title.toLowerCase().includes(q.toLowerCase())));
    $('#search-count').textContent=`找到 ${matches.length} 份相关资料`;
    $('#search-results').innerHTML=matches.map(({doc,index})=>{const excerpt=doc.text.slice(Math.max(0,index-38),index+110).replace(/[\n|#]/g,' ');return `<a class="search-result" href="${route(doc.path)}"><strong>${highlight(doc.title,q)}</strong><p>${highlight(excerpt,q)}…</p></a>`;}).join('')||'<div class="empty-state"><h3>暂时没有匹配的内容</h3><p>试着换一个更短的关键词，或输入模块编号。</p></div>';
  }
  $('#search-trigger').addEventListener('click',openSearch);
  $('#search-close').addEventListener('click',()=>dialog.close());
  $('#search-input').addEventListener('input',e=>search(e.target.value));
  $('#search-results').addEventListener('click',e=>{if(e.target.closest('a'))dialog.close();});
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
  $('#menu-button').addEventListener('click',()=>{const on=document.body.classList.toggle('nav-open');$('#menu-button').setAttribute('aria-expanded',String(on));$('#nav-scrim').hidden=!on;});
  $('#nav-scrim').addEventListener('click',closeMenu);
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();openSearch();}if(e.key==='Escape')closeMenu();});
  window.addEventListener('hashchange',navigate);
  navigate();
  if(storageWarning)toast('未能读取原有本地记录；可以在学习记录中导入备份。');
})();
</script>
</body>
</html>
