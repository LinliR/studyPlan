u003ctd>Cache Aside、一致性窗口、穿透/击穿/雪崩、热键、降级\u003c/td>\u003ctd>M08-1、M09-1\u003c/td>\u003ctd>注入并发更新与失效、缓存中断、批量过期\u003c/td>\u003ctd>说明陈旧值来源和收敛手段；降级不把数据库打垮\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M08-3\u003c/td>\u003ctd>RabbitMQ 路由/队列、发布确认、消费者确认、持久化、背压\u003c/td>\u003ctd>M05-4、M06\u003c/td>\u003ctd>从模拟发布到持久化消费；在确认前后停止组件\u003c/td>\u003ctd>区分 broker 接受、投递与业务提交；不宣称“一次且仅一次”业务效果由 MQ 自动保证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M08-4\u003c/td>\u003ctd>幂等、顺序、重试、死信、积压、重放、毒消息\u003c/td>\u003ctd>M08-3、M05-4\u003c/td>\u003ctd>CRM 成交统计重复消费，失败后重启与重放；完成后接 M09-3 的 Outbox\u003c/td>\u003ctd>去重与业务更新同事务；重试有上限，积压有观测与处理入口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M08-5\u003c/td>\u003ctd>倒排索引、分词、查询相关性、近实时可见性、数据同步与重建\u003c/td>\u003ctd>M05-3、M08-4\u003c/td>\u003ctd>做客户名称检索或最小倒排模型，对比关系库查询\u003c/td>\u003ctd>新建/修改/删除都可同步或重建；接受并说明可见性延迟，过滤权限范围\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：客户摘要缓存。\u003c/strong> 定义数据库为事实来源，缓存只保存可重建摘要。并发“读旧值、更新数据库、删除缓存、旧值回填”，画出陈旧值形成的时序，再选择 TTL/版本校验等策略并解释残余窗口。\u003c/p>\n\u003cp>\u003cstrong>实验 B：成交事件。\u003c/strong> 消费者更新客户统计并登记事件 ID，在数据库提交后、确认消息前故意退出；重启后观察重投，验证成交额没有重复增加。另一轮在提交前退出，验证事务回滚后消息仍可处理。\u003c/p>\n\u003cp>\u003cstrong>实验 C：客户搜索。\u003c/strong> 至少验证新客户、重命名、删除/停用、中文分词和跨负责人访问。搜索结果只作为检索入口，详情权限在服务端重新校验。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>命中缓存；成交更新统计；新客户可检索\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>空值、热键、消息乱序、同 ID 重放、索引尚未刷新\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>缓存断连、确认丢失、消费者重启、永久格式错误、搜索索引丢失\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>Redis 可用是否意味着缓存数据一定完整？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 区分故障切换、淘汰、持久化与业务事实来源。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>发布确认成功是否代表 CRM 统计已完成？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 解释确认所属层次与业务状态查询方式。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么“先写去重表，再单独更新统计”仍可能漏处理？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 给出中间崩溃时序，并用同事务修复。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>搜索返回旧名称时如何判断是故障还是允许延迟？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 关联同步机制与可见性目标。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>验收必须提交组件失败矩阵、重复消费证据和一次重建/重放记录；Redis/MQ 的持久化与队列配置注明版本和具体值。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=middleware\">Redis 文档\u003c/a>，按数据类型、过期、淘汰、持久化阅读；\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=middleware\">RabbitMQ 文档\u003c/a> 先读 confirmations，再读可靠性、prefetch、死信。搜索查同页 Elasticsearch 官方入口。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>Kafka、Redis Cluster、Lua 脚本深入、CDC、搜索集群调优为选修。Kafka 对照重点是日志/分区/消费位点语义；不为凑技术栈同时引入两种 MQ。\u003c/p>", "toc": [{"id": "heading-0", "title": "M08 缓存、消息与搜索", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M08-1", "topic": "Redis 数据结构、过期/淘汰、持久化、复制、热点与容量", "prereq": "M01-2、M05-6 基础", "method": "为客户摘要选结构，限制内存观察淘汰", "criteria": "解释缓存中可丢失什么，区分 TTL、淘汰与持久化承诺"}, {"id": "M08-2", "topic": "Cache Aside、一致性窗口、穿透/击穿/雪崩、热键、降级", "prereq": "M08-1、M09-1", "method": "注入并发更新与失效、缓存中断、批量过期", "criteria": "说明陈旧值来源和收敛手段；降级不把数据库打垮"}, {"id": "M08-3", "topic": "RabbitMQ 路由/队列、发布确认、消费者确认、持久化、背压", "prereq": "M05-4、M06", "method": "从模拟发布到持久化消费；在确认前后停止组件", "criteria": "区分 broker 接受、投递与业务提交；不宣称“一次且仅一次”业务效果由 MQ 自动保证"}, {"id": "M08-4", "topic": "幂等、顺序、重试、死信、积压、重放、毒消息", "prereq": "M08-3、M05-4", "method": "CRM 成交统计重复消费，失败后重启与重放；完成后接 M09-3 的 Outbox", "criteria": "去重与业务更新同事务；重试有上限，积压有观测与处理入口"}, {"id": "M08-5", "topic": "倒排索引、分词、查询相关性、近实时可见性、数据同步与重建", "prereq": "M05-3、M08-4", "method": "做客户名称检索或最小倒排模型，对比关系库查询", "criteria": "新建/修改/删除都可同步或重建；接受并说明可见性延迟，过滤权限范围"}], "checks": []}, {"path": "modules/m09-distributed.md", "title": "M09 分布式系统", "text": "M09 分布式系统 总纲 · 阶段 3 · 阶段 4 学习问题与前置 请求超时后，操作究竟成功了吗？多个组件失败时，怎样守住库存与支付的不变量？前置：M03 并发、M05 事务、M02 网络；M08 消息基础与本模块联动。目标 L3/L4。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M09-1 部分失败、超时、重试、幂等、指数退避与抖动、重试预算 M02-5、M06-4 注入“下游提交成功但响应丢失”，画时序 不把超时等同失败；重试有次数/总时限/可重试条件 M09-2 线性一致性、顺序/因果/最终一致性、复制/分区、CAP 边界、共识与多数派 M05-4/6、M09-1 比较库存与客户统计要求；阅读 Raft 日志复制过程 用具体操作说出允许什么历史；CAP 讨论明确发生分区，区分复制与备份 M09-3 本地事务与消息双写、Outbox、至少一次投递、幂等消费 M08-3/4、M05-4 原子写业务与 outbox，投递后再记发送结果；逐点故障注入 崩溃重启可继续投递，重复可消解，业务提交不会永久漏事件 M09-4 2PC、Saga、补偿、TCC 概览、状态机与对账 M09-1/3 画支付成功与取消竞争，设计补偿/对账状态 补偿是新业务动作，有失败与重试；不声称分布式回滚必然恢复原状 M09-5 限流、熔断、降级、隔离、背压、负载均衡与服务发现 M03-4、M09-1 让一个下游变慢，限制在途数并测量其他接口 保护关键业务，重试不放大故障；恢复有半开/探测策略 M09-6 分布式锁、租约、过期、时钟与 fencing token M03-2、M09-2 暂停旧持有者直到租约失效，再让其恢复写入 能证明目标资源拒绝陈旧写入，或说明为何改用数据库条件更新更可靠 最小实验与项目映射 实验 A：可靠成交。 在订单支付确认事务内写入 OrderPaid outbox。分别在事务提交前、提交后发布前、broker 确认后标记前退出。重启投递器，观察事件最终到达，CRM 统计只产生一次业务效果。 实验 B：取消与支付。 用屏障控制取消请求与支付回调的先后，明确订单、库存预留和模拟支付记录的事实来源。晚到支付不能直接让已取消订单复活，应进入已定义的退款/对账流程。 场景 验证 正常 单次支付事件最终更新 CRM 统计 边界 重复请求、乱序回调、旧版本事件、已取消订单的晚到成功 失败 网络超时但提交成功、投递器重启、补偿失败、租约过期后的旧写入 自测与模块验收 能否仅靠重试保证业务最终成功？ 判断依据 举出永久错误和重复副作用，并说明退出与人工处理条件。 “最终一致”需要哪些机制才能成立？ 判断依据 说明重试、补偿、对账及终止条件，不只描述结果。 为什么 Outbox 仍可能重复投递？ 判断依据 指出确认与标记之间的故障窗口，说明消费者如何处理。 Raft 多数派解决了什么，没解决什么？ 判断依据 区分复制状态一致、业务跨系统事务和可用性限制。 提交一张故障时序图、一套失败矩阵和一份 Outbox/Saga 取舍记录。实验应包含从失败到收敛的全过程。 一手资料与阅读顺序 主入口： Raft 作者资料与分布式机制 ，先理解网络/进程故障模型，再读日志复制与安全性；Outbox 阅读 Debezium 官方资料，消息确认回到 RabbitMQ 文档。学习 Outbox 不要求先部署 CDC。 选修与边界 完整 Raft 实现、跨地域多活、CRDT、分布式数据库内核、Service Mesh 为选修。先完成单数据库事务与故障恢复，再决定是否引入跨服务事务。", "html": "\u003ch1 id=\"heading-0\">M09 分布式系统\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-03-resilience.md\">阶段 3\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-04-architecture.md\">阶段 4\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>请求超时后，操作究竟成功了吗？多个组件失败时，怎样守住库存与支付的不变量？前置：M03 并发、M05 事务、M02 网络；M08 消息基础与本模块联动。目标 L3/L4。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M09-1\u003c/td>\u003ctd>部分失败、超时、重试、幂等、指数退避与抖动、重试预算\u003c/td>\u003ctd>M02-5、M06-4\u003c/td>\u003ctd>注入“下游提交成功但响应丢失”，画时序\u003c/td>\u003ctd>不把超时等同失败；重试有次数/总时限/可重试条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M09-2\u003c/td>\u003ctd>线性一致性、顺序/因果/最终一致性、复制/分区、CAP 边界、共识与多数派\u003c/td>\u003ctd>M05-4/6、M09-1\u003c/td>\u003ctd>比较库存与客户统计要求；阅读 Raft 日志复制过程\u003c/td>\u003ctd>用具体操作说出允许什么历史；CAP 讨论明确发生分区，区分复制与备份\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M09-3\u003c/td>\u003ctd>本地事务与消息双写、Outbox、至少一次投递、幂等消费\u003c/td>\u003ctd>M08-3/4、M05-4\u003c/td>\u003ctd>原子写业务与 outbox，投递后再记发送结果；逐点故障注入\u003c/td>\u003ctd>崩溃重启可继续投递，重复可消解，业务提交不会永久漏事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M09-4\u003c/td>\u003ctd>2PC、Saga、补偿、TCC 概览、状态机与对账\u003c/td>\u003ctd>M09-1/3\u003c/td>\u003ctd>画支付成功与取消竞争，设计补偿/对账状态\u003c/td>\u003ctd>补偿是新业务动作，有失败与重试；不声称分布式回滚必然恢复原状\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M09-5\u003c/td>\u003ctd>限流、熔断、降级、隔离、背压、负载均衡与服务发现\u003c/td>\u003ctd>M03-4、M09-1\u003c/td>\u003ctd>让一个下游变慢，限制在途数并测量其他接口\u003c/td>\u003ctd>保护关键业务，重试不放大故障；恢复有半开/探测策略\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M09-6\u003c/td>\u003ctd>分布式锁、租约、过期、时钟与 fencing token\u003c/td>\u003ctd>M03-2、M09-2\u003c/td>\u003ctd>暂停旧持有者直到租约失效，再让其恢复写入\u003c/td>\u003ctd>能证明目标资源拒绝陈旧写入，或说明为何改用数据库条件更新更可靠\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：可靠成交。\u003c/strong> 在订单支付确认事务内写入 OrderPaid outbox。分别在事务提交前、提交后发布前、broker 确认后标记前退出。重启投递器，观察事件最终到达，CRM 统计只产生一次业务效果。\u003c/p>\n\u003cp>\u003cstrong>实验 B：取消与支付。\u003c/strong> 用屏障控制取消请求与支付回调的先后，明确订单、库存预留和模拟支付记录的事实来源。晚到支付不能直接让已取消订单复活，应进入已定义的退款/对账流程。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>单次支付事件最终更新 CRM 统计\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>重复请求、乱序回调、旧版本事件、已取消订单的晚到成功\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>网络超时但提交成功、投递器重启、补偿失败、租约过期后的旧写入\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>能否仅靠重试保证业务最终成功？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 举出永久错误和重复副作用，并说明退出与人工处理条件。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>“最终一致”需要哪些机制才能成立？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说明重试、补偿、对账及终止条件，不只描述结果。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么 Outbox 仍可能重复投递？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 指出确认与标记之间的故障窗口，说明消费者如何处理。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>Raft 多数派解决了什么，没解决什么？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 区分复制状态一致、业务跨系统事务和可用性限制。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>提交一张故障时序图、一套失败矩阵和一份 Outbox/Saga 取舍记录。实验应包含从失败到收敛的全过程。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=distributed\">Raft 作者资料与分布式机制\u003c/a>，先理解网络/进程故障模型，再读日志复制与安全性；Outbox 阅读 Debezium 官方资料，消息确认回到 RabbitMQ 文档。学习 Outbox 不要求先部署 CDC。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>完整 Raft 实现、跨地域多活、CRDT、分布式数据库内核、Service Mesh 为选修。先完成单数据库事务与故障恢复，再决定是否引入跨服务事务。\u003c/p>", "toc": [{"id": "heading-0", "title": "M09 分布式系统", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M09-1", "topic": "部分失败、超时、重试、幂等、指数退避与抖动、重试预算", "prereq": "M02-5、M06-4", "method": "注入“下游提交成功但响应丢失”，画时序", "criteria": "不把超时等同失败；重试有次数/总时限/可重试条件"}, {"id": "M09-2", "topic": "线性一致性、顺序/因果/最终一致性、复制/分区、CAP 边界、共识与多数派", "prereq": "M05-4/6、M09-1", "method": "比较库存与客户统计要求；阅读 Raft 日志复制过程", "criteria": "用具体操作说出允许什么历史；CAP 讨论明确发生分区，区分复制与备份"}, {"id": "M09-3", "topic": "本地事务与消息双写、Outbox、至少一次投递、幂等消费", "prereq": "M08-3/4、M05-4", "method": "原子写业务与 outbox，投递后再记发送结果；逐点故障注入", "criteria": "崩溃重启可继续投递，重复可消解，业务提交不会永久漏事件"}, {"id": "M09-4", "topic": "2PC、Saga、补偿、TCC 概览、状态机与对账", "prereq": "M09-1/3", "method": "画支付成功与取消竞争，设计补偿/对账状态", "criteria": "补偿是新业务动作，有失败与重试；不声称分布式回滚必然恢复原状"}, {"id": "M09-5", "topic": "限流、熔断、降级、隔离、背压、负载均衡与服务发现", "prereq": "M03-4、M09-1", "method": "让一个下游变慢，限制在途数并测量其他接口", "criteria": "保护关键业务，重试不放大故障；恢复有半开/探测策略"}, {"id": "M09-6", "topic": "分布式锁、租约、过期、时钟与 fencing token", "prereq": "M03-2、M09-2", "method": "暂停旧持有者直到租约失效，再让其恢复写入", "criteria": "能证明目标资源拒绝陈旧写入，或说明为何改用数据库条件更新更可靠"}], "checks": []}, {"path": "modules/m10-reliability.md", "title": "M10 部署、可观测性与可靠性", "text": "M10 部署、可观测性与可靠性 总纲 · 阶段 3 学习问题与前置 如何知道用户正在受影响，如何恢复，怎样判断“足够可靠”？前置：M02 Linux/网络、M06 应用，M07 构建。阶段 1 先建立部署与日志基线，阶段 3 深入；目标 L3/L4。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M10-1 Linux 运行环境、Docker 镜像/容器、配置/密钥、依赖启动、资源限制 M02-6、M07-4 从空环境构建和部署，限制 CPU/内存，检查健康状态 应用/数据库可重建；密钥不入库，启动顺序与失败可解释 M10-2 CI/CD、制品不可变、schema 兼容、灰度、回滚、优雅停机 M10-1、M05-6 同一制品跨环境发布，注入启动失败，回退旧版本 回滚检查数据兼容；终止时在途请求与消息处理有定义 M10-3 结构化日志、指标、分布式追踪、上下文传播、采样与标签基数 M06-4、M03-5 串起下单→outbox→CRM 更新；测量错误、延迟与积压 能从症状找到相关请求；不把客户 ID 当无界指标标签 M10-4 SLI/SLO、错误预算、用户症状告警、故障分级与复盘 M10-3 定义成功率和延迟口径，注入慢服务并触发告警 说明分母、窗口和排除项；告警附带可执行处置说明 M10-5 容量评估、负载模型、饱和点、RTO/RPO、备份恢复、容灾 M04、M05-6 从业务量估算 QPS/存储；压测与恢复验证 区分平均与峰值；目标与测量分开；恢复时间和丢失窗口有证据 M10-6 Kubernetes Pod/Deployment/Service、探针、资源请求/限制、配置、扩缩容 M10-1/2 阅读并解释最小部署清单，做本地滚动更新实验 区分 readiness/liveness；副本数变化不破坏会话和幂等规则 最小实验与项目映射 实验 A：面向用户的监控。 为“报价转订单”定义请求成功率、P95/P99 和吞吐，再为事件链定义最老未投递事件年龄、消费失败与积压。用固定请求集制造异常，核对业务错误与系统错误统计是否混淆。 实验 B：发布与恢复。 先记录旧版本健康基线，发布一个错误配置版本，验证探针、告警和回滚。再在独立实例从备份恢复数据库，用订单数、金额合计和抽样行核对，记录实际 RTO/RPO。 场景 验证 正常 新实例就绪后接流量，追踪关联 API 与异步处理 边界 资源达到限制、低流量窗口、队列增长、部分实例尚未就绪 失败 配置错误、下游断连、容器重启、磁盘不足、恢复文件不可用 自测与模块验收 CPU 告警和用户成功率告警分别回答什么问题？ 判断依据 区分资源原因与用户影响。 99.9% SLO 如果没有时间窗口有什么问题？ 判断依据 补上分母、窗口、测量点和错误预算口径。 加副本为什么可能把数据库压垮？ 判断依据 估算连接与在途量的总和。 回滚代码为什么不能保证数据回滚？ 判断依据 说明兼容迁移和不可逆写入处理。 交付观测面板或等价查询、告警说明、发布/恢复记录和一次复盘。小样本演练只验证机制，不据此宣称达成长期可用性。 一手资料与阅读顺序 主入口： Google SRE ，读 SLO、监控、告警、排障、过载与复盘；工具查 Docker、Kubernetes、OpenTelemetry 。先定义问题和口径，再选工具。 选修与边界 多集群、云平台认证、Service Mesh、全自动容量管理为选修；Kubernetes 的机制理解与最小演练必修，不要求一开始管理生产集群。云账号与付费资源不作为课程前置。", "html": "\u003ch1 id=\"heading-0\">M10 部署、可观测性与可靠性\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-03-resilience.md\">阶段 3\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>如何知道用户正在受影响，如何恢复，怎样判断“足够可靠”？前置：M02 Linux/网络、M06 应用，M07 构建。阶段 1 先建立部署与日志基线，阶段 3 深入；目标 L3/L4。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M10-1\u003c/td>\u003ctd>Linux 运行环境、Docker 镜像/容器、配置/密钥、依赖启动、资源限制\u003c/td>\u003ctd>M02-6、M07-4\u003c/td>\u003ctd>从空环境构建和部署，限制 CPU/内存，检查健康状态\u003c/td>\u003ctd>应用/数据库可重建；密钥不入库，启动顺序与失败可解释\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10-2\u003c/td>\u003ctd>CI/CD、制品不可变、schema 兼容、灰度、回滚、优雅停机\u003c/td>\u003ctd>M10-1、M05-6\u003c/td>\u003ctd>同一制品跨环境发布，注入启动失败，回退旧版本\u003c/td>\u003ctd>回滚检查数据兼容；终止时在途请求与消息处理有定义\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10-3\u003c/td>\u003ctd>结构化日志、指标、分布式追踪、上下文传播、采样与标签基数\u003c/td>\u003ctd>M06-4、M03-5\u003c/td>\u003ctd>串起下单→outbox→CRM 更新；测量错误、延迟与积压\u003c/td>\u003ctd>能从症状找到相关请求；不把客户 ID 当无界指标标签\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10-4\u003c/td>\u003ctd>SLI/SLO、错误预算、用户症状告警、故障分级与复盘\u003c/td>\u003ctd>M10-3\u003c/td>\u003ctd>定义成功率和延迟口径，注入慢服务并触发告警\u003c/td>\u003ctd>说明分母、窗口和排除项；告警附带可执行处置说明\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10-5\u003c/td>\u003ctd>容量评估、负载模型、饱和点、RTO/RPO、备份恢复、容灾\u003c/td>\u003ctd>M04、M05-6\u003c/td>\u003ctd>从业务量估算 QPS/存储；压测与恢复验证\u003c/td>\u003ctd>区分平均与峰值；目标与测量分开；恢复时间和丢失窗口有证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10-6\u003c/td>\u003ctd>Kubernetes Pod/Deployment/Service、探针、资源请求/限制、配置、扩缩容\u003c/td>\u003ctd>M10-1/2\u003c/td>\u003ctd>阅读并解释最小部署清单，做本地滚动更新实验\u003c/td>\u003ctd>区分 readiness/liveness；副本数变化不破坏会话和幂等规则\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：面向用户的监控。\u003c/strong> 为“报价转订单”定义请求成功率、P95/P99 和吞吐，再为事件链定义最老未投递事件年龄、消费失败与积压。用固定请求集制造异常，核对业务错误与系统错误统计是否混淆。\u003c/p>\n\u003cp>\u003cstrong>实验 B：发布与恢复。\u003c/strong> 先记录旧版本健康基线，发布一个错误配置版本，验证探针、告警和回滚。再在独立实例从备份恢复数据库，用订单数、金额合计和抽样行核对，记录实际 RTO/RPO。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>新实例就绪后接流量，追踪关联 API 与异步处理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>资源达到限制、低流量窗口、队列增长、部分实例尚未就绪\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>配置错误、下游断连、容器重启、磁盘不足、恢复文件不可用\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>CPU 告警和用户成功率告警分别回答什么问题？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 区分资源原因与用户影响。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>99.9% SLO 如果没有时间窗口有什么问题？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 补上分母、窗口、测量点和错误预算口径。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>加副本为什么可能把数据库压垮？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 估算连接与在途量的总和。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>回滚代码为什么不能保证数据回滚？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说明兼容迁移和不可逆写入处理。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>交付观测面板或等价查询、告警说明、发布/恢复记录和一次复盘。小样本演练只验证机制，不据此宣称达成长期可用性。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=reliability\">Google SRE\u003c/a>，读 SLO、监控、告警、排障、过载与复盘；工具查 \u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=operations\">Docker、Kubernetes、OpenTelemetry\u003c/a>。先定义问题和口径，再选工具。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>多集群、云平台认证、Service Mesh、全自动容量管理为选修；Kubernetes 的机制理解与最小演练必修，不要求一开始管理生产集群。云账号与付费资源不作为课程前置。\u003c/p>", "toc": [{"id": "heading-0", "title": "M10 部署、可观测性与可靠性", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M10-1", "topic": "Linux 运行环境、Docker 镜像/容器、配置/密钥、依赖启动、资源限制", "prereq": "M02-6、M07-4", "method": "从空环境构建和部署，限制 CPU/内存，检查健康状态", "criteria": "应用/数据库可重建；密钥不入库，启动顺序与失败可解释"}, {"id": "M10-2", "topic": "CI/CD、制品不可变、schema 兼容、灰度、回滚、优雅停机", "prereq": "M10-1、M05-6", "method": "同一制品跨环境发布，注入启动失败，回退旧版本", "criteria": "回滚检查数据兼容；终止时在途请求与消息处理有定义"}, {"id": "M10-3", "topic": "结构化日志、指标、分布式追踪、上下文传播、采样与标签基数", "prereq": "M06-4、M03-5", "method": "串起下单→outbox→CRM 更新；测量错误、延迟与积压", "criteria": "能从症状找到相关请求；不把客户 ID 当无界指标标签"}, {"id": "M10-4", "topic": "SLI/SLO、错误预算、用户症状告警、故障分级与复盘", "prereq": "M10-3", "method": "定义成功率和延迟口径，注入慢服务并触发告警", "criteria": "说明分母、窗口和排除项；告警附带可执行处置说明"}, {"id": "M10-5", "topic": "容量评估、负载模型、饱和点、RTO/RPO、备份恢复、容灾", "prereq": "M04、M05-6", "method": "从业务量估算 QPS/存储；压测与恢复验证", "criteria": "区分平均与峰值；目标与测量分开；恢复时间和丢失窗口有证据"}, {"id": "M10-6", "topic": "Kubernetes Pod/Deployment/Service、探针、资源请求/限制、配置、扩缩容", "prereq": "M10-1/2", "method": "阅读并解释最小部署清单，做本地滚动更新实验", "criteria": "区分 readiness/liveness；副本数变化不破坏会话和幂等规则"}], "checks": []}, {"path": "modules/m11-architecture.md", "title": "M11 业务建模与架构设计", "text": "M11 业务建模与架构设计 总纲 · 阶段 4 学习问题与前置 业务说“客户成交了”具体指什么？系统边界如何服务业务，又如何随团队和规模变化？阶段 1 就学习 M11-1/2 的基础，完整设计在阶段 2–3 后开展。目标 L4，以方案比较和实测支持判断。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M11-1 需求澄清、领域语言、流程、业务不变量、状态与非功能需求 能读业务需求 为客户/商机/报价/订单/支付建词汇表，列正常与反常流程 同一词有明确口径；把含糊需求变成例子和验收条件 M11-2 实体/值对象、聚合、领域服务、上下文边界、事务与数据归属 M11-1、M05 基础 比较 CRM 与交易对“客户”的关注，标注数据拥有者 不因表关联直接合并领域；聚合边界能解释不变量和事务范围 M11-3 分层、六边形、模块化单体、微服务、事件驱动、CQRS 适用条件 M07-1/2、M11-2 同一需求画两种结构，比较调用与部署成本 说明何时简单方案更适合；读写模型分离不自动要求服务拆分 M11-4 API/事件契约、兼容、数据演进、模块与团队依赖 M06、M09-3 为 CRM 订阅成交事实定义契约，测试旧消费者 不共享可变数据库模型；新增字段、版本、重放和删除语义清晰 M11-5 容量、可用性、安全、成本、复杂度与组织约束的取舍 M04、M09、M10 设定流量/数据量/团队条件，估算瓶颈与运维成本 数字注明假设；对最敏感参数做变化分析，避免虚构生产规模 M11-6 ADR、渐进迁移、绞杀式演进、影子读/对账、回滚和验证 M11-3/4/5 迁移 CRM 成交读模型或一个模块，演练失败返回 步骤有检查点和退出条件；数据源切换可验证，残余风险有人负责 最小实验与项目映射 实验 A：成交的语言。 区分报价接受、订单创建、支付确认、履约完成、退款。CRM 统计选用订单正常支付确认作为成交口径，同时明确退款如何修正净成交额，以及取消后异常收款为何单独对账；不将它表述成通用财务会计口径。 实验 B：拆还是不拆。 在“CRM 报表影响下单延迟”的约束下比较：优化 SQL/索引、异步读模型、独立报表服务。先测基线，再确定最小有效方案。使用 ADR 记录为何不采用其他选项。 实验 C：边界验证。 用模块依赖测试或 Spring Modulith 验证模块间无循环与内部类型泄漏；选择一处有意的违规访问，确认检查能阻止它。 场景 验证 正常 合同/报价变更不改变历史订单；CRM 消费交易事实更新读模型 边界 新旧事件消费者并存、团队并行改动、客户停用但历史订单保留 失败 迁移回填中断、双写不一致、独立服务不可用、回滚后新增数据归属 自测与模块验收 一张数据库表是否就是一个聚合或服务？ 判断依据 用事务规则、生命周期和协作关系判断。 客户名称修改后历史订单显示什么？ 判断依据 区分快照与引用，并明确业务选择。 为什么“将来流量会大”不足以支持拆服务？ 判断依据 提出可测量触发条件及迁移代价。 团队规模从 2 人变成 20 人，哪些架构判断可能改变？ 判断依据 说明协调、发布、职责与运维能力约束。 至少提交领域模型、两种以上方案、容量/成本假设、ADR、兼容与迁移验证；面对一个改变后的约束重新决策。 一手资料与阅读顺序 主入口： Spring Modulith 与架构表达 ，先看模块概念、验证与测试，再使用 C4 表达系统/容器/组件视图，ADR 表达决策。DDD 阅读作者的参考资料，工具不替代业务访谈和不变量分析。 选修与边界 Event Sourcing、多地域架构、企业级架构框架、平台工程为选修。CRM 的多租户隔离在 M12 学习并于阶段 4 演练；不要求阶段 1 同时建设完整 SaaS 平台。", "html": "\u003ch1 id=\"heading-0\">M11 业务建模与架构设计\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-04-architecture.md\">阶段 4\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>业务说“客户成交了”具体指什么？系统边界如何服务业务，又如何随团队和规模变化？阶段 1 就学习 M11-1/2 的基础，完整设计在阶段 2–3 后开展。目标 L4，以方案比较和实测支持判断。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M11-1\u003c/td>\u003ctd>需求澄清、领域语言、流程、业务不变量、状态与非功能需求\u003c/td>\u003ctd>能读业务需求\u003c/td>\u003ctd>为客户/商机/报价/订单/支付建词汇表，列正常与反常流程\u003c/td>\u003ctd>同一词有明确口径；把含糊需求变成例子和验收条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M11-2\u003c/td>\u003ctd>实体/值对象、聚合、领域服务、上下文边界、事务与数据归属\u003c/td>\u003ctd>M11-1、M05 基础\u003c/td>\u003ctd>比较 CRM 与交易对“客户”的关注，标注数据拥有者\u003c/td>\u003ctd>不因表关联直接合并领域；聚合边界能解释不变量和事务范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M11-3\u003c/td>\u003ctd>分层、六边形、模块化单体、微服务、事件驱动、CQRS 适用条件\u003c/td>\u003ctd>M07-1/2、M11-2\u003c/td>\u003ctd>同一需求画两种结构，比较调用与部署成本\u003c/td>\u003ctd>说明何时简单方案更适合；读写模型分离不自动要求服务拆分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M11-4\u003c/td>\u003ctd>API/事件契约、兼容、数据演进、模块与团队依赖\u003c/td>\u003ctd>M06、M09-3\u003c/td>\u003ctd>为 CRM 订阅成交事实定义契约，测试旧消费者\u003c/td>\u003ctd>不共享可变数据库模型；新增字段、版本、重放和删除语义清晰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M11-5\u003c/td>\u003ctd>容量、可用性、安全、成本、复杂度与组织约束的取舍\u003c/td>\u003ctd>M04、M09、M10\u003c/td>\u003ctd>设定流量/数据量/团队条件，估算瓶颈与运维成本\u003c/td>\u003ctd>数字注明假设；对最敏感参数做变化分析，避免虚构生产规模\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M11-6\u003c/td>\u003ctd>ADR、渐进迁移、绞杀式演进、影子读/对账、回滚和验证\u003c/td>\u003ctd>M11-3/4/5\u003c/td>\u003ctd>迁移 CRM 成交读模型或一个模块，演练失败返回\u003c/td>\u003ctd>步骤有检查点和退出条件；数据源切换可验证，残余风险有人负责\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：成交的语言。\u003c/strong> 区分报价接受、订单创建、支付确认、履约完成、退款。CRM 统计选用订单正常支付确认作为成交口径，同时明确退款如何修正净成交额，以及取消后异常收款为何单独对账；不将它表述成通用财务会计口径。\u003c/p>\n\u003cp>\u003cstrong>实验 B：拆还是不拆。\u003c/strong> 在“CRM 报表影响下单延迟”的约束下比较：优化 SQL/索引、异步读模型、独立报表服务。先测基线，再确定最小有效方案。使用 \u003ca href=\"#doc=templates%2Farchitecture-decision.md\">ADR\u003c/a> 记录为何不采用其他选项。\u003c/p>\n\u003cp>\u003cstrong>实验 C：边界验证。\u003c/strong> 用模块依赖测试或 Spring Modulith 验证模块间无循环与内部类型泄漏；选择一处有意的违规访问，确认检查能阻止它。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>合同/报价变更不改变历史订单；CRM 消费交易事实更新读模型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>新旧事件消费者并存、团队并行改动、客户停用但历史订单保留\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>迁移回填中断、双写不一致、独立服务不可用、回滚后新增数据归属\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>一张数据库表是否就是一个聚合或服务？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 用事务规则、生命周期和协作关系判断。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>客户名称修改后历史订单显示什么？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 区分快照与引用，并明确业务选择。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么“将来流量会大”不足以支持拆服务？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 提出可测量触发条件及迁移代价。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>团队规模从 2 人变成 20 人，哪些架构判断可能改变？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说明协调、发布、职责与运维能力约束。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>至少提交领域模型、两种以上方案、容量/成本假设、ADR、兼容与迁移验证；面对一个改变后的约束重新决策。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=architecture\">Spring Modulith 与架构表达\u003c/a>，先看模块概念、验证与测试，再使用 C4 表达系统/容器/组件视图，ADR 表达决策。DDD 阅读作者的参考资料，工具不替代业务访谈和不变量分析。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>Event Sourcing、多地域架构、企业级架构框架、平台工程为选修。CRM 的多租户隔离在 M12 学习并于阶段 4 演练；不要求阶段 1 同时建设完整 SaaS 平台。\u003c/p>", "toc": [{"id": "heading-0", "title": "M11 业务建模与架构设计", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M11-1", "topic": "需求澄清、领域语言、流程、业务不变量、状态与非功能需求", "prereq": "能读业务需求", "method": "为客户/商机/报价/订单/支付建词汇表，列正常与反常流程", "criteria": "同一词有明确口径；把含糊需求变成例子和验收条件"}, {"id": "M11-2", "topic": "实体/值对象、聚合、领域服务、上下文边界、事务与数据归属", "prereq": "M11-1、M05 基础", "method": "比较 CRM 与交易对“客户”的关注，标注数据拥有者", "criteria": "不因表关联直接合并领域；聚合边界能解释不变量和事务范围"}, {"id": "M11-3", "topic": "分层、六边形、模块化单体、微服务、事件驱动、CQRS 适用条件", "prereq": "M07-1/2、M11-2", "method": "同一需求画两种结构，比较调用与部署成本", "criteria": "说明何时简单方案更适合；读写模型分离不自动要求服务拆分"}, {"id": "M11-4", "topic": "API/事件契约、兼容、数据演进、模块与团队依赖", "prereq": "M06、M09-3", "method": "为 CRM 订阅成交事实定义契约，测试旧消费者", "criteria": "不共享可变数据库模型；新增字段、版本、重放和删除语义清晰"}, {"id": "M11-5", "topic": "容量、可用性、安全、成本、复杂度与组织约束的取舍", "prereq": "M04、M09、M10", "method": "设定流量/数据量/团队条件，估算瓶颈与运维成本", "criteria": "数字注明假设；对最敏感参数做变化分析，避免虚构生产规模"}, {"id": "M11-6", "topic": "ADR、渐进迁移、绞杀式演进、影子读/对账、回滚和验证", "prereq": "M11-3/4/5", "method": "迁移 CRM 成交读模型或一个模块，演练失败返回", "criteria": "步骤有检查点和退出条件；数据源切换可验证，残余风险有人负责"}], "checks": []}, {"path": "modules/m12-security.md", "title": "M12 安全与技术协作", "text": "M12 安全与技术协作 总纲 · 阶段 1 · 阶段 5 学习问题与前置 用户“能调用接口”是否意味着“能查看这位客户”？设计怎样被团队理解、质疑和可靠执行？前置：M01 基础、M02 HTTP；与 M06/M07/M11 同步。安全实现与诊断 L2/L3，协作和方案取舍 L4。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M12-1 认证/授权、RBAC、客户归属、部门数据范围、最小权限 M06-4 基础 列角色×动作×对象矩阵，用不同账号读取/修改同一客户 身份来自可信上下文；列表、详情、导出与写操作一致执行数据范围 M12-2 租户隔离、缓存/队列/搜索的数据边界、审计与个人信息保护 M12-1、M08 基础 两租户创建相同业务编号，从各入口交叉访问 所有数据通道隔离；日志/导出无不必要个人信息，敏感操作可追溯 M12-3 SQL 注入、XSS、CSRF、SSRF、文件处理、输入与输出边界 M02-5、M05-5、M06-5 本地构造恶意排序字段、越权 ID、回调地址和输出内容 区分参数绑定/白名单/编码/来源与目标限制；每项有负例验证 M12-4 密码/密钥管理、TLS、依赖与供应链、权限配置 M02-5、M07-4 使用框架密码哈希；检视依赖和容器来源；演练密钥更换 不自造密码学；秘密不进入仓库和日志；问题有影响范围与升级验证 M12-5 威胁建模、安全评审、审计事件与事故处理 M11-1、M12-1–4 画客户导出数据流，标出信任边界和滥用路径 风险对应控制与验证；审计覆盖谁/何时/何对象/何动作/结果 M12-6 技术写作、评审、任务拆分、跨团队契约、指导与反馈 M07-6、M11 基础 准备一页方案说明，邀请评审或做明确标注的模拟评审 能处理反对意见、分配交付责任，保留决策变化与验收证据 最小实验与项目映射 实验 A：对象级越权。 账号 A 与 B 各有客户；A 获得 B 的客户 ID 后尝试详情、修改、列表条件、报价转订单和导出。阶段 1 规则默认返回 403；接口不得泄漏对象内容。客户不存在返回 404，此存在性策略只用于练习，后续安全评审可重新决定。 实验 B：隔离贯穿。 阶段 4 加租户后，分别尝试伪造 tenantId、缓存命中另一租户、搜索跨租户、重放错误租户事件。测试必须走真实授权边界，不能只检查前端按钮隐藏。 实验 C：评审表达。 为“主管能否跨部门导出客户”列出业务价值、权限风险、数据最小化和审计方案。记录评审问题、修改以及仍未解决的事项。 场景 验证 正常 负责人访问自己的客户，管理员操作留下审计 边界 客户转移、角色撤销、令牌过期、缓存尚未失效 失败 跨客户/跨租户访问、恶意参数、失效密钥、带敏感数据的错误日志 自测与模块验收 在请求里加 tenantId 为什么不等于隔离？ 判断依据 解释可信身份与服务端绑定，并检查所有数据路径。 防 SQL 注入为何不能保护任意 URL 回调？ 判断依据 区分数据库输入与网络出站信任边界。 审计与普通调试日志有什么区别？ 判断依据 说明用途、字段、保留与访问约束。 如何让同事评审你的方案，而不只是听结论？ 判断依据 给出约束、候选方案、证据与待决问题。 至少提交权限矩阵与负例结果、客户数据流威胁模型、一次方案评审记录。练习不用真实客户资料或真实支付凭据；模拟评审如实标记。 一手资料与阅读顺序 主入口： OWASP 与 Spring Security ，先读授权/输入处理/日志，再读对应框架的防护机制；TLS 和 HTTP 回查 M02 资料。根据项目入口选择安全控制，避免无依据地堆清单。 选修与边界 OAuth2/OIDC 协议深入、策略引擎、复杂组织权限、专业渗透测试为选修。阶段 1 用最小认证方案完成边界验证，之后再演进身份体系。", "html": "\u003ch1 id=\"heading-0\">M12 安全与技术协作\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-01-business.md\">阶段 1\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-05-transfer.md\">阶段 5\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>用户“能调用接口”是否意味着“能查看这位客户”？设计怎样被团队理解、质疑和可靠执行？前置：M01 基础、M02 HTTP；与 M06/M07/M11 同步。安全实现与诊断 L2/L3，协作和方案取舍 L4。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M12-1\u003c/td>\u003ctd>认证/授权、RBAC、客户归属、部门数据范围、最小权限\u003c/td>\u003ctd>M06-4 基础\u003c/td>\u003ctd>列角色×动作×对象矩阵，用不同账号读取/修改同一客户\u003c/td>\u003ctd>身份来自可信上下文；列表、详情、导出与写操作一致执行数据范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12-2\u003c/td>\u003ctd>租户隔离、缓存/队列/搜索的数据边界、审计与个人信息保护\u003c/td>\u003ctd>M12-1、M08 基础\u003c/td>\u003ctd>两租户创建相同业务编号，从各入口交叉访问\u003c/td>\u003ctd>所有数据通道隔离；日志/导出无不必要个人信息，敏感操作可追溯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12-3\u003c/td>\u003ctd>SQL 注入、XSS、CSRF、SSRF、文件处理、输入与输出边界\u003c/td>\u003ctd>M02-5、M05-5、M06-5\u003c/td>\u003ctd>本地构造恶意排序字段、越权 ID、回调地址和输出内容\u003c/td>\u003ctd>区分参数绑定/白名单/编码/来源与目标限制；每项有负例验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12-4\u003c/td>\u003ctd>密码/密钥管理、TLS、依赖与供应链、权限配置\u003c/td>\u003ctd>M02-5、M07-4\u003c/td>\u003ctd>使用框架密码哈希；检视依赖和容器来源；演练密钥更换\u003c/td>\u003ctd>不自造密码学；秘密不进入仓库和日志；问题有影响范围与升级验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12-5\u003c/td>\u003ctd>威胁建模、安全评审、审计事件与事故处理\u003c/td>\u003ctd>M11-1、M12-1–4\u003c/td>\u003ctd>画客户导出数据流，标出信任边界和滥用路径\u003c/td>\u003ctd>风险对应控制与验证；审计覆盖谁/何时/何对象/何动作/结果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12-6\u003c/td>\u003ctd>技术写作、评审、任务拆分、跨团队契约、指导与反馈\u003c/td>\u003ctd>M07-6、M11 基础\u003c/td>\u003ctd>准备一页方案说明，邀请评审或做明确标注的模拟评审\u003c/td>\u003ctd>能处理反对意见、分配交付责任，保留决策变化与验收证据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：对象级越权。\u003c/strong> 账号 A 与 B 各有客户；A 获得 B 的客户 ID 后尝试详情、修改、列表条件、报价转订单和导出。阶段 1 规则默认返回 403；接口不得泄漏对象内容。客户不存在返回 404，此存在性策略只用于练习，后续安全评审可重新决定。\u003c/p>\n\u003cp>\u003cstrong>实验 B：隔离贯穿。\u003c/strong> 阶段 4 加租户后，分别尝试伪造 tenantId、缓存命中另一租户、搜索跨租户、重放错误租户事件。测试必须走真实授权边界，不能只检查前端按钮隐藏。\u003c/p>\n\u003cp>\u003cstrong>实验 C：评审表达。\u003c/strong> 为“主管能否跨部门导出客户”列出业务价值、权限风险、数据最小化和审计方案。记录评审问题、修改以及仍未解决的事项。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>负责人访问自己的客户，管理员操作留下审计\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>客户转移、角色撤销、令牌过期、缓存尚未失效\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>跨客户/跨租户访问、恶意参数、失效密钥、带敏感数据的错误日志\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>在请求里加 tenantId 为什么不等于隔离？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 解释可信身份与服务端绑定，并检查所有数据路径。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>防 SQL 注入为何不能保护任意 URL 回调？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 区分数据库输入与网络出站信任边界。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>审计与普通调试日志有什么区别？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说明用途、字段、保留与访问约束。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>如何让同事评审你的方案，而不只是听结论？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 给出约束、候选方案、证据与待决问题。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>至少提交权限矩阵与负例结果、客户数据流威胁模型、一次方案评审记录。练习不用真实客户资料或真实支付凭据；模拟评审如实标记。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=security\">OWASP 与 Spring Security\u003c/a>，先读授权/输入处理/日志，再读对应框架的防护机制；TLS 和 HTTP 回查 M02 资料。根据项目入口选择安全控制，避免无依据地堆清单。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>OAuth2/OIDC 协议深入、策略引擎、复杂组织权限、专业渗透测试为选修。阶段 1 用最小认证方案完成边界验证，之后再演进身份体系。\u003c/p>", "toc": [{"id": "heading-0", "title": "M12 安全与技术协作", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M12-1", "topic": "认证/授权、RBAC、客户归属、部门数据范围、最小权限", "prereq": "M06-4 基础", "method": "列角色×动作×对象矩阵，用不同账号读取/修改同一客户", "criteria": "身份来自可信上下文；列表、详情、导出与写操作一致执行数据范围"}, {"id": "M12-2", "topic": "租户隔离、缓存/队列/搜索的数据边界、审计与个人信息保护", "prereq": "M12-1、M08 基础", "method": "两租户创建相同业务编号，从各入口交叉访问", "criteria": "所有数据通道隔离；日志/导出无不必要个人信息，敏感操作可追溯"}, {"id": "M12-3", "topic": "SQL 注入、XSS、CSRF、SSRF、文件处理、输入与输出边界", "prereq": "M02-5、M05-5、M06-5", "method": "本地构造恶意排序字段、越权 ID、回调地址和输出内容", "criteria": "区分参数绑定/白名单/编码/来源与目标限制；每项有负例验证"}, {"id": "M12-4", "topic": "密码/密钥管理、TLS、依赖与供应链、权限配置", "prereq": "M02-5、M07-4", "method": "使用框架密码哈希；检视依赖和容器来源；演练密钥更换", "criteria": "不自造密码学；秘密不进入仓库和日志；问题有影响范围与升级验证"}, {"id": "M12-5", "topic": "威胁建模、安全评审、审计事件与事故处理", "prereq": "M11-1、M12-1–4", "method": "画客户导出数据流，标出信任边界和滥用路径", "criteria": "风险对应控制与验证；审计覆盖谁/何时/何对象/何动作/结果"}, {"id": "M12-6", "topic": "技术写作、评审、任务拆分、跨团队契约、指导与反馈", "prereq": "M07-6、M11 基础", "method": "准备一页方案说明，邀请评审或做明确标注的模拟评审", "criteria": "能处理反对意见、分配交付责任，保留决策变化与验收证据"}], "checks": []}, {"path": "practice/README.md", "title": "实践手册：CRM + 交易系统", "text": "实践手册：CRM + 交易系统 总纲 · 进度 项目定位与边界 练习场景是一家面向企业客户的商品销售公司：销售负责客户、商机和报价；交易模块负责订单、库存预留、模拟支付与退款；CRM 订阅成交事实更新客户统计和跟进任务。 先构建模块化单体，再由业务和测量结果决定演进。后续实践工程放在独立练习仓库，本仓库维护学习文档与脱敏证据；此版本没有创建业务代码。无需前端，使用 HTTP 请求、测试和数据库观测完成验收。 统一领域词汇 概念 本练习定义 数据归属 客户 Customer 企业客户，有名称、唯一客户编码、负责人和启用状态 CRM 商机 Opportunity 针对一个客户的一次销售机会，阶段 1 限定最多形成一个订单 CRM 报价 Quote 商机下的版本化商品及价格方案；发布后明细不可变 Sales 订单 Order 根据有效报价生成的商业快照，不随报价或客户名称变更重算 Trading 库存预留 Reservation 为待支付订单占用商品可售数量，取消/过期释放 Inventory，阶段 2 加入 支付 Payment 模拟渠道产生的付款事实，有唯一渠道流水 Payment，阶段 2 加入 退款 Refund 对已确认支付的独立反向业务动作，不删除支付事实 Payment 成交统计 按订单正常确认支付累计毛成交额，按对应退款计算净成交额；异常收款单独对账 CRM 可重建读模型 成交口径是练习约定，不等同于财务收入确认。每个新需求先说明涉及哪个事实、哪个模型和哪个不变量。 全阶段不变量 编号 必须保护的规则 首次验收阶段 INV-01 金额用十进制精确表示，单币种 CNY；数量为正整数；订单明细及总额有快照 1 INV-02 客户→商机→报价→订单的归属一致；订单不得引用其他客户的报价 1 INV-03 已发布报价明细不可变；每个商机最多一个订单；重复转换不重复创建 1 INV-04 未授权账号不能通过列表、详情、修改或导出取得他人客户数据 1；租户边界在 4 扩展 INV-05 多表业务写入整体成功或整体失败；错误可定位但不暴露敏感详情 1 INV-06 库存不为负；预留只确认或释放一次，数量守恒 2 INV-07 同一支付/退款事实最多记账一次；取消与晚到支付按规则收敛 2 INV-08 已提交的成交/退款事实最终可传递；重复/乱序/重放不重复改变统计 3 INV-09 缓存和搜索不成为订单、支付的事实来源；可从权威数据重建 3 INV-10 发布、迁移、恢复过程有检查点，未验证结果不得标为已完成 1 起，3–5 深化 分阶段入口 阶段 阅读与任务 新增能力 0 能力诊断 明确薄弱点与证据 1 客户到订单 正确业务、权限、测试、可复现环境 2 并发正确性与排障 库存/支付/退款、性能与故障定位 3 故障下运行 缓存、可靠事件、观测、恢复 4 架构决策与迁移 方案比较、隔离、服务边界与兼容 5 迁移到真实工作 团队反馈与实际收益 技术与实验约定 Java 21、MySQL 8.4/InnoDB、Spring Boot 稳定版、Maven；依赖版本按 基线规则 锁定。数据访问先做最小 JDBC 对照，再用 MyBatis；数据库迁移默认 Flyway。 模块化单体从按业务分包开始，不要求每个包都拆成独立 Maven 模块。模块依赖通过测试验证；Spring Modulith 是可用辅助工具。 缓存用 Redis，MQ 用 RabbitMQ；Outbox 首先用轮询投递理解机制，不要求 Kafka/CDC。搜索先做一个最小模型，真实 Elasticsearch 作为加深练习。 日志和请求标识从阶段 1 建立；阶段 3 加入指标、追踪和告警。付费云服务不是前置。 使用虚构客户及商品。阶段 1 固定练习账号，阶段 2 模拟支付；不得把练习接口直接对外暴露成支付服务。 正常、边界和失败场景都要保留结果；实验清理只影响练习环境，不在共享或生产环境注入故障。 证据与交付 每份证据标注任务 ID、相关不变量、代码版本、依赖版本、环境、步骤、预期/实际结果与未决事项。模板见 学习证据 、 架构决策 、 故障复盘 。不创建没有内容的正文或虚假的“已通过”报告。", "html": "\u003ch1 id=\"heading-0\">实践手册：CRM + 交易系统\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=PROGRESS.md\">进度\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">项目定位与边界\u003c/h2>\n\u003cp>练习场景是一家面向企业客户的商品销售公司：销售负责客户、商机和报价；交易模块负责订单、库存预留、模拟支付与退款；CRM 订阅成交事实更新客户统计和跟进任务。\u003c/p>\n\u003cp>先构建模块化单体，再由业务和测量结果决定演进。后续实践工程放在独立练习仓库，本仓库维护学习文档与脱敏证据；此版本没有创建业务代码。无需前端，使用 HTTP 请求、测试和数据库观测完成验收。\u003c/p>\n\u003ch2 id=\"heading-2\">统一领域词汇\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"概念表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">概念\u003c/th>\u003cth scope=\"col\">本练习定义\u003c/th>\u003cth scope=\"col\">数据归属\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>客户 Customer\u003c/td>\u003ctd>企业客户，有名称、唯一客户编码、负责人和启用状态\u003c/td>\u003ctd>CRM\u003c/td>\u003c/tr>\u003ctr>\u003ctd>商机 Opportunity\u003c/td>\u003ctd>针对一个客户的一次销售机会，阶段 1 限定最多形成一个订单\u003c/td>\u003ctd>CRM\u003c/td>\u003c/tr>\u003ctr>\u003ctd>报价 Quote\u003c/td>\u003ctd>商机下的版本化商品及价格方案；发布后明细不可变\u003c/td>\u003ctd>Sales\u003c/td>\u003c/tr>\u003ctr>\u003ctd>订单 Order\u003c/td>\u003ctd>根据有效报价生成的商业快照，不随报价或客户名称变更重算\u003c/td>\u003ctd>Trading\u003c/td>\u003c/tr>\u003ctr>\u003ctd>库存预留 Reservation\u003c/td>\u003ctd>为待支付订单占用商品可售数量，取消/过期释放\u003c/td>\u003ctd>Inventory，阶段 2 加入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>支付 Payment\u003c/td>\u003ctd>模拟渠道产生的付款事实，有唯一渠道流水\u003c/td>\u003ctd>Payment，阶段 2 加入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>退款 Refund\u003c/td>\u003ctd>对已确认支付的独立反向业务动作，不删除支付事实\u003c/td>\u003ctd>Payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成交统计\u003c/td>\u003ctd>按订单正常确认支付累计毛成交额，按对应退款计算净成交额；异常收款单独对账\u003c/td>\u003ctd>CRM 可重建读模型\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>成交口径是练习约定，不等同于财务收入确认。每个新需求先说明涉及哪个事实、哪个模型和哪个不变量。\u003c/p>\n\u003ch2 id=\"heading-3\">全阶段不变量\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"编号表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">编号\u003c/th>\u003cth scope=\"col\">必须保护的规则\u003c/th>\u003cth scope=\"col\">首次验收阶段\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>INV-01\u003c/td>\u003ctd>金额用十进制精确表示，单币种 CNY；数量为正整数；订单明细及总额有快照\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-02\u003c/td>\u003ctd>客户→商机→报价→订单的归属一致；订单不得引用其他客户的报价\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-03\u003c/td>\u003ctd>已发布报价明细不可变；每个商机最多一个订单；重复转换不重复创建\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-04\u003c/td>\u003ctd>未授权账号不能通过列表、详情、修改或导出取得他人客户数据\u003c/td>\u003ctd>1；租户边界在 4 扩展\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-05\u003c/td>\u003ctd>多表业务写入整体成功或整体失败；错误可定位但不暴露敏感详情\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-06\u003c/td>\u003ctd>库存不为负；预留只确认或释放一次，数量守恒\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-07\u003c/td>\u003ctd>同一支付/退款事实最多记账一次；取消与晚到支付按规则收敛\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-08\u003c/td>\u003ctd>已提交的成交/退款事实最终可传递；重复/乱序/重放不重复改变统计\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-09\u003c/td>\u003ctd>缓存和搜索不成为订单、支付的事实来源；可从权威数据重建\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>INV-10\u003c/td>\u003ctd>发布、迁移、恢复过程有检查点，未验证结果不得标为已完成\u003c/td>\u003ctd>1 起，3–5 深化\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">分阶段入口\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"阶段表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">阶段\u003c/th>\u003cth scope=\"col\">阅读与任务\u003c/th>\u003cth scope=\"col\">新增能力\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-00-diagnosis.md\">能力诊断\u003c/a>\u003c/td>\u003ctd>明确薄弱点与证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-01-business.md\">客户到订单\u003c/a>\u003c/td>\u003ctd>正确业务、权限、测试、可复现环境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-02-correctness.md\">并发正确性与排障\u003c/a>\u003c/td>\u003ctd>库存/支付/退款、性能与故障定位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-03-resilience.md\">故障下运行\u003c/a>\u003c/td>\u003ctd>缓存、可靠事件、观测、恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-04-architecture.md\">架构决策与迁移\u003c/a>\u003c/td>\u003ctd>方案比较、隔离、服务边界与兼容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-05-transfer.md\">迁移到真实工作\u003c/a>\u003c/td>\u003ctd>团队反馈与实际收益\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-5\">技术与实验约定\u003c/h2>\n\u003cul>\u003cli>Java 21、MySQL 8.4/InnoDB、Spring Boot 稳定版、Maven；依赖版本按 \u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=baseline\">基线规则\u003c/a> 锁定。数据访问先做最小 JDBC 对照，再用 MyBatis；数据库迁移默认 Flyway。\u003c/li>\u003cli>模块化单体从按业务分包开始，不要求每个包都拆成独立 Maven 模块。模块依赖通过测试验证；Spring Modulith 是可用辅助工具。\u003c/li>\u003cli>缓存用 Redis，MQ 用 RabbitMQ；Outbox 首先用轮询投递理解机制，不要求 Kafka/CDC。搜索先做一个最小模型，真实 Elasticsearch 作为加深练习。\u003c/li>\u003cli>日志和请求标识从阶段 1 建立；阶段 3 加入指标、追踪和告警。付费云服务不是前置。\u003c/li>\u003cli>使用虚构客户及商品。阶段 1 固定练习账号，阶段 2 模拟支付；不得把练习接口直接对外暴露成支付服务。\u003c/li>\u003cli>正常、边界和失败场景都要保留结果；实验清理只影响练习环境，不在共享或生产环境注入故障。\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-6\">证据与交付\u003c/h2>\n\u003cp>每份证据标注任务 ID、相关不变量、代码版本、依赖版本、环境、步骤、预期/实际结果与未决事项。模板见 \u003ca href=\"#doc=templates%2Fevidence.md\">学习证据\u003c/a>、\u003ca href=\"#doc=templates%2Farchitecture-decision.md\">架构决策\u003c/a>、\u003ca href=\"#doc=templates%2Fincident-review.md\">故障复盘\u003c/a>。不创建没有内容的正文或虚假的“已通过”报告。\u003c/p>", "toc": [{"id": "heading-0", "title": "实践手册：CRM + 交易系统", "level": 1}, {"id": "heading-1", "title": "项目定位与边界", "level": 2}, {"id": "heading-2", "title": "统一领域词汇", "level": 2}, {"id": "heading-3", "title": "全阶段不变量", "level": 2}, {"id": "heading-4", "title": "分阶段入口", "level": 2}, {"id": "heading-5", "title": "技术与实验约定", "level": 2}, {"id": "heading-6", "title": "证据与交付", "level": 2}], "units": [], "checks": []}, {"path": "practice/stage-00-diagnosis.md", "title": "阶段 0：能力诊断", "text": "阶段 0：能力诊断 实践首页 · 记录结果 · 下一阶段 目标与执行方式 这不是录取考试。目标是用四份可复核的结果定位弱项，并选择第一轮学习任务。 先独立作答；卡住时记录卡点，再查资料继续，不把查资料后的结果改写成一开始就会。暂时没有可运行环境时先给模型/SQL/时序和预期结果，执行证据标记“待补”，不能认定已达到 L2。第一轮不需要完整 Spring 服务。 准备 Java 21、编辑器及本地或容器 MySQL 8.4。环境不就绪先学 M07-4 与 M10-1；诊断代码可在独立练习目录中编写。每题用 证据模板 记录。 D0-1 金额、快照和状态 题目： 客户 C001 的商机 OPP001 有一份报价：商品 A 单价 19.90、数量 3；商品 B 单价 0.10、数量 3，币种 CNY。定义客户、报价版本、报价明细、订单快照与异常；报价发布后不能修改明细，只有有效报价可转订单。 任务： 写最小 Java 模型，计算总额；金额通过十进制字符串构造。 定义草稿、已发布、已转换三个状态及合法转换；有效期采用可替换 Clock。 修改创建报价前的原始明细列表，观察已发布报价是否变化。 测试空明细、负单价、数量 0、到期时刻和重复转单。 解释为何选择值对象、异常类型和快照范围，不要求先使用框架。 判定要点：总额为 60.00；非法输入被拒绝；历史快照不变；重复操作行为有定义；恰到有效期边界按失效处理。能输出正确数字但不能解释 scale、复制与状态约束，仍有基础待补。 映射： M01-1/3/4 、 M11-1 。 D0-2 建模、SQL 与执行计划 题目： 为客户、订单、订单明细设计关系表，字段至少含负责人、订单状态、创建时间和金额。查询“某负责人在指定时间段的客户成交额排行”，本题临时以 PAID 订单为统计来源，避免与阶段 1 未引入支付混淆。 测试数据： 客户 负责人 订单 C001 A PAID 60.00，含两行明细；CANCELLED 100.00 C002 A PAID 40.00，含一行明细 C003 A 无订单 C004 B PAID 200.00 任务：建表并说明主键/唯一键/外键/金额类型；写查询（要求保留无成交客户，显示 0）；采用半开时间区间 [from, to) ；解释 LEFT JOIN 筛选位置；为负责人、时间与排序提出索引并查看执行计划。 判定要点：A 的结果是 C001=60.00、C002=40.00、C003=0.00；不得因连接明细重复累计订单总额，不得包含 B；时间恰为 to 的订单不计入。小数据执行计划不能证明大数据性能，需说明这一限制。 映射： M05-1/2/3 。 D0-3 事务与并发故障 题目： 库存为 1，两个请求同时“查询余量大于 0，然后扣减”。 在纸上画两个请求都读到 1 的交错时序，预测结果。 用两个独立数据库连接及明确同步点复现错误写法；记录隔离级别与自动提交设置。 用数据库条件更新 available = available - 1 且条件 available > 0 修复，依据受影响行数判断成功，不把示例当完整库存方案。 在订单写入与扣减之间注入异常，检查是否全部回滚；说明本地 synchronized 能否保护两个服务实例。 判定要点：最多一个请求成功，库存最终为 0；失败事务不留下孤立订单；结果需有实际行数和时序证据。若仅能描述不能复现，记“能解释但不会做”。 映射： M03-1/2 、 M05-4/5 。 D0-4 测试与错误定位 题目： 为“报价转订单”的最小应用服务补测试；已有安全练习项目可使用真实接口，否则先用纯 Java 服务与仓储接口，不依赖创建完整系统。 验证正常创建、过期报价、其他负责人操作、仓储抛异常。 记录请求标识、业务步骤和失败原因；日志不包含密码或完整客户联系方式。 给出异常到 HTTP 状态的预期映射；尚无 HTTP 层则将集成验证标记“待补”。 故意删除一个状态检查，观察是否有测试失败；解释哪个测试需要真实数据库才有价值。 判定要点：测试检验行为而非只验证方法被调用；异常原因可定位；能区分单元与集成测试的证明范围。模拟仓储成功不能证明真实事务回滚。 映射： M06-4/6 、 M07-3 、 M12-1 。 诊断出口与第一轮任务 在进度表逐题填写三选一结论和帮助来源，不计算容易掩盖弱项的总分： 能独立完成：记录证据，阶段 1 可复用同类成果，仍须通过集成验收。 能解释但不会做：将对应实验选为下一主任务，读资料后立即复做。 尚未理解：先补单元前置，完成最小反例后再回题目。 优先顺序：金额/状态错误 → 数据约束/事务错误 → 权限错误 → 测试定位不足 → 性能与更深机制。一次只选择一个主单元，最多一个前置补充。 离开阶段 0 的条件是四题都有结果或具体阻塞记录、每个弱项映射到模块、第一轮任务与通过标准明确；不是要求诊断全部通过。进入阶段 1 后补齐被标记为待执行的环境与集成证据。", "html": "\u003ch1 id=\"heading-0\">阶段 0：能力诊断\u003c/h1>\n\u003cp>\u003ca href=\"#doc=practice%2FREADME.md\">实践首页\u003c/a> · \u003ca href=\"#doc=PROGRESS.md\">记录结果\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-01-business.md\">下一阶段\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">目标与执行方式\u003c/h2>\n\u003cp>这不是录取考试。目标是用四份可复核的结果定位弱项，并选择第一轮学习任务。\u003c/p>\n\u003cp>先独立作答；卡住时记录卡点，再查资料继续，不把查资料后的结果改写成一开始就会。暂时没有可运行环境时先给模型/SQL/时序和预期结果，执行证据标记“待补”，不能认定已达到 L2。第一轮不需要完整 Spring 服务。\u003c/p>\n\u003cp>准备 Java 21、编辑器及本地或容器 MySQL 8.4。环境不就绪先学 M07-4 与 M10-1；诊断代码可在独立练习目录中编写。每题用 \u003ca href=\"#doc=templates%2Fevidence.md\">证据模板\u003c/a> 记录。\u003c/p>\n\u003ch2 id=\"heading-2\">D0-1 金额、快照和状态\u003c/h2>\n\u003cp>\u003cstrong>题目：\u003c/strong> 客户 C001 的商机 OPP001 有一份报价：商品 A 单价 19.90、数量 3；商品 B 单价 0.10、数量 3，币种 CNY。定义客户、报价版本、报价明细、订单快照与异常；报价发布后不能修改明细，只有有效报价可转订单。\u003c/p>\n\u003cp>任务：\u003c/p>\n\u003col>\u003cli>写最小 Java 模型，计算总额；金额通过十进制字符串构造。\u003c/li>\u003cli>定义草稿、已发布、已转换三个状态及合法转换；有效期采用可替换 Clock。\u003c/li>\u003cli>修改创建报价前的原始明细列表，观察已发布报价是否变化。\u003c/li>\u003cli>测试空明细、负单价、数量 0、到期时刻和重复转单。\u003c/li>\u003cli>解释为何选择值对象、异常类型和快照范围，不要求先使用框架。\u003c/li>\u003c/ol>\n\u003cp>判定要点：总额为 60.00；非法输入被拒绝；历史快照不变；重复操作行为有定义；恰到有效期边界按失效处理。能输出正确数字但不能解释 scale、复制与状态约束，仍有基础待补。\u003c/p>\n\u003cp>映射：\u003ca href=\"#doc=modules%2Fm01-java.md\">M01-1/3/4\u003c/a>、\u003ca href=\"#doc=modules%2Fm11-architecture.md\">M11-1\u003c/a>。\u003c/p>\n\u003ch2 id=\"heading-3\">D0-2 建模、SQL 与执行计划\u003c/h2>\n\u003cp>\u003cstrong>题目：\u003c/strong> 为客户、订单、订单明细设计关系表，字段至少含负责人、订单状态、创建时间和金额。查询“某负责人在指定时间段的客户成交额排行”，本题临时以 PAID 订单为统计来源，避免与阶段 1 未引入支付混淆。\u003c/p>\n\u003cp>测试数据：\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"客户表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">客户\u003c/th>\u003cth scope=\"col\">负责人\u003c/th>\u003cth scope=\"col\">订单\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C001\u003c/td>\u003ctd>A\u003c/td>\u003ctd>PAID 60.00，含两行明细；CANCELLED 100.00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C002\u003c/td>\u003ctd>A\u003c/td>\u003ctd>PAID 40.00，含一行明细\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C003\u003c/td>\u003ctd>A\u003c/td>\u003ctd>无订单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C004\u003c/td>\u003ctd>B\u003c/td>\u003ctd>PAID 200.00\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>任务：建表并说明主键/唯一键/外键/金额类型；写查询（要求保留无成交客户，显示 0）；采用半开时间区间 \u003ccode>[from, to)\u003c/code>；解释 LEFT JOIN 筛选位置；为负责人、时间与排序提出索引并查看执行计划。\u003c/p>\n\u003cp>判定要点：A 的结果是 C001=60.00、C002=40.00、C003=0.00；不得因连接明细重复累计订单总额，不得包含 B；时间恰为 to 的订单不计入。小数据执行计划不能证明大数据性能，需说明这一限制。\u003c/p>\n\u003cp>映射：\u003ca href=\"#doc=modules%2Fm05-data.md\">M05-1/2/3\u003c/a>。\u003c/p>\n\u003ch2 id=\"heading-4\">D0-3 事务与并发故障\u003c/h2>\n\u003cp>\u003cstrong>题目：\u003c/strong> 库存为 1，两个请求同时“查询余量大于 0，然后扣减”。\u003c/p>\n\u003col>\u003cli>在纸上画两个请求都读到 1 的交错时序，预测结果。\u003c/li>\u003cli>用两个独立数据库连接及明确同步点复现错误写法；记录隔离级别与自动提交设置。\u003c/li>\u003cli>用数据库条件更新 \u003ccode>available = available - 1\u003c/code> 且条件 \u003ccode>available &gt; 0\u003c/code> 修复，依据受影响行数判断成功，不把示例当完整库存方案。\u003c/li>\u003cli>在订单写入与扣减之间注入异常，检查是否全部回滚；说明本地 synchronized 能否保护两个服务实例。\u003c/li>\u003c/ol>\n\u003cp>判定要点：最多一个请求成功，库存最终为 0；失败事务不留下孤立订单；结果需有实际行数和时序证据。若仅能描述不能复现，记“能解释但不会做”。\u003c/p>\n\u003cp>映射：\u003ca href=\"#doc=modules%2Fm03-concurrency.md\">M03-1/2\u003c/a>、\u003ca href=\"#doc=modules%2Fm05-data.md\">M05-4/5\u003c/a>。\u003c/p>\n\u003ch2 id=\"heading-5\">D0-4 测试与错误定位\u003c/h2>\n\u003cp>\u003cstrong>题目：\u003c/strong> 为“报价转订单”的最小应用服务补测试；已有安全练习项目可使用真实接口，否则先用纯 Java 服务与仓储接口，不依赖创建完整系统。\u003c/p>\n\u003col>\u003cli>验证正常创建、过期报价、其他负责人操作、仓储抛异常。\u003c/li>\u003cli>记录请求标识、业务步骤和失败原因；日志不包含密码或完整客户联系方式。\u003c/li>\u003cli>给出异常到 HTTP 状态的预期映射；尚无 HTTP 层则将集成验证标记“待补”。\u003c/li>\u003cli>故意删除一个状态检查，观察是否有测试失败；解释哪个测试需要真实数据库才有价值。\u003c/li>\u003c/ol>\n\u003cp>判定要点：测试检验行为而非只验证方法被调用；异常原因可定位；能区分单元与集成测试的证明范围。模拟仓储成功不能证明真实事务回滚。\u003c/p>\n\u003cp>映射：\u003ca href=\"#doc=modules%2Fm06-spring.md\">M06-4/6\u003c/a>、\u003ca href=\"#doc=modules%2Fm07-engineering.md\">M07-3\u003c/a>、\u003ca href=\"#doc=modules%2Fm12-security.md\">M12-1\u003c/a>。\u003c/p>\n\u003ch2 id=\"heading-6\">诊断出口与第一轮任务\u003c/h2>\n\u003cp>在进度表逐题填写三选一结论和帮助来源，不计算容易掩盖弱项的总分：\u003c/p>\n\u003cul>\u003cli>能独立完成：记录证据，阶段 1 可复用同类成果，仍须通过集成验收。\u003c/li>\u003cli>能解释但不会做：将对应实验选为下一主任务，读资料后立即复做。\u003c/li>\u003cli>尚未理解：先补单元前置，完成最小反例后再回题目。\u003c/li>\u003c/ul>\n\u003cp>优先顺序：金额/状态错误 → 数据约束/事务错误 → 权限错误 → 测试定位不足 → 性能与更深机制。一次只选择一个主单元，最多一个前置补充。\u003c/p>\n\u003cp>离开阶段 0 的条件是四题都有结果或具体阻塞记录、每个弱项映射到模块、第一轮任务与通过标准明确；不是要求诊断全部通过。进入阶段 1 后补齐被标记为待执行的环境与集成证据。\u003c/p>", "toc": [{"id": "heading-0", "title": "阶段 0：能力诊断", "level": 1}, {"id": "heading-1", "title": "目标与执行方式", "level": 2}, {"id": "heading-2", "title": "D0-1 金额、快照和状态", "level": 2}, {"id": "heading-3", "title": "D0-2 建模、SQL 与执行计划", "level": 2}, {"id": "heading-4", "title": "D0-3 事务与并发故障", "level": 2}, {"id": "heading-5", "title": "D0-4 测试与错误定位", "level": 2}, {"id": "heading-6", "title": "诊断出口与第一轮任务", "level": 2}], "units": [], "checks": []}, {"path": "practice/stage-01-business.md", "title": "阶段 1：客户 → 商机 → 报价 → 订单", "text": "阶段 1：客户 → 商机 → 报价 → 订单 实践首页 · 上一阶段 · 下一阶段 目标、前置与范围 入口：已完成诊断并选择弱项。完成一个有权限、数据约束、事务、测试和启动说明的模块化单体。此阶段不加入库存、真实支付、消息队列、微服务或多租户；这些通过后续需求演进加入。 主学 M01、M05、M06、M07；同步使用 M11-1/2 的业务建模、M12-1 的对象级权限、M10-1 的环境与日志。任务 ID 用于进度和证据引用。 固定业务规则 客户与商机 固定三个练习账号：销售 A、销售 B、管理员。账号由练习环境配置；密码不写入仓库。最小认证使用 Spring Security HTTP Basic，只在本机练习使用；状态改变请求使用框架 CSRF 防护与测试支持，不以关闭安全检查让用例通过。手工客户端先读取 CSRF token，保留同一会话 cookie，再携带认证和指定 token 请求头执行写操作。 销售只能创建属于自己的客户，并访问当前由自己负责的客户及其商机、报价、订单。管理员可查看全部并转移负责人。负责人来自可信身份；销售传入其他 ownerId 应被拒绝。 客户编码唯一，名称非空，客户可停用。停用后历史可查询，不能新建商机、发布报价或转订单；草稿可保留。 商机属于一个客户，状态为 OPEN/WON/LOST。仅 OPEN 可创建或发布报价、首次转订单；转订单成功后变为 WON。关闭为 LOST 后不得转单。阶段 1 暂不做重新打开与硬删除。 金额与报价 币种仅 CNY，单价非负且最多两位小数；不隐式舍入超精度输入。数量为正整数；使用 BigDecimal，金额存 DECIMAL(15,2)，应用同时拒绝总额溢出。金额 0.00 允许。 行金额=单价×数量，总额=行金额之和。第一阶段不加税、折扣或运费；需要学习舍入时做独立实验，不擅自改变业务规则。 报价以 (opportunityId, version) 唯一。版本递增，在并发创建时通过锁定商机行分配版本；允许历史版本并存，最多一个 ISSUED 版本。 状态为 DRAFT → ISSUED → CONVERTED；发布新版本时，原 ISSUED 版本在同一事务内改为 SUPERSEDED。DRAFT 可修改；发布后只允许状态变化，明细不可变。 发布时必须至少一行，客户启用、商机 OPEN， validUntil > now 。只允许在 now \u003c validUntil 时首次转换。用注入 Clock 测试时刻，保存 UTC Instant，展示时才转换时区。 订单与重复操作 订单保留客户名称、来源报价 ID/版本、SKU、商品名称、单价、数量、行金额和总额快照；不信任客户端上传的成交总额。 第一次转单在同一事务内校验业务、创建订单及明细、修改报价为 CONVERTED、商机为 WON。锁定商机行串行化该商机的发布与转单操作。 约束：每个商机最多一个订单，来源报价唯一。重复转换同一已转换报价，授权通过后返回原订单，HTTP 200；第一次创建为 201。该重试不重新判断报价是否过期或客户是否停用。 同一商机的其他报价不能再创建订单，返回 409。阶段 1 订单状态只有 CREATED，阶段 2 再演进支付/取消状态；不假装已经发生支付。 最小模型与模块边界 模块 模型/表 必须明确的约束 身份支持 练习账号/角色配置 身份可信、日志不泄漏密码；账号管理不是本阶段功能 CRM customer、opportunity customer.code 唯一；归属引用有效；ownerId 不由普通销售任意指定 Sales quote、quote_line 商机内版本唯一；明细序号唯一；数量/金额合法；引用有效 Trading orders、order_line opportunity_id 唯一；source_quote_id 唯一；金额/历史快照完整 用数据库主键、唯一键、外键与 CHECK 保护可表达的规则；状态转换、权限和跨表金额一致性由应用事务保护并测试。不要声称单行 CHECK 能检查订单明细合计。 按业务分包，各模块仅暴露必要的应用接口；控制器只负责协议，应用服务编排事务，领域对象维护规则，仓储处理持久化。初始同库本地事务可跨模块编排；直接使用其他模块内部 Mapper 的访问应被依赖检查阻止。 最小接口契约 这些是练习实现规格，当前仓库尚未实现接口。ID 由服务端分配；成功响应至少包含 ID 和状态，金额用十进制字符串表达；列表默认 20 条、最多 100 条，并按稳定 ID 排序。 方法与路径 用途与关键输入 成功结果 GET /csrf 已认证练习客户端取得当前会话的 CSRF token 200，token 与 headerName；客户端保留会话 cookie POST /customers code、name；销售归自己，管理员可指定合法 ownerId 201，customerId GET /customers；GET /customers/{id} 当前权限范围的列表与详情 200 PATCH /customers/{id} 名称/启用状态；管理员另可转移负责人 200，修改后的摘要 POST /opportunities customerId、title 201，opportunityId、OPEN POST /opportunities/{id}/close 关闭为 LOST 200；已有订单则 409 POST /opportunities/{id}/quotes validUntil、明细（sku/name/unitPrice/quantity） 201，quoteId、version、DRAFT PUT /quotes/{id} 修改草稿完整内容 200；非草稿 409 POST /quotes/{id}/issue 发布当前草稿 200，ISSUED；非法状态 409 GET /quotes/{id} 授权后的报价及明细 200 POST /quotes/{id}/orders 从服务端报价快照转单，无客户端价格 首次 201，重试 200，同一个 orderId GET /orders/{id} 订单快照 200 输入格式/数值非法 400，认证失败 401，已认证越权 403，不存在 404，状态/唯一性冲突 409，未预期系统错误 500。练习统一错误体含 code 、 message 、 requestId ，不回传 SQL、凭据或堆栈；控制器异常与安全过滤器的认证/拒绝处理都要覆盖。CSRF 校验失败为 403，可能先于认证处理发生，因此认证缺失用安全的 GET 请求单独验收，其他业务写入测试携带合法 token。 任务顺序与产出 任务 执行内容 相关单元 交付与出口 S1-01 写词汇表、状态图、权限矩阵和 INV-01–05 的实例 M11-1/2、M12-1 对正常、边界和拒绝情况能给明确预期 S1-02 建独立 Java 21 练习工程，锁定依赖；配置 MySQL/Flyway；提供环境变量示例 M07-4、M10-1、M05-6 记录版本；空数据库自动迁移，密码不入库 S1-03 实现 Money、报价明细、不可变快照和 Clock M01-1/3/4、M07-3 纯单元测试包含精度、溢出、可变列表、有效期 S1-04 设计并迁移表；写少量固定虚构数据；用 JDBC 做一次完整事务 M05-1/2/4/5 约束可阻止错误数据；异常时真实数据库无部分写入 S1-05 接入 MyBatis，对照 JDBC 事务；完成客户与商机入口 M05-5、M06-1/4 数据访问边界清楚，客户归属与状态规则通过 S1-06 完成报价版本分配、修改与发布 M01-4、M06-2、M05-4 新版本取代旧版，发布后明细不可变 S1-07 实现转订单事务与重复请求处理 M05-2/4、M06-2 订单/明细/报价/商机原子变化，重复只得到同一订单 S1-08 接入认证、数据范围、错误映射和请求标识 M06-4/5、M12-1 A/B/管理员权限矩阵通过；可信身份不被请求覆盖 S1-09 集成测试、模块依赖检查、CI；注入写入失败与遗漏校验 M07-2/3/5、M06-6 测试能发现实际错误；真实提交验证不被测试回滚掩盖 S1-10 全新目录/数据库复现启动、测试和打包；完成闭卷复述 M10-1、M07-6 启动说明可复现、证据齐全、剩余问题明确 不要等待整个模块读完才动手。S1-03 遇到复制问题只补 M01-4；S1-07 事务异常只补 M05-4 和 M06-2，再回到任务。 验收场景与预期 固定测试时刻 2026-01-01T00:00:00Z ，报价到期 2026-01-02T00:00:00Z ；C001 属于 A，C002 属于 B。SKU-A 19.90×3，SKU-B 0.10×3，总额 60.00。 编号 场景 必须得到的结果 T1-01 A 为 C001 创建商机、报价、发布并转单 首次 201；订单 CREATED、报价 CONVERTED、商机 WON；金额 60.00 T1-02 同一报价再次转单，包括报价已过期后重试 200，同一订单 ID；库中仍只有一个订单 T1-03 A 查看/修改 C002，或传入 B 的 ownerId 创建客户 403，客户内容不泄漏，无写入 T1-04 未认证 GET；不存在的对象；非法金额或空明细发布；缺失/错误 CSRF 的写请求 分别 401、404、400、403；错误含 requestId T1-05 当前时刻恰等于 validUntil 首次转单 409；无订单或状态残留 T1-06 发布新版本后用旧版本转单；修改已发布明细 均 409；旧版 SUPERSEDED，金额不变 T1-07 客户停用或商机 LOST 后首次转单 409；历史读取仍按权限允许 T1-08 订单主表写入后、明细写入前注入异常 500；订单/明细不存在，报价仍 ISSUED，商机仍 OPEN T1-09 两个请求并发转换同一报价 一个 201、一个 200，返回同一订单；约束无重复 T1-10 发布两份新报价与转单相竞争 商机锁决定串行结果；至多一个有效发布版本、一个订单；失效操作 409 T1-11 修改客户名称，或修改原始明细列表 已有订单名称与金额快照不变 T1-12 以全新数据库启动，再重复执行迁移流程 结构/版本正确；重复启动不重复建表或破坏数据 T1-13 金额恰为 0、超过两位小数、总额超 DECIMAL 范围 0 合法；超精度与溢出 400，禁止静默截断 阶段出口 S1-01–10 有对应产出，T1-01–13 全部通过并记录结果。 能画出一次请求、一次失败回滚和一次重复转单的完整时序。 能说明每条不变量由哪里保证：对象、事务、数据库约束或权限边界。 变式复测：“报价版本”改为“合同版本”，独立说明快照、权限与状态变化。 在进度表登记实际达到的单元等级。服务能启动不代表已掌握并发、JVM 或架构设计。", "html": "\u003ch1 id=\"heading-0\">阶段 1：客户 → 商机 → 报价 → 订单\u003c/h1>\n\u003cp>\u003ca href=\"#doc=practice%2FREADME.md\">实践首页\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-00-diagnosis.md\">上一阶段\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-02-correctness.md\">下一阶段\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">目标、前置与范围\u003c/h2>\n\u003cp>入口：已完成诊断并选择弱项。完成一个有权限、数据约束、事务、测试和启动说明的模块化单体。此阶段不加入库存、真实支付、消息队列、微服务或多租户；这些通过后续需求演进加入。\u003c/p>\n\u003cp>主学 M01、M05、M06、M07；同步使用 M11-1/2 的业务建模、M12-1 的对象级权限、M10-1 的环境与日志。任务 ID 用于进度和证据引用。\u003c/p>\n\u003ch2 id=\"heading-2\">固定业务规则\u003c/h2>\n\u003ch3 id=\"heading-3\">客户与商机\u003c/h3>\n\u003cul>\u003cli>固定三个练习账号：销售 A、销售 B、管理员。账号由练习环境配置；密码不写入仓库。最小认证使用 Spring Security HTTP Basic，只在本机练习使用；状态改变请求使用框架 CSRF 防护与测试支持，不以关闭安全检查让用例通过。手工客户端先读取 CSRF token，保留同一会话 cookie，再携带认证和指定 token 请求头执行写操作。\u003c/li>\u003cli>销售只能创建属于自己的客户，并访问当前由自己负责的客户及其商机、报价、订单。管理员可查看全部并转移负责人。负责人来自可信身份；销售传入其他 ownerId 应被拒绝。\u003c/li>\u003cli>客户编码唯一，名称非空，客户可停用。停用后历史可查询，不能新建商机、发布报价或转订单；草稿可保留。\u003c/li>\u003cli>商机属于一个客户，状态为 OPEN/WON/LOST。仅 OPEN 可创建或发布报价、首次转订单；转订单成功后变为 WON。关闭为 LOST 后不得转单。阶段 1 暂不做重新打开与硬删除。\u003c/li>\u003c/ul>\n\u003ch3 id=\"heading-4\">金额与报价\u003c/h3>\n\u003cul>\u003cli>币种仅 CNY，单价非负且最多两位小数；不隐式舍入超精度输入。数量为正整数；使用 BigDecimal，金额存 DECIMAL(15,2)，应用同时拒绝总额溢出。金额 0.00 允许。\u003c/li>\u003cli>行金额=单价×数量，总额=行金额之和。第一阶段不加税、折扣或运费；需要学习舍入时做独立实验，不擅自改变业务规则。\u003c/li>\u003cli>报价以 \u003ccode>(opportunityId, version)\u003c/code> 唯一。版本递增，在并发创建时通过锁定商机行分配版本；允许历史版本并存，最多一个 ISSUED 版本。\u003c/li>\u003cli>状态为 DRAFT → ISSUED → CONVERTED；发布新版本时，原 ISSUED 版本在同一事务内改为 SUPERSEDED。DRAFT 可修改；发布后只允许状态变化，明细不可变。\u003c/li>\u003cli>发布时必须至少一行，客户启用、商机 OPEN，\u003ccode>validUntil &gt; now\u003c/code>。只允许在 \u003ccode>now &lt; validUntil\u003c/code> 时首次转换。用注入 Clock 测试时刻，保存 UTC Instant，展示时才转换时区。\u003c/li>\u003c/ul>\n\u003ch3 id=\"heading-5\">订单与重复操作\u003c/h3>\n\u003cul>\u003cli>订单保留客户名称、来源报价 ID/版本、SKU、商品名称、单价、数量、行金额和总额快照；不信任客户端上传的成交总额。\u003c/li>\u003cli>第一次转单在同一事务内校验业务、创建订单及明细、修改报价为 CONVERTED、商机为 WON。锁定商机行串行化该商机的发布与转单操作。\u003c/li>\u003cli>约束：每个商机最多一个订单，来源报价唯一。重复转换同一已转换报价，授权通过后返回原订单，HTTP 200；第一次创建为 201。该重试不重新判断报价是否过期或客户是否停用。\u003c/li>\u003cli>同一商机的其他报价不能再创建订单，返回 409。阶段 1 订单状态只有 CREATED，阶段 2 再演进支付/取消状态；不假装已经发生支付。\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-6\">最小模型与模块边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"模块表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">模块\u003c/th>\u003cth scope=\"col\">模型/表\u003c/th>\u003cth scope=\"col\">必须明确的约束\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>身份支持\u003c/td>\u003ctd>练习账号/角色配置\u003c/td>\u003ctd>身份可信、日志不泄漏密码；账号管理不是本阶段功能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CRM\u003c/td>\u003ctd>customer、opportunity\u003c/td>\u003ctd>customer.code 唯一；归属引用有效；ownerId 不由普通销售任意指定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sales\u003c/td>\u003ctd>quote、quote_line\u003c/td>\u003ctd>商机内版本唯一；明细序号唯一；数量/金额合法；引用有效\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Trading\u003c/td>\u003ctd>orders、order_line\u003c/td>\u003ctd>opportunity_id 唯一；source_quote_id 唯一；金额/历史快照完整\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>用数据库主键、唯一键、外键与 CHECK 保护可表达的规则；状态转换、权限和跨表金额一致性由应用事务保护并测试。不要声称单行 CHECK 能检查订单明细合计。\u003c/p>\n\u003cp>按业务分包，各模块仅暴露必要的应用接口；控制器只负责协议，应用服务编排事务，领域对象维护规则，仓储处理持久化。初始同库本地事务可跨模块编排；直接使用其他模块内部 Mapper 的访问应被依赖检查阻止。\u003c/p>\n\u003ch2 id=\"heading-7\">最小接口契约\u003c/h2>\n\u003cp>这些是练习实现规格，当前仓库尚未实现接口。ID 由服务端分配；成功响应至少包含 ID 和状态，金额用十进制字符串表达；列表默认 20 条、最多 100 条，并按稳定 ID 排序。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"方法与路径表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">方法与路径\u003c/th>\u003cth scope=\"col\">用途与关键输入\u003c/th>\u003cth scope=\"col\">成功结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>GET /csrf\u003c/td>\u003ctd>已认证练习客户端取得当前会话的 CSRF token\u003c/td>\u003ctd>200，token 与 headerName；客户端保留会话 cookie\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST /customers\u003c/td>\u003ctd>code、name；销售归自己，管理员可指定合法 ownerId\u003c/td>\u003ctd>201，customerId\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GET /customers；GET /customers/{id}\u003c/td>\u003ctd>当前权限范围的列表与详情\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PATCH /customers/{id}\u003c/td>\u003ctd>名称/启用状态；管理员另可转移负责人\u003c/td>\u003ctd>200，修改后的摘要\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST /opportunities\u003c/td>\u003ctd>customerId、title\u003c/td>\u003ctd>201，opportunityId、OPEN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST /opportunities/{id}/close\u003c/td>\u003ctd>关闭为 LOST\u003c/td>\u003ctd>200；已有订单则 409\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST /opportunities/{id}/quotes\u003c/td>\u003ctd>validUntil、明细（sku/name/unitPrice/quantity）\u003c/td>\u003ctd>201，quoteId、version、DRAFT\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PUT /quotes/{id}\u003c/td>\u003ctd>修改草稿完整内容\u003c/td>\u003ctd>200；非草稿 409\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST /quotes/{id}/issue\u003c/td>\u003ctd>发布当前草稿\u003c/td>\u003ctd>200，ISSUED；非法状态 409\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GET /quotes/{id}\u003c/td>\u003ctd>授权后的报价及明细\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST /quotes/{id}/orders\u003c/td>\u003ctd>从服务端报价快照转单，无客户端价格\u003c/td>\u003ctd>首次 201，重试 200，同一个 orderId\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GET /orders/{id}\u003c/td>\u003ctd>订单快照\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>输入格式/数值非法 400，认证失败 401，已认证越权 403，不存在 404，状态/唯一性冲突 409，未预期系统错误 500。练习统一错误体含 \u003ccode>code\u003c/code>、\u003ccode>message\u003c/code>、\u003ccode>requestId\u003c/code>，不回传 SQL、凭据或堆栈；控制器异常与安全过滤器的认证/拒绝处理都要覆盖。CSRF 校验失败为 403，可能先于认证处理发生，因此认证缺失用安全的 GET 请求单独验收，其他业务写入测试携带合法 token。\u003c/p>\n\u003ch2 id=\"heading-8\">任务顺序与产出\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"任务表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">任务\u003c/th>\u003cth scope=\"col\">执行内容\u003c/th>\u003cth scope=\"col\">相关单元\u003c/th>\u003cth scope=\"col\">交付与出口\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S1-01\u003c/td>\u003ctd>写词汇表、状态图、权限矩阵和 INV-01–05 的实例\u003c/td>\u003ctd>M11-1/2、M12-1\u003c/td>\u003ctd>对正常、边界和拒绝情况能给明确预期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-02\u003c/td>\u003ctd>建独立 Java 21 练习工程，锁定依赖；配置 MySQL/Flyway；提供环境变量示例\u003c/td>\u003ctd>M07-4、M10-1、M05-6\u003c/td>\u003ctd>记录版本；空数据库自动迁移，密码不入库\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-03\u003c/td>\u003ctd>实现 Money、报价明细、不可变快照和 Clock\u003c/td>\u003ctd>M01-1/3/4、M07-3\u003c/td>\u003ctd>纯单元测试包含精度、溢出、可变列表、有效期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-04\u003c/td>\u003ctd>设计并迁移表；写少量固定虚构数据；用 JDBC 做一次完整事务\u003c/td>\u003ctd>M05-1/2/4/5\u003c/td>\u003ctd>约束可阻止错误数据；异常时真实数据库无部分写入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-05\u003c/td>\u003ctd>接入 MyBatis，对照 JDBC 事务；完成客户与商机入口\u003c/td>\u003ctd>M05-5、M06-1/4\u003c/td>\u003ctd>数据访问边界清楚，客户归属与状态规则通过\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-06\u003c/td>\u003ctd>完成报价版本分配、修改与发布\u003c/td>\u003ctd>M01-4、M06-2、M05-4\u003c/td>\u003ctd>新版本取代旧版，发布后明细不可变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-07\u003c/td>\u003ctd>实现转订单事务与重复请求处理\u003c/td>\u003ctd>M05-2/4、M06-2\u003c/td>\u003ctd>订单/明细/报价/商机原子变化，重复只得到同一订单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-08\u003c/td>\u003ctd>接入认证、数据范围、错误映射和请求标识\u003c/td>\u003ctd>M06-4/5、M12-1\u003c/td>\u003ctd>A/B/管理员权限矩阵通过；可信身份不被请求覆盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-09\u003c/td>\u003ctd>集成测试、模块依赖检查、CI；注入写入失败与遗漏校验\u003c/td>\u003ctd>M07-2/3/5、M06-6\u003c/td>\u003ctd>测试能发现实际错误；真实提交验证不被测试回滚掩盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1-10\u003c/td>\u003ctd>全新目录/数据库复现启动、测试和打包；完成闭卷复述\u003c/td>\u003ctd>M10-1、M07-6\u003c/td>\u003ctd>启动说明可复现、证据齐全、剩余问题明确\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>不要等待整个模块读完才动手。S1-03 遇到复制问题只补 M01-4；S1-07 事务异常只补 M05-4 和 M06-2，再回到任务。\u003c/p>\n\u003ch2 id=\"heading-9\">验收场景与预期\u003c/h2>\n\u003cp>固定测试时刻 \u003ccode>2026-01-01T00:00:00Z\u003c/code>，报价到期 \u003ccode>2026-01-02T00:00:00Z\u003c/code>；C001 属于 A，C002 属于 B。SKU-A 19.90×3，SKU-B 0.10×3，总额 60.00。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"编号表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">编号\u003c/th>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">必须得到的结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>T1-01\u003c/td>\u003ctd>A 为 C001 创建商机、报价、发布并转单\u003c/td>\u003ctd>首次 201；订单 CREATED、报价 CONVERTED、商机 WON；金额 60.00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-02\u003c/td>\u003ctd>同一报价再次转单，包括报价已过期后重试\u003c/td>\u003ctd>200，同一订单 ID；库中仍只有一个订单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-03\u003c/td>\u003ctd>A 查看/修改 C002，或传入 B 的 ownerId 创建客户\u003c/td>\u003ctd>403，客户内容不泄漏，无写入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-04\u003c/td>\u003ctd>未认证 GET；不存在的对象；非法金额或空明细发布；缺失/错误 CSRF 的写请求\u003c/td>\u003ctd>分别 401、404、400、403；错误含 requestId\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-05\u003c/td>\u003ctd>当前时刻恰等于 validUntil\u003c/td>\u003ctd>首次转单 409；无订单或状态残留\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-06\u003c/td>\u003ctd>发布新版本后用旧版本转单；修改已发布明细\u003c/td>\u003ctd>均 409；旧版 SUPERSEDED，金额不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-07\u003c/td>\u003ctd>客户停用或商机 LOST 后首次转单\u003c/td>\u003ctd>409；历史读取仍按权限允许\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-08\u003c/td>\u003ctd>订单主表写入后、明细写入前注入异常\u003c/td>\u003ctd>500；订单/明细不存在，报价仍 ISSUED，商机仍 OPEN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-09\u003c/td>\u003ctd>两个请求并发转换同一报价\u003c/td>\u003ctd>一个 201、一个 200，返回同一订单；约束无重复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-10\u003c/td>\u003ctd>发布两份新报价与转单相竞争\u003c/td>\u003ctd>商机锁决定串行结果；至多一个有效发布版本、一个订单；失效操作 409\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-11\u003c/td>\u003ctd>修改客户名称，或修改原始明细列表\u003c/td>\u003ctd>已有订单名称与金额快照不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-12\u003c/td>\u003ctd>以全新数据库启动，再重复执行迁移流程\u003c/td>\u003ctd>结构/版本正确；重复启动不重复建表或破坏数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1-13\u003c/td>\u003ctd>金额恰为 0、超过两位小数、总额超 DECIMAL 范围\u003c/td>\u003ctd>0 合法；超精度与溢出 400，禁止静默截断\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-10\">阶段出口\u003c/h2>\n\u003cul class=\"checklist\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-01-business.md::aa7377cf8a28\">\u003cspan>S1-01–10 有对应产出，T1-01–13 全部通过并记录结果。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-01-business.md::ea1376badde3\">\u003cspan>能画出一次请求、一次失败回滚和一次重复转单的完整时序。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-01-business.md::e9f554477e97\">\u003cspan>能说明每条不变量由哪里保证：对象、事务、数据库约束或权限边界。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-01-business.md::723ed55bb70c\">\u003cspan>变式复测：“报价版本”改为“合同版本”，独立说明快照、权限与状态变化。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-01-business.md::aa950c77e0c1\">\u003cspan>在进度表登记实际达到的单元等级。服务能启动不代表已掌握并发、JVM 或架构设计。\u003c/span>\u003c/label>\u003c/li>\u003c/ul>", "toc": [{"id": "heading-0", "title": "阶段 1：客户 → 商机 → 报价 → 订单", "level": 1}, {"id": "heading-1", "title": "目标、前置与范围", "level": 2}, {"id": "heading-2", "title": "固定业务规则", "level": 2}, {"id": "heading-3", "title": "客户与商机", "level": 3}, {"id": "heading-4", "title": "金额与报价", "level": 3}, {"id": "heading-5", "title": "订单与重复操作", "level": 3}, {"id": "heading-6", "title": "最小模型与模块边界", "level": 2}, {"id": "heading-7", "title": "最小接口契约", "level": 2}, {"id": "heading-8", "title": "任务顺序与产出", "level": 2}, {"id": "heading-9", "title": "验收场景与预期", "level": 2}, {"id": "heading-10", "title": "阶段出口", "level": 2}], "units": [], "checks": [{"id": "practice/stage-01-business.md::aa7377cf8a28", "text": "S1-01–10 有对应产出，T1-01–13 全部通过并记录结果。"}, {"id": "practice/stage-01-business.md::ea1376badde3", "text": "能画出一次请求、一次失败回滚和一次重复转单的完整时序。"}, {"id": "practice/stage-01-business.md::e9f554477e97", "text": "能说明每条不变量由哪里保证：对象、事务、数据库约束或权限边界。"}, {"id": "practice/stage-01-business.md::723ed55bb70c", "text": "变式复测：“报价版本”改为“合同版本”，独立说明快照、权限与状态变化。"}, {"id": "practice/stage-01-business.md::aa950c77e0c1", "text": "在进度表登记实际达到的单元等级。服务能启动不代表已掌握并发、JVM 或架构设计。"}]}, {"path": "practice/stage-02-correctness.md", "title": "阶段 2：并发正确性与排障", "text": "阶段 2：并发正确性与排障 实践首页 · 上一阶段 · 下一阶段 目标与前置 入口：阶段 1 的业务、权限、事务与测试通过。重点学习 M03、M04、M05-3/4/5，按需回补 M02。守住 INV-06/07，同时用证据定位性能问题。 新增模型与业务规则 库存每个 SKU 维护 onHand（在库）、reserved（已预留），available=onHand-reserved，均非负。预留时 reserved 增加；取消释放时 reserved 减少；确认支付后将预留提交为售出，onHand 与 reserved 同量减少。 订单从 CREATED 经库存预留进入 PENDING_PAYMENT；库存不足则保留 CREATED 并返回明确失败，可补货后重试。预留的失败不能留下部分 SKU 占用。第一版不做分仓和部分预留。 PENDING_PAYMENT → PAID 或 CANCELLED；待支付到期走取消。PAID → REFUND_PENDING → REFUNDED。阶段 2 只做整单退款，履约仅做售出标记，不涉及物流。 正常退款成功后库存回补一次；晚到支付发生在订单已 CANCELLED 时，不再销售或重复扣库存，保留取消状态并创建独立退款任务，退款结果记录在支付侧。这类异常收款与退款进入资金对账台账，不确认正常成交，也不回补已经释放的库存。 每个订单最多一次有效支付确认。模拟渠道可重复发送通知，流水号唯一；金额与订单不一致应拒绝并留下对账记录。未知流水/订单进入待核查，不伪造匹配。 库存预留按订单唯一；支付按渠道流水唯一，退款按退款业务号唯一。唯一约束与状态条件更新共同保证幂等，不能只在内存中缓存请求 ID。 此阶段各模块仍在同一练习数据库，采用本地事务保护订单和库存；模拟支付渠道用独立的可查询记录表示外部事实，不能假设本地回滚能撤销渠道扣款。 任务与交付 任务 执行方式 产出与通过标准 S2-01 状态与约束 画订单、预留、支付、退款状态图，明确本地事务与外部事实边界 用例覆盖取消/支付竞争，数量与金额守恒规则明确 S2-02 并发预留 SKU 库存 10，100 个不同订单各预留 1；通过屏障同时开始 最多 10 个成功，无负库存；支持多 SKU 失败整体回滚 S2-03 支付与退款 注入重复通知、晚到成功、金额错误、退款失败后重试 同一事实只生效一次；取消订单不复活；待处理状态可查询 S2-04 数据库诊断 注入反序加锁、长事务、缺索引和连接未归还；逐项定位 SQL/锁等待/执行计划/连接池证据与根因一致，修复后复测 S2-05 JVM 诊断 注入 CPU 循环、线程等待、客户导出引用保留 至少三份不同类别诊断，使用线程转储/JFR/堆证据 S2-06 性能对照 对客户查询、报价转单各建基线，改变一个瓶颈因素 数据量/并发/分布/机器/版本齐全，至少三次同条件对比 验收矩阵 场景 预期 正常预留 1 件并支付 reserved 先 +1，再 -1；onHand 在支付时 -1；订单 PAID 库存为 0，或多 SKU 中一种不足 不成功预留；所有 SKU 保持原值；订单可重试 同订单并发预留/取消 每次状态动作最多生效一次；不释放未拥有的数量 同支付通知重放 10 次 只有一次支付确认和一次库存提交 取消先提交，随后支付成功通知到达 订单仍 CANCELLED，退款任务唯一；不重复释放库存 支付先提交，随后取消到达 不执行待支付取消；请求应改走退款流程 正常退款通知重放 累计退款不超实付；整单退款与库存回补各一次 退款渠道已成功但本地未收到结果 通过业务号查询/对账后收敛，不能直接认为未退并无限新建退款 线程池满、连接池满、慢下游 拒绝/超时行为有定义、无无限排队；资源最终释放 逐项核对数据库状态及业务总量，不能只看 HTTP 返回。并发正确性与压力容量分开实验，避免混淆失败原因。 性能记录要求 先分别测试小数据与放大数据，再增加并发到观察到饱和趋势为止；负载上限以练习机器可承受范围为准。记录 P50/P95/P99、吞吐、错误率、CPU、内存、GC、数据库连接与队列。比较相同预热、样本量和持续时间，报告波动，不把教学数据外推为生产承诺。 阶段出口 库存与资金不变量在正常、边界、竞争及重试下通过。 每类诊断都有假设、证据、根因、修复与复测；观测不到的问题不编造结论。 压测报告能由他人按记录复现。 变式复测：把库存换为优惠券名额，解释哪些原子边界可复用。 使用 学习证据模板 ，更新 M03/M04/M05 的实际等级。", "html": "\u003ch1 id=\"heading-0\">阶段 2：并发正确性与排障\u003c/h1>\n\u003cp>\u003ca href=\"#doc=practice%2FREADME.md\">实践首页\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-01-business.md\">上一阶段\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-03-resilience.md\">下一阶段\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">目标与前置\u003c/h2>\n\u003cp>入口：阶段 1 的业务、权限、事务与测试通过。重点学习 M03、M04、M05-3/4/5，按需回补 M02。守住 INV-06/07，同时用证据定位性能问题。\u003c/p>\n\u003ch2 id=\"heading-2\">新增模型与业务规则\u003c/h2>\n\u003cul>\u003cli>库存每个 SKU 维护 onHand（在库）、reserved（已预留），available=onHand-reserved，均非负。预留时 reserved 增加；取消释放时 reserved 减少；确认支付后将预留提交为售出，onHand 与 reserved 同量减少。\u003c/li>\u003cli>订单从 CREATED 经库存预留进入 PENDING_PAYMENT；库存不足则保留 CREATED 并返回明确失败，可补货后重试。预留的失败不能留下部分 SKU 占用。第一版不做分仓和部分预留。\u003c/li>\u003cli>PENDING_PAYMENT → PAID 或 CANCELLED；待支付到期走取消。PAID → REFUND_PENDING → REFUNDED。阶段 2 只做整单退款，履约仅做售出标记，不涉及物流。\u003c/li>\u003cli>正常退款成功后库存回补一次；晚到支付发生在订单已 CANCELLED 时，不再销售或重复扣库存，保留取消状态并创建独立退款任务，退款结果记录在支付侧。这类异常收款与退款进入资金对账台账，不确认正常成交，也不回补已经释放的库存。\u003c/li>\u003cli>每个订单最多一次有效支付确认。模拟渠道可重复发送通知，流水号唯一；金额与订单不一致应拒绝并留下对账记录。未知流水/订单进入待核查，不伪造匹配。\u003c/li>\u003cli>库存预留按订单唯一；支付按渠道流水唯一，退款按退款业务号唯一。唯一约束与状态条件更新共同保证幂等，不能只在内存中缓存请求 ID。\u003c/li>\u003cli>此阶段各模块仍在同一练习数据库，采用本地事务保护订单和库存；模拟支付渠道用独立的可查询记录表示外部事实，不能假设本地回滚能撤销渠道扣款。\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-3\">任务与交付\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"任务表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">任务\u003c/th>\u003cth scope=\"col\">执行方式\u003c/th>\u003cth scope=\"col\">产出与通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S2-01 状态与约束\u003c/td>\u003ctd>画订单、预留、支付、退款状态图，明确本地事务与外部事实边界\u003c/td>\u003ctd>用例覆盖取消/支付竞争，数量与金额守恒规则明确\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S2-02 并发预留\u003c/td>\u003ctd>SKU 库存 10，100 个不同订单各预留 1；通过屏障同时开始\u003c/td>\u003ctd>最多 10 个成功，无负库存；支持多 SKU 失败整体回滚\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S2-03 支付与退款\u003c/td>\u003ctd>注入重复通知、晚到成功、金额错误、退款失败后重试\u003c/td>\u003ctd>同一事实只生效一次；取消订单不复活；待处理状态可查询\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S2-04 数据库诊断\u003c/td>\u003ctd>注入反序加锁、长事务、缺索引和连接未归还；逐项定位\u003c/td>\u003ctd>SQL/锁等待/执行计划/连接池证据与根因一致，修复后复测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S2-05 JVM 诊断\u003c/td>\u003ctd>注入 CPU 循环、线程等待、客户导出引用保留\u003c/td>\u003ctd>至少三份不同类别诊断，使用线程转储/JFR/堆证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S2-06 性能对照\u003c/td>\u003ctd>对客户查询、报价转单各建基线，改变一个瓶颈因素\u003c/td>\u003ctd>数据量/并发/分布/机器/版本齐全，至少三次同条件对比\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">验收矩阵\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">预期\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常预留 1 件并支付\u003c/td>\u003ctd>reserved 先 +1，再 -1；onHand 在支付时 -1；订单 PAID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>库存为 0，或多 SKU 中一种不足\u003c/td>\u003ctd>不成功预留；所有 SKU 保持原值；订单可重试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同订单并发预留/取消\u003c/td>\u003ctd>每次状态动作最多生效一次；不释放未拥有的数量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同支付通知重放 10 次\u003c/td>\u003ctd>只有一次支付确认和一次库存提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>取消先提交，随后支付成功通知到达\u003c/td>\u003ctd>订单仍 CANCELLED，退款任务唯一；不重复释放库存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>支付先提交，随后取消到达\u003c/td>\u003ctd>不执行待支付取消；请求应改走退款流程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>正常退款通知重放\u003c/td>\u003ctd>累计退款不超实付；整单退款与库存回补各一次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>退款渠道已成功但本地未收到结果\u003c/td>\u003ctd>通过业务号查询/对账后收敛，不能直接认为未退并无限新建退款\u003c/td>\u003c/tr>\u003ctr>\u003ctd>线程池满、连接池满、慢下游\u003c/td>\u003ctd>拒绝/超时行为有定义、无无限排队；资源最终释放\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>逐项核对数据库状态及业务总量，不能只看 HTTP 返回。并发正确性与压力容量分开实验，避免混淆失败原因。\u003c/p>\n\u003ch2 id=\"heading-5\">性能记录要求\u003c/h2>\n\u003cp>先分别测试小数据与放大数据，再增加并发到观察到饱和趋势为止；负载上限以练习机器可承受范围为准。记录 P50/P95/P99、吞吐、错误率、CPU、内存、GC、数据库连接与队列。比较相同预热、样本量和持续时间，报告波动，不把教学数据外推为生产承诺。\u003c/p>\n\u003ch2 id=\"heading-6\">阶段出口\u003c/h2>\n\u003cul class=\"checklist\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-02-correctness.md::4b6f8272422e\">\u003cspan>库存与资金不变量在正常、边界、竞争及重试下通过。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-02-correctness.md::cb26ac804289\">\u003cspan>每类诊断都有假设、证据、根因、修复与复测；观测不到的问题不编造结论。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-02-correctness.md::f5087294f8d9\">\u003cspan>压测报告能由他人按记录复现。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-02-correctness.md::9f14ee397b17\">\u003cspan>变式复测：把库存换为优惠券名额，解释哪些原子边界可复用。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-02-correctness.md::d7c5325b1733\">\u003cspan>使用 \u003ca href=\"#doc=templates%2Fevidence.md\">学习证据模板\u003c/a>，更新 M03/M04/M05 的实际等级。\u003c/span>\u003c/label>\u003c/li>\u003c/ul>", "toc": [{"id": "heading-0", "title": "阶段 2：并发正确性与排障", "level": 1}, {"id": "heading-1", "title": "目标与前置", "level": 2}, {"id": "heading-2", "title": "新增模型与业务规则", "level": 2}, {"id": "heading-3", "title": "任务与交付", "level": 2}, {"id": "heading-4", "title": "验收矩阵", "level": 2}, {"id": "heading-5", "title": "性能记录要求", "level": 2}, {"id": "heading-6", "title": "阶段出口", "level": 2}], "units": [], "checks": [{"id": "practice/stage-02-correctness.md::4b6f8272422e", "text": "库存与资金不变量在正常、边界、竞争及重试下通过。"}, {"id": "practice/stage-02-correctness.md::cb26ac804289", "text": "每类诊断都有假设、证据、根因、修复与复测；观测不到的问题不编造结论。"}, {"id": "practice/stage-02-correctness.md::f5087294f8d9", "text": "压测报告能由他人按记录复现。"}, {"id": "practice/stage-02-correctness.md::9f14ee397b17", "text": "变式复测：把库存换为优惠券名额，解释哪些原子边界可复用。"}, {"id": "practice/stage-02-correctness.md::d7c5325b1733", "text": "使用 [学习证据模板](../templates/evidence.md)，更新 M03/M04/M05 的实际等级。"}]}, {"path": "practice/stage-03-resilience.md", "title": "阶段 3：让系统在故障下运行", "text": "阶段 3：让系统在故障下运行 实践首页 · 上一阶段 · 下一阶段 目标与前置 入口：阶段 2 正确性通过，能够观测单进程与数据库故障。主学 M08/M09/M10，权限与审计沿用 M12。新增 Redis、RabbitMQ、Outbox、CRM 成交读模型及跟进任务，验证 INV-08/09/10。 事件与数据约定 权威支付与退款事实属于交易/支付模块；CRM 统计与跟进任务可重建。订单创建不是成交事件，只有订单正常确认支付才发 OrderPaid，对这笔成交确认退款才发 OrderRefunded。取消后晚到等异常收款及其退回仍留在资金对账台账，不产生这两类成交事件，不计入 CRM 成交额或生成跟进任务。 业务更新与 outbox 插入同一数据库事务。事件包含 eventId、eventType、schemaVersion、aggregateId、aggregateVersion、customerId、金额/币种、发生时间、correlationId；退款含原支付标识。事件内容是必要业务快照，不含客户联系方式等多余信息。 轮询投递器确认 broker 接受后标记已发送；标记失败允许重复投递。消费者把事件去重登记、事实落表、统计更新和跟进任务写入同一本地事务，提交后再确认消息。 以支付/退款事实表为可重建依据，按 eventId 与业务流水双重约束防止同一事实被不同事件 ID 重复表达。退款先到时暂存，等待支付事实后重算；超出约定等待窗口进入对账，不盲目形成负净额。 一次 OrderPaid 生成一个跟进任务，不发送真实邮件/短信。重放不重复生成；OrderRefunded 调整净成交额，不删除历史支付事实。 Redis 仅缓存客户摘要/读模型，业务写入以数据库为准。缓存中断时实行有界回源；搜索练习保持与 M08 相同的重建及权限规则。 任务与交付 任务 执行内容 验收 S3-01 缓存 定义缓存键、TTL、允许陈旧窗口；注入热键和断连 不读缓存决定扣库存/支付；有界回源、恢复可重建 S3-02 可靠事件 实现 outbox 轮询、确认、重试与处理状态查询 逐个故障窗口都能恢复；失败有原因、次数和下一处理入口 S3-03 幂等读模型 CRM 消费支付/退款事实，更新统计和跟进任务 重复、乱序、重放与重建结果一致 S3-04 可观测性 日志、指标、追踪串起订单到 CRM；定义 SLI/SLO 成功率、尾延迟、最老 outbox 年龄、队列积压与失败可观察 S3-05 韧性与告警 定义总超时、有限重试、隔离、限流和降级 下游失败不拖垮无关请求；告警含处理指引 S3-06 恢复与复盘 在隔离环境演练故障、备份恢复和发布回退 恢复校验通过，实际 RTO/RPO 与目标有对照；完成复盘 必测故障窗口 注入时点或故障 预期业务行为与恢复证据 业务提交前退出 业务和 outbox 都回滚，无假成交 提交后、发布前退出 outbox 仍可查询，重启后投递 broker 确认后、标记发送前退出 可能重复投递；CRM 业务效果不重复 消费者写入前退出 未提交，消息重新处理 消费者提交后、ack 前退出 重投但统计和任务不重复 退款先于支付到达 记录等待关联事实；最终净额正确，超时触发对账 永久坏消息 有限重试后进入隔离/死信处理，不堵死正常消息；人工修复后可重放 Redis 不可用，数据库容量有限 缓存回源受限，部分非关键查询可拒绝/降级；交易正确性不受损 数据库从备份恢复到较早时点 检查 outbox、去重表与业务事实的一致性，解释可能丢失窗口并对账 教学验收在依赖恢复后设定一个可测量目标：固定 1,000 条事件应在 60 秒内处理完且金额/任务数正确。它是本地练习目标；不足时先报告瓶颈与实测，不伪称达标，也不等同生产 SLO。 阶段出口 每个故障场景都有注入步骤、预期/实际、恢复证据与残余风险。 从权威支付/退款事实重建 CRM 统计，结果与增量处理一致。 完成一次告警触发与处置、一次独立实例恢复、一次失败发布回退。 使用 故障复盘模板 写用户影响、时间线和可验证改进。 变式复测：将成交事件改为客户归属变更，重新讨论权限缓存、顺序和历史数据访问。", "html": "\u003ch1 id=\"heading-0\">阶段 3：让系统在故障下运行\u003c/h1>\n\u003cp>\u003ca href=\"#doc=practice%2FREADME.md\">实践首页\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-02-correctness.md\">上一阶段\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-04-architecture.md\">下一阶段\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">目标与前置\u003c/h2>\n\u003cp>入口：阶段 2 正确性通过，能够观测单进程与数据库故障。主学 M08/M09/M10，权限与审计沿用 M12。新增 Redis、RabbitMQ、Outbox、CRM 成交读模型及跟进任务，验证 INV-08/09/10。\u003c/p>\n\u003ch2 id=\"heading-2\">事件与数据约定\u003c/h2>\n\u003cul>\u003cli>权威支付与退款事实属于交易/支付模块；CRM 统计与跟进任务可重建。订单创建不是成交事件，只有订单正常确认支付才发 OrderPaid，对这笔成交确认退款才发 OrderRefunded。取消后晚到等异常收款及其退回仍留在资金对账台账，不产生这两类成交事件，不计入 CRM 成交额或生成跟进任务。\u003c/li>\u003cli>业务更新与 outbox 插入同一数据库事务。事件包含 eventId、eventType、schemaVersion、aggregateId、aggregateVersion、customerId、金额/币种、发生时间、correlationId；退款含原支付标识。事件内容是必要业务快照，不含客户联系方式等多余信息。\u003c/li>\u003cli>轮询投递器确认 broker 接受后标记已发送；标记失败允许重复投递。消费者把事件去重登记、事实落表、统计更新和跟进任务写入同一本地事务，提交后再确认消息。\u003c/li>\u003cli>以支付/退款事实表为可重建依据，按 eventId 与业务流水双重约束防止同一事实被不同事件 ID 重复表达。退款先到时暂存，等待支付事实后重算；超出约定等待窗口进入对账，不盲目形成负净额。\u003c/li>\u003cli>一次 OrderPaid 生成一个跟进任务，不发送真实邮件/短信。重放不重复生成；OrderRefunded 调整净成交额，不删除历史支付事实。\u003c/li>\u003cli>Redis 仅缓存客户摘要/读模型，业务写入以数据库为准。缓存中断时实行有界回源；搜索练习保持与 M08 相同的重建及权限规则。\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-3\">任务与交付\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"任务表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">任务\u003c/th>\u003cth scope=\"col\">执行内容\u003c/th>\u003cth scope=\"col\">验收\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S3-01 缓存\u003c/td>\u003ctd>定义缓存键、TTL、允许陈旧窗口；注入热键和断连\u003c/td>\u003ctd>不读缓存决定扣库存/支付；有界回源、恢复可重建\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S3-02 可靠事件\u003c/td>\u003ctd>实现 outbox 轮询、确认、重试与处理状态查询\u003c/td>\u003ctd>逐个故障窗口都能恢复；失败有原因、次数和下一处理入口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S3-03 幂等读模型\u003c/td>\u003ctd>CRM 消费支付/退款事实，更新统计和跟进任务\u003c/td>\u003ctd>重复、乱序、重放与重建结果一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S3-04 可观测性\u003c/td>\u003ctd>日志、指标、追踪串起订单到 CRM；定义 SLI/SLO\u003c/td>\u003ctd>成功率、尾延迟、最老 outbox 年龄、队列积压与失败可观察\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S3-05 韧性与告警\u003c/td>\u003ctd>定义总超时、有限重试、隔离、限流和降级\u003c/td>\u003ctd>下游失败不拖垮无关请求；告警含处理指引\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S3-06 恢复与复盘\u003c/td>\u003ctd>在隔离环境演练故障、备份恢复和发布回退\u003c/td>\u003ctd>恢复校验通过，实际 RTO/RPO 与目标有对照；完成复盘\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">必测故障窗口\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"注入时点或故障表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">注入时点或故障\u003c/th>\u003cth scope=\"col\">预期业务行为与恢复证据\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>业务提交前退出\u003c/td>\u003ctd>业务和 outbox 都回滚，无假成交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>提交后、发布前退出\u003c/td>\u003ctd>outbox 仍可查询，重启后投递\u003c/td>\u003c/tr>\u003ctr>\u003ctd>broker 确认后、标记发送前退出\u003c/td>\u003ctd>可能重复投递；CRM 业务效果不重复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>消费者写入前退出\u003c/td>\u003ctd>未提交，消息重新处理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>消费者提交后、ack 前退出\u003c/td>\u003ctd>重投但统计和任务不重复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>退款先于支付到达\u003c/td>\u003ctd>记录等待关联事实；最终净额正确，超时触发对账\u003c/td>\u003c/tr>\u003ctr>\u003ctd>永久坏消息\u003c/td>\u003ctd>有限重试后进入隔离/死信处理，不堵死正常消息；人工修复后可重放\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Redis 不可用，数据库容量有限\u003c/td>\u003ctd>缓存回源受限，部分非关键查询可拒绝/降级；交易正确性不受损\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据库从备份恢复到较早时点\u003c/td>\u003ctd>检查 outbox、去重表与业务事实的一致性，解释可能丢失窗口并对账\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>教学验收在依赖恢复后设定一个可测量目标：固定 1,000 条事件应在 60 秒内处理完且金额/任务数正确。它是本地练习目标；不足时先报告瓶颈与实测，不伪称达标，也不等同生产 SLO。\u003c/p>\n\u003ch2 id=\"heading-5\">阶段出口\u003c/h2>\n\u003cul class=\"checklist\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-03-resilience.md::d9a7a25e1fb5\">\u003cspan>每个故障场景都有注入步骤、预期/实际、恢复证据与残余风险。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-03-resilience.md::27a5d7cf7e2a\">\u003cspan>从权威支付/退款事实重建 CRM 统计，结果与增量处理一致。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-03-resilience.md::686f759f27ba\">\u003cspan>完成一次告警触发与处置、一次独立实例恢复、一次失败发布回退。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-03-resilience.md::915f6577de17\">\u003cspan>使用 \u003ca href=\"#doc=templates%2Fincident-review.md\">故障复盘模板\u003c/a> 写用户影响、时间线和可验证改进。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"practice/stage-03-resilience.md::d0ec6c22c894\">\u003cspan>变式复测：将成交事件改为客户归属变更，重新讨论权限缓存、顺序和历史数据访问。\u003c/span>\u003c/label>\u003c/li>\u003c/ul>", "toc": [{"id": "heading-0", "title": "阶段 3：让系统在故障下运行", "level": 1}, {"id": "heading-1", "title": "目标与前置", "level": 2}, {"id": "heading-2", "title": "事件与数据约定", "level": 2}, {"id": "heading-3", "title": "任务与交付", "level": 2}, {"id": "heading-4", "title": "必测故障窗口", "level": 2}, {"id": "heading-5", "title": "阶段出口", "level": 2}], "units": [], "checks": [{"id": "practice/stage-03-resilience.md::d9a7a25e1fb5", "text": "每个故障场景都有注入步骤、预期/实际、恢复证据与残余风险。"}, {"id": "practice/stage-03-resilience.md::27a5d7cf7e2a", "text": "从权威支付/退款事实重建 CRM 统计，结果与增量处理一致。"}, {"id": "practice/stage-03-resilience.md::
