003c/li>\u003cli>在 \u003ca href=\"#doc=PROGRESS.md\">个人进度\u003c/a> 登记证据，确定一个主模块和至多一个基础补充。\u003c/li>\u003cli>按 \u003ca href=\"#doc=practice%2Fstage-01-business.md\">阶段 1：业务闭环\u003c/a> 开始实践；每个问题回到对应模块学习。\u003c/li>\u003c/ol>\n\u003cp>第一次学习可以只做诊断任务 D0-1：实现一个不可变的报价金额模型，解释舍入和状态变化。暂时不会的部分如实记录，不必先读完整套资料。\u003c/p>\n\u003ch2 id=\"heading-3\">内容导航\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"内容表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">内容\u003c/th>\u003cth scope=\"col\">入口\u003c/th>\u003cth scope=\"col\">用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>总纲与知识地图\u003c/td>\u003ctd>\u003ca href=\"#doc=ROADMAP.md\">ROADMAP\u003c/a>\u003c/td>\u003ctd>决定学什么、先学什么、学到什么程度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>学习方法\u003c/td>\u003ctd>\u003ca href=\"#doc=METHOD.md\">METHOD\u003c/a>\u003c/td>\u003ctd>实验、源码阅读、自测、复测与 AI 使用方法\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12 份模块指南\u003c/td>\u003ctd>\u003ca href=\"#doc=ROADMAP.md&amp;section=modules\">模块目录\u003c/a>\u003c/td>\u003ctd>必修、选修、前置、练习、资料和验收\u003c/td>\u003c/tr>\u003ctr>\u003ctd>实践手册\u003c/td>\u003ctd>\u003ca href=\"#doc=practice%2FREADME.md\">CRM + 交易系统\u003c/a>\u003c/td>\u003ctd>统一业务规则和阶段 0–5 的任务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>个人进度\u003c/td>\u003ctd>\u003ca href=\"#doc=PROGRESS.md\">PROGRESS\u003c/a>\u003c/td>\u003ctd>能力矩阵、当前任务与复测记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>官方资料\u003c/td>\u003ctd>\u003ca href=\"#doc=resources%2FREFERENCES.md\">REFERENCES\u003c/a>\u003c/td>\u003ctd>一手资料、阅读章节和版本边界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>记录模板\u003c/td>\u003ctd>\u003ca href=\"#doc=templates%2Fevidence.md\">学习证据\u003c/a> · \u003ca href=\"#doc=templates%2Farchitecture-decision.md\">架构决策\u003c/a> · \u003ca href=\"#doc=templates%2Fincident-review.md\">故障复盘\u003c/a>\u003c/td>\u003ctd>保存可复核的学习产出\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">当前交付状态\u003c/h2>\n\u003cp>第一版包含完整总纲、12 份模块指南、6 份阶段手册及记录模板。阶段 0 和阶段 1 已细化为可执行任务；阶段 2–5 提供实践规格与通过标准。模块指南是学习任务与阅读路线，后续教材正文随学习逐节展开。\u003c/p>\n\u003cp>本仓库目前交付学习文档与离线交互 HTML；尚未创建业务服务或真实组件实验结果。页面中的演示是教学模型，个人能力默认“待诊断”，资料齐备不代表学习已完成。\u003c/p>\n\u003cp>练习以 Java 21、MySQL 8.4 为基线。Spring Boot 与配套依赖在实践工程建立时锁定稳定版本，核对方式见 \u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=baseline\">技术基线\u003c/a>。使用虚构客户数据和模拟支付。\u003c/p>", "toc": [{"id": "heading-0", "title": "Java 高级工程师 → 架构师学习体系", "level": 1}, {"id": "heading-1", "title": "交互式 HTML", "level": 2}, {"id": "heading-2", "title": "从这里开始", "level": 2}, {"id": "heading-3", "title": "内容导航", "level": 2}, {"id": "heading-4", "title": "当前交付状态", "level": 2}], "units": [], "checks": []}, {"path": "ROADMAP.md", "title": "学习总纲：从独立开发到架构决策", "text": "学习总纲：从独立开发到架构决策 目标与边界 阶段目标 可以独立承担的责任 需要留下的证据 高级工程师 复杂模块的正确性、质量、性能、稳定性和交付 自动化测试、诊断记录、压测对比、部署及恢复演练 架构师 业务边界、系统取舍、迁移演进、成本、安全和团队落地 备选方案、架构决策、容量估算、兼容与回滚设计、实际反馈 不按框架数量衡量成长。每项技术都要回答：解决什么问题、依赖什么条件、失败时会怎样、代价是什么。架构能力需要真实团队和业务反馈；学习项目提供可迁移的方法，不承诺仅凭课程获得岗位能力。 知识地图与模块目录 编号是知识归档位置，不是要求一次从 M01 读到 M12。模块里的单元编号用于任务与证据引用。 模块 范围 前置与建议阶段 目标深度 M01 Java 语言与核心库 类型、对象、泛型、集合、异常、函数式、反射、现代 Java、金额时间 已会基本语法；阶段 1，机制部分在阶段 2 回访 能诊断 M02 计算机基础与算法 数据结构、复杂度、OS、网络、Linux M01 基础；全程按问题补充 能解释与实现，关键链路能诊断 M03 并发编程 JMM、锁、CAS、AQS、线程池、异步、虚拟线程、背压 M01；M02 的线程与内存；阶段 2 能诊断 M04 JVM 与性能诊断 字节码、类加载、内存、GC、JIT、JFR、剖析 M01、M02，线程故障需 M03；阶段 2 能诊断 M05 数据库与数据访问 SQL、建模、索引、事务、恢复、JDBC、MyBatis、迁移 Java 基础；阶段 1 学正确性，阶段 2 深入，阶段 3 恢复 能诊断 M06 Spring 与 Web 工程 容器、代理、装配、MVC、事务、接口、安全接入 M01、M05 的 JDBC 与事务；阶段 1–2 能诊断 M07 软件设计与工程质量 设计、重构、Git、构建、测试、评审、CI M01；阶段 1 起持续实践 能诊断与权衡 M08 缓存、消息与搜索 Redis、RabbitMQ、可靠投递、索引与搜索同步 M05、M06；阶段 3 Redis/MQ 能诊断，搜索能实现 M09 分布式系统 部分失败、一致性、共识、Outbox、Saga、韧性 M03、M05；与 M08 在阶段 3 联动 能诊断与权衡 M10 部署与可靠性 容器、交付、观测、SLO、容量、容灾、K8s M02、M06；阶段 1 建基线，阶段 3 深入 能诊断与权衡 M11 业务建模与架构 领域语言、DDD、边界、架构风格、ADR、迁移与成本 阶段 1 先学建模；完整设计需阶段 2–3 证据 能权衡 M12 安全与技术协作 权限、租户、审计、隐私、攻击防护、供应链、团队协作 阶段 1 起；与 M06、M07、M11 联动 能实现、诊断与权衡 核心依赖：Java 对象与资源管理 → JDBC/SQL/事务 → Spring 业务闭环 → 并发与 JVM 诊断 → 缓存/消息/分布式失败处理 → 有证据的架构取舍。 三条贯穿线：计算机基础解释机制；测试和观测验证结果；业务建模与安全约束设计。它们从第一阶段出现，后续加深，不需要先读完整门理论课。 阶段路线与出口 阶段 0 是诊断入口，之后是五个成长阶段。进入下一阶段前必须完成当前阶段出口；不足处只补对应单元。 阶段 主问题与学习重点 实践产出 通过条件与复测 0 诊断 我会做什么，哪些靠记忆或教程？ 四项诊断记录、能力矩阵、第一批任务 不要求全部答对；结果可复核，弱项映射到单元 1 业务闭环 如何把 CRM 到订单做正确？M01/M05/M06/M07，搭配 M11/M12 模块化单体设计与客户→商机→报价→订单闭环 不变量、权限、失败回滚通过；空环境可复现；换一种报价场景复测 2 并发与排障 并发和负载改变后还能正确吗？M03/M04/M05 库存与支付设计、并发实验、诊断及优化报告 不超卖、不重复记账；瓶颈有证据；换负载分布复测 3 故障下运行 组件失败和事件重放时怎样恢复？M08/M09/M10 可靠事件链、CRM 统计、告警、恢复演练 事件不永久遗漏、重复不重复生效、状态最终收敛；换故障时点复测 4 架构决策 哪种演进适合当前约束？M11/M12 备选方案、ADR、容量与成本估算、最小迁移实验 数据归属、兼容、回滚可验证；约束变化后重新判断 5 真实迁移 团队和业务能否获得实际收益？ 脱敏基线、评审与实施记录、结果复盘 他人可复核收益与限制；无真实机会时标记“模拟完成，待真实验证” 深度与取舍 Java、并发、数据库、Spring、测试、排障、业务建模为核心必修；关键项达到“能诊断”，架构达到“能权衡”。 Redis 与 RabbitMQ 是中间件主实现。Kafka、其他缓存和数据库以机制比较为主，不重复搭建多套入门项目。 算法训练覆盖复杂度、线性结构、树、图、查找、排序及常见求解方法；用任务正确性、边界和复杂度检验，不以刷题数量验收。 共识基础必修；手写完整 Raft、存储引擎、深度编译器与 GC、Service Mesh、Native Image 属于选修。 AI 辅助开发贯穿，代码与结论由学习者负责复述、验证；RAG/Agent 为完成核心阶段后的选修。 个人推进方式 掌握等级为 L1 能解释、L2 能实现、L3 能诊断、L4 能权衡。诊断状态与掌握等级分开记录，详见 学习方法 。没有证据的项保留“待诊断”，不预设已经掌握。 每轮先在 进度表 选择一个主单元和至多一个基础补充，产出实验或设计证据，再进行脱离资料复述和变式复测。掌握可以通过既有项目证据证明，无需重复完成同类练习。 教材后续展开约定 每节正文使用“开篇问题 → 概念与机制 → 条件与反例 → 最小实验或决策案例 → 项目映射 → 自测与验收”的结构；明确单元编号与一手出处。涉及实现行为必须标明版本；不要把单次实验未出现异常写成不可能发生异常。 本版的任务是建立学习路线与实践规格。实际学习进度、服务代码和实验报告逐步产生；对外 API 的具体实现尚未创建。", "html": "\u003ch1 id=\"heading-0\">学习总纲：从独立开发到架构决策\u003c/h1>\n\u003ch2 id=\"heading-1\">目标与边界\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"阶段目标表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">阶段目标\u003c/th>\u003cth scope=\"col\">可以独立承担的责任\u003c/th>\u003cth scope=\"col\">需要留下的证据\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>高级工程师\u003c/td>\u003ctd>复杂模块的正确性、质量、性能、稳定性和交付\u003c/td>\u003ctd>自动化测试、诊断记录、压测对比、部署及恢复演练\u003c/td>\u003c/tr>\u003ctr>\u003ctd>架构师\u003c/td>\u003ctd>业务边界、系统取舍、迁移演进、成本、安全和团队落地\u003c/td>\u003ctd>备选方案、架构决策、容量估算、兼容与回滚设计、实际反馈\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>不按框架数量衡量成长。每项技术都要回答：解决什么问题、依赖什么条件、失败时会怎样、代价是什么。架构能力需要真实团队和业务反馈；学习项目提供可迁移的方法，不承诺仅凭课程获得岗位能力。\u003c/p>\n\u003ca id=\"modules\">\u003c/a>\n\u003ch2 id=\"heading-2\">知识地图与模块目录\u003c/h2>\n\u003cp>编号是知识归档位置，不是要求一次从 M01 读到 M12。模块里的单元编号用于任务与证据引用。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"模块表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">模块\u003c/th>\u003cth scope=\"col\">范围\u003c/th>\u003cth scope=\"col\">前置与建议阶段\u003c/th>\u003cth scope=\"col\">目标深度\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm01-java.md\">M01 Java 语言与核心库\u003c/a>\u003c/td>\u003ctd>类型、对象、泛型、集合、异常、函数式、反射、现代 Java、金额时间\u003c/td>\u003ctd>已会基本语法；阶段 1，机制部分在阶段 2 回访\u003c/td>\u003ctd>能诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm02-foundations.md\">M02 计算机基础与算法\u003c/a>\u003c/td>\u003ctd>数据结构、复杂度、OS、网络、Linux\u003c/td>\u003ctd>M01 基础；全程按问题补充\u003c/td>\u003ctd>能解释与实现，关键链路能诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm03-concurrency.md\">M03 并发编程\u003c/a>\u003c/td>\u003ctd>JMM、锁、CAS、AQS、线程池、异步、虚拟线程、背压\u003c/td>\u003ctd>M01；M02 的线程与内存；阶段 2\u003c/td>\u003ctd>能诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm04-jvm.md\">M04 JVM 与性能诊断\u003c/a>\u003c/td>\u003ctd>字节码、类加载、内存、GC、JIT、JFR、剖析\u003c/td>\u003ctd>M01、M02，线程故障需 M03；阶段 2\u003c/td>\u003ctd>能诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm05-data.md\">M05 数据库与数据访问\u003c/a>\u003c/td>\u003ctd>SQL、建模、索引、事务、恢复、JDBC、MyBatis、迁移\u003c/td>\u003ctd>Java 基础；阶段 1 学正确性，阶段 2 深入，阶段 3 恢复\u003c/td>\u003ctd>能诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm06-spring.md\">M06 Spring 与 Web 工程\u003c/a>\u003c/td>\u003ctd>容器、代理、装配、MVC、事务、接口、安全接入\u003c/td>\u003ctd>M01、M05 的 JDBC 与事务；阶段 1–2\u003c/td>\u003ctd>能诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm07-engineering.md\">M07 软件设计与工程质量\u003c/a>\u003c/td>\u003ctd>设计、重构、Git、构建、测试、评审、CI\u003c/td>\u003ctd>M01；阶段 1 起持续实践\u003c/td>\u003ctd>能诊断与权衡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm08-middleware.md\">M08 缓存、消息与搜索\u003c/a>\u003c/td>\u003ctd>Redis、RabbitMQ、可靠投递、索引与搜索同步\u003c/td>\u003ctd>M05、M06；阶段 3\u003c/td>\u003ctd>Redis/MQ 能诊断，搜索能实现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm09-distributed.md\">M09 分布式系统\u003c/a>\u003c/td>\u003ctd>部分失败、一致性、共识、Outbox、Saga、韧性\u003c/td>\u003ctd>M03、M05；与 M08 在阶段 3 联动\u003c/td>\u003ctd>能诊断与权衡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm10-reliability.md\">M10 部署与可靠性\u003c/a>\u003c/td>\u003ctd>容器、交付、观测、SLO、容量、容灾、K8s\u003c/td>\u003ctd>M02、M06；阶段 1 建基线，阶段 3 深入\u003c/td>\u003ctd>能诊断与权衡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm11-architecture.md\">M11 业务建模与架构\u003c/a>\u003c/td>\u003ctd>领域语言、DDD、边界、架构风格、ADR、迁移与成本\u003c/td>\u003ctd>阶段 1 先学建模；完整设计需阶段 2–3 证据\u003c/td>\u003ctd>能权衡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=modules%2Fm12-security.md\">M12 安全与技术协作\u003c/a>\u003c/td>\u003ctd>权限、租户、审计、隐私、攻击防护、供应链、团队协作\u003c/td>\u003ctd>阶段 1 起；与 M06、M07、M11 联动\u003c/td>\u003ctd>能实现、诊断与权衡\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>核心依赖：Java 对象与资源管理 → JDBC/SQL/事务 → Spring 业务闭环 → 并发与 JVM 诊断 → 缓存/消息/分布式失败处理 → 有证据的架构取舍。\u003c/p>\n\u003cp>三条贯穿线：计算机基础解释机制；测试和观测验证结果；业务建模与安全约束设计。它们从第一阶段出现，后续加深，不需要先读完整门理论课。\u003c/p>\n\u003ch2 id=\"heading-3\">阶段路线与出口\u003c/h2>\n\u003cp>阶段 0 是诊断入口，之后是五个成长阶段。进入下一阶段前必须完成当前阶段出口；不足处只补对应单元。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"阶段表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">阶段\u003c/th>\u003cth scope=\"col\">主问题与学习重点\u003c/th>\u003cth scope=\"col\">实践产出\u003c/th>\u003cth scope=\"col\">通过条件与复测\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-00-diagnosis.md\">0 诊断\u003c/a>\u003c/td>\u003ctd>我会做什么，哪些靠记忆或教程？\u003c/td>\u003ctd>四项诊断记录、能力矩阵、第一批任务\u003c/td>\u003ctd>不要求全部答对；结果可复核，弱项映射到单元\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-01-business.md\">1 业务闭环\u003c/a>\u003c/td>\u003ctd>如何把 CRM 到订单做正确？M01/M05/M06/M07，搭配 M11/M12\u003c/td>\u003ctd>模块化单体设计与客户→商机→报价→订单闭环\u003c/td>\u003ctd>不变量、权限、失败回滚通过；空环境可复现；换一种报价场景复测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-02-correctness.md\">2 并发与排障\u003c/a>\u003c/td>\u003ctd>并发和负载改变后还能正确吗？M03/M04/M05\u003c/td>\u003ctd>库存与支付设计、并发实验、诊断及优化报告\u003c/td>\u003ctd>不超卖、不重复记账；瓶颈有证据；换负载分布复测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-03-resilience.md\">3 故障下运行\u003c/a>\u003c/td>\u003ctd>组件失败和事件重放时怎样恢复？M08/M09/M10\u003c/td>\u003ctd>可靠事件链、CRM 统计、告警、恢复演练\u003c/td>\u003ctd>事件不永久遗漏、重复不重复生效、状态最终收敛；换故障时点复测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-04-architecture.md\">4 架构决策\u003c/a>\u003c/td>\u003ctd>哪种演进适合当前约束？M11/M12\u003c/td>\u003ctd>备选方案、ADR、容量与成本估算、最小迁移实验\u003c/td>\u003ctd>数据归属、兼容、回滚可验证；约束变化后重新判断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#doc=practice%2Fstage-05-transfer.md\">5 真实迁移\u003c/a>\u003c/td>\u003ctd>团队和业务能否获得实际收益？\u003c/td>\u003ctd>脱敏基线、评审与实施记录、结果复盘\u003c/td>\u003ctd>他人可复核收益与限制；无真实机会时标记“模拟完成，待真实验证”\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">深度与取舍\u003c/h2>\n\u003cul>\u003cli>Java、并发、数据库、Spring、测试、排障、业务建模为核心必修；关键项达到“能诊断”，架构达到“能权衡”。\u003c/li>\u003cli>Redis 与 RabbitMQ 是中间件主实现。Kafka、其他缓存和数据库以机制比较为主，不重复搭建多套入门项目。\u003c/li>\u003cli>算法训练覆盖复杂度、线性结构、树、图、查找、排序及常见求解方法；用任务正确性、边界和复杂度检验，不以刷题数量验收。\u003c/li>\u003cli>共识基础必修；手写完整 Raft、存储引擎、深度编译器与 GC、Service Mesh、Native Image 属于选修。\u003c/li>\u003cli>AI 辅助开发贯穿，代码与结论由学习者负责复述、验证；RAG/Agent 为完成核心阶段后的选修。\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-5\">个人推进方式\u003c/h2>\n\u003cp>掌握等级为 L1 能解释、L2 能实现、L3 能诊断、L4 能权衡。诊断状态与掌握等级分开记录，详见 \u003ca href=\"#doc=METHOD.md\">学习方法\u003c/a>。没有证据的项保留“待诊断”，不预设已经掌握。\u003c/p>\n\u003cp>每轮先在 \u003ca href=\"#doc=PROGRESS.md\">进度表\u003c/a> 选择一个主单元和至多一个基础补充，产出实验或设计证据，再进行脱离资料复述和变式复测。掌握可以通过既有项目证据证明，无需重复完成同类练习。\u003c/p>\n\u003ch2 id=\"heading-6\">教材后续展开约定\u003c/h2>\n\u003cp>每节正文使用“开篇问题 → 概念与机制 → 条件与反例 → 最小实验或决策案例 → 项目映射 → 自测与验收”的结构；明确单元编号与一手出处。涉及实现行为必须标明版本；不要把单次实验未出现异常写成不可能发生异常。\u003c/p>\n\u003cp>本版的任务是建立学习路线与实践规格。实际学习进度、服务代码和实验报告逐步产生；对外 API 的具体实现尚未创建。\u003c/p>", "toc": [{"id": "heading-0", "title": "学习总纲：从独立开发到架构决策", "level": 1}, {"id": "heading-1", "title": "目标与边界", "level": 2}, {"id": "heading-2", "title": "知识地图与模块目录", "level": 2}, {"id": "heading-3", "title": "阶段路线与出口", "level": 2}, {"id": "heading-4", "title": "深度与取舍", "level": 2}, {"id": "heading-5", "title": "个人推进方式", "level": 2}, {"id": "heading-6", "title": "教材后续展开约定", "level": 2}], "units": [], "checks": []}, {"path": "METHOD.md", "title": "如何学习与留下证据", "text": "如何学习与留下证据 返回总纲 · 记录进度 一轮学习的六个步骤 明确问题 ：写出业务现象、输入、约束，以及你想解释的机制。 先做预测 ：列假设、期望结果和反例；区分规范保证与实现观察。 定点阅读 ：从模块指定主资料进入，只读当前单元所需章节。中文讲解帮助入门，关键结论回查一手来源。 最小验证 ：改变一个主要变量，留下命令、版本、数据规模和结果；原理实验尽量小，综合实验再回项目。 业务迁移 ：把机制落实到 CRM/交易系统，写清对正确性、性能、复杂度和维护成本的影响。 闭卷复述与变式复测 ：不看资料解释原理，修改一个约束后重新设计；将证据链接写入进度表。 使用 学习证据模板 。示例：“观察到一次数据库死锁”是现象；“根据等待关系解释循环，并验证统一加锁顺序的效果”才是掌握证据。 方法按内容选择 内容 方法 每轮最少产出 SQL、算法、调试工具 独立练习 → 边界测试 → 复写 正常、空值/极值、失败输入；复杂度或执行计划解释 并发、事务、GC、索引 假设 → 对照实验 → 观测 → 结论 可重复步骤、原始结果、影响因素、适用条件 Spring、集合、线程池源码 画调用链 → 断点跟踪 → 查关键分支 一个具体问题的调用链和固定版本/提交来源 DDD、架构与选型 约束 → 两个以上候选 → 对比 → 验证 ADR ，含不采用方案的理由 部署、安全和可靠性 建基线 → 注入故障 → 检测恢复 → 复盘 告警与恢复证据、 故障复盘 掌握等级与状态 等级 判定标准 L1 能解释 用自己的话解释因果与边界，回答一个反例；能指出一手资料依据 L2 能实现 根据需求独立完成，有正常/边界/失败验证，能解释每项关键设计 L3 能诊断 面对注入的新问题，依靠观测定位根因，修复后复测并排除替代解释 L4 能权衡 比较至少两种可行方案，量化关键成本，明确决策条件、回滚方式与改变结论的信号 等级逐级累积；不靠平均分掩盖关键短板。每个单元的当前等级不超过实际证据所支持的等级。 诊断任务使用三种结论：“能独立完成”“能解释但不会做”“尚未理解”；执行状态使用“未开始 / 学习中 / 待复测 / 已通过”。查文档完成与独立完成分别记录。概念正确但实验失败时不能记作 L2。 防止假进步 不以阅读页数、收藏链接、抄写笔记作为通过证据；笔记至少回答一个自己的问题。 不为每个概念造轮子。只在能揭示机制时实现最小模型，并明确它不具备生产实现的哪些性质。 基准测试记录预热、样本数、数据量、并发量、机器和容器限制、版本、P50/P95/P99、吞吐、错误率及资源消耗；同条件重复至少 3 次，报告波动。 并发实验优先使用屏障/锁存器构造时序，避免只靠 sleep；复现不到竞态不代表安全。 有副作用的 SQL 分析与故障注入只使用练习数据。EXPLAIN ANALYZE 会执行查询，先理解语句效果。 恢复必须在独立练习实例验证；“生成了备份文件”不等于恢复成功。 复习与调度 一次只推进一个主模块，至多配一个必要前置。长时间中断后先运行上次的验收场景，能够复述后再继续。 每轮结束进行一次闭卷复述；下一次学习先抽测上一轮；每阶段出口换一个业务场景复测旧知识。连续两次失败时缩小问题，回补前置单元，再做最小实验，不同时开更多资料。 复测例子：报价的不可变快照 → 合同版本；库存扣减 → 优惠券名额；订单成交事件 → 客户归属变更；服务超时 → 下游提交成功但响应丢失。 使用 AI 先写自己的预测与实现，再让 AI 找边界、生成反例、辅助解释源码。保留“我原来的判断 → AI 建议 → 我的验证”记录。只有能脱离回答复述、复写和处理变式，才能记为掌握。 实际工作资料先脱敏。练习只使用虚构客户和模拟支付。RAG、工具调用与 Agent 项目作为选修，应额外验证权限边界、评估集、失败行为和调用成本。", "html": "\u003ch1 id=\"heading-0\">如何学习与留下证据\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">返回总纲\u003c/a> · \u003ca href=\"#doc=PROGRESS.md\">记录进度\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">一轮学习的六个步骤\u003c/h2>\n\u003col>\u003cli>\u003cstrong>明确问题\u003c/strong>：写出业务现象、输入、约束，以及你想解释的机制。\u003c/li>\u003cli>\u003cstrong>先做预测\u003c/strong>：列假设、期望结果和反例；区分规范保证与实现观察。\u003c/li>\u003cli>\u003cstrong>定点阅读\u003c/strong>：从模块指定主资料进入，只读当前单元所需章节。中文讲解帮助入门，关键结论回查一手来源。\u003c/li>\u003cli>\u003cstrong>最小验证\u003c/strong>：改变一个主要变量，留下命令、版本、数据规模和结果；原理实验尽量小，综合实验再回项目。\u003c/li>\u003cli>\u003cstrong>业务迁移\u003c/strong>：把机制落实到 CRM/交易系统，写清对正确性、性能、复杂度和维护成本的影响。\u003c/li>\u003cli>\u003cstrong>闭卷复述与变式复测\u003c/strong>：不看资料解释原理，修改一个约束后重新设计；将证据链接写入进度表。\u003c/li>\u003c/ol>\n\u003cp>使用 \u003ca href=\"#doc=templates%2Fevidence.md\">学习证据模板\u003c/a>。示例：“观察到一次数据库死锁”是现象；“根据等待关系解释循环，并验证统一加锁顺序的效果”才是掌握证据。\u003c/p>\n\u003ch2 id=\"heading-2\">方法按内容选择\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"内容表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">内容\u003c/th>\u003cth scope=\"col\">方法\u003c/th>\u003cth scope=\"col\">每轮最少产出\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SQL、算法、调试工具\u003c/td>\u003ctd>独立练习 → 边界测试 → 复写\u003c/td>\u003ctd>正常、空值/极值、失败输入；复杂度或执行计划解释\u003c/td>\u003c/tr>\u003ctr>\u003ctd>并发、事务、GC、索引\u003c/td>\u003ctd>假设 → 对照实验 → 观测 → 结论\u003c/td>\u003ctd>可重复步骤、原始结果、影响因素、适用条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spring、集合、线程池源码\u003c/td>\u003ctd>画调用链 → 断点跟踪 → 查关键分支\u003c/td>\u003ctd>一个具体问题的调用链和固定版本/提交来源\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DDD、架构与选型\u003c/td>\u003ctd>约束 → 两个以上候选 → 对比 → 验证\u003c/td>\u003ctd>\u003ca href=\"#doc=templates%2Farchitecture-decision.md\">ADR\u003c/a>，含不采用方案的理由\u003c/td>\u003c/tr>\u003ctr>\u003ctd>部署、安全和可靠性\u003c/td>\u003ctd>建基线 → 注入故障 → 检测恢复 → 复盘\u003c/td>\u003ctd>告警与恢复证据、\u003ca href=\"#doc=templates%2Fincident-review.md\">故障复盘\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">掌握等级与状态\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"等级表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">等级\u003c/th>\u003cth scope=\"col\">判定标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>L1 能解释\u003c/td>\u003ctd>用自己的话解释因果与边界，回答一个反例；能指出一手资料依据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L2 能实现\u003c/td>\u003ctd>根据需求独立完成，有正常/边界/失败验证，能解释每项关键设计\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L3 能诊断\u003c/td>\u003ctd>面对注入的新问题，依靠观测定位根因，修复后复测并排除替代解释\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L4 能权衡\u003c/td>\u003ctd>比较至少两种可行方案，量化关键成本，明确决策条件、回滚方式与改变结论的信号\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>等级逐级累积；不靠平均分掩盖关键短板。每个单元的当前等级不超过实际证据所支持的等级。\u003c/p>\n\u003cp>诊断任务使用三种结论：“能独立完成”“能解释但不会做”“尚未理解”；执行状态使用“未开始 / 学习中 / 待复测 / 已通过”。查文档完成与独立完成分别记录。概念正确但实验失败时不能记作 L2。\u003c/p>\n\u003ch2 id=\"heading-4\">防止假进步\u003c/h2>\n\u003cul>\u003cli>不以阅读页数、收藏链接、抄写笔记作为通过证据；笔记至少回答一个自己的问题。\u003c/li>\u003cli>不为每个概念造轮子。只在能揭示机制时实现最小模型，并明确它不具备生产实现的哪些性质。\u003c/li>\u003cli>基准测试记录预热、样本数、数据量、并发量、机器和容器限制、版本、P50/P95/P99、吞吐、错误率及资源消耗；同条件重复至少 3 次，报告波动。\u003c/li>\u003cli>并发实验优先使用屏障/锁存器构造时序，避免只靠 sleep；复现不到竞态不代表安全。\u003c/li>\u003cli>有副作用的 SQL 分析与故障注入只使用练习数据。EXPLAIN ANALYZE 会执行查询，先理解语句效果。\u003c/li>\u003cli>恢复必须在独立练习实例验证；“生成了备份文件”不等于恢复成功。\u003c/li>\u003c/ul>\n\u003ch2 id=\"heading-5\">复习与调度\u003c/h2>\n\u003cp>一次只推进一个主模块，至多配一个必要前置。长时间中断后先运行上次的验收场景，能够复述后再继续。\u003c/p>\n\u003cp>每轮结束进行一次闭卷复述；下一次学习先抽测上一轮；每阶段出口换一个业务场景复测旧知识。连续两次失败时缩小问题，回补前置单元，再做最小实验，不同时开更多资料。\u003c/p>\n\u003cp>复测例子：报价的不可变快照 → 合同版本；库存扣减 → 优惠券名额；订单成交事件 → 客户归属变更；服务超时 → 下游提交成功但响应丢失。\u003c/p>\n\u003ch2 id=\"heading-6\">使用 AI\u003c/h2>\n\u003cp>先写自己的预测与实现，再让 AI 找边界、生成反例、辅助解释源码。保留“我原来的判断 → AI 建议 → 我的验证”记录。只有能脱离回答复述、复写和处理变式，才能记为掌握。\u003c/p>\n\u003cp>实际工作资料先脱敏。练习只使用虚构客户和模拟支付。RAG、工具调用与 Agent 项目作为选修，应额外验证权限边界、评估集、失败行为和调用成本。\u003c/p>", "toc": [{"id": "heading-0", "title": "如何学习与留下证据", "level": 1}, {"id": "heading-1", "title": "一轮学习的六个步骤", "level": 2}, {"id": "heading-2", "title": "方法按内容选择", "level": 2}, {"id": "heading-3", "title": "掌握等级与状态", "level": 2}, {"id": "heading-4", "title": "防止假进步", "level": 2}, {"id": "heading-5", "title": "复习与调度", "level": 2}, {"id": "heading-6", "title": "使用 AI", "level": 2}], "units": [], "checks": []}, {"path": "PROGRESS.md", "title": "个人进度与能力矩阵", "text": "个人进度与能力矩阵 资料版本：第一版。所有学习项初始为待诊断，本文不预填个人能力结论。 总纲 · 方法与等级 · 从阶段 0 开始 当前学习卡 项目 当前记录 当前阶段 阶段 0，未开始 下一步 D0-1：报价金额与状态建模 主单元 诊断后选择 基础补充（最多一个） 诊断后选择 本轮问题与通过条件 按所选任务填写 证据位置与复测时间 尚无证据 模块能力矩阵 模块汇总只写已经验收的单元；不能用某一个单元的高等级代表整个模块。 模块 目标 当前能力 已验收单元与证据 下一弱项 M01 Java L3 待诊断 无 待诊断 M02 基础与算法 L2，关键链路 L3 待诊断 无 待诊断 M03 并发 L3 待诊断 无 待诊断 M04 JVM L3 待诊断 无 待诊断 M05 数据库 L3 待诊断 无 待诊断 M06 Spring L3 待诊断 无 待诊断 M07 工程质量 L3/L4 待诊断 无 待诊断 M08 中间件 Redis/MQ L3，搜索 L2 待诊断 无 待诊断 M09 分布式 L3/L4 待诊断 无 待诊断 M10 可靠性 L3/L4 待诊断 无 待诊断 M11 架构 L4 待诊断 无 待诊断 M12 安全协作 L2/L3/L4，见单元 待诊断 无 待诊断 诊断记录 任务 结论（三选一，见方法） 哪一步需要帮助 证据 补课与复测 D0-1 金额与状态 待诊断 待记录 无 待确定 D0-2 数据与查询 待诊断 待记录 无 待确定 D0-3 事务/并发 待诊断 待记录 无 待确定 D0-4 接口测试与定位 待诊断 待记录 无 待确定 单元验收记录 每次追加一行，保留失败和复测记录。证据可放在后续创建的 evidence/ 中；文件存在后再添加可点击链接。 日期 单元/任务 ID 执行状态 等级 正常/边界/失败证据 变式复测结果 下一步 — 尚未开始 未开始 — 无 未进行 完成 D0-1 阶段出口 阶段 0：诊断记录完整，弱项与任务已确定。 阶段 1：业务规则、权限、回滚、测试与空环境初始化通过。 阶段 2：并发不变量通过，诊断与性能对比可复现。 阶段 3：故障、重放、告警、备份恢复通过。 阶段 4：设计经过比较，迁移与回滚经过验证。 阶段 5：真实工作反馈可复核；模拟练习不能勾选真实验证。", "html": "\u003ch1 id=\"heading-0\">个人进度与能力矩阵\u003c/h1>\n\u003cp>资料版本：第一版。所有学习项初始为待诊断，本文不预填个人能力结论。\u003c/p>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=METHOD.md\">方法与等级\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-00-diagnosis.md\">从阶段 0 开始\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">当前学习卡\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"项目表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">项目\u003c/th>\u003cth scope=\"col\">当前记录\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>当前阶段\u003c/td>\u003ctd>阶段 0，未开始\u003c/td>\u003c/tr>\u003ctr>\u003ctd>下一步\u003c/td>\u003ctd>D0-1：报价金额与状态建模\u003c/td>\u003c/tr>\u003ctr>\u003ctd>主单元\u003c/td>\u003ctd>诊断后选择\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基础补充（最多一个）\u003c/td>\u003ctd>诊断后选择\u003c/td>\u003c/tr>\u003ctr>\u003ctd>本轮问题与通过条件\u003c/td>\u003ctd>按所选任务填写\u003c/td>\u003c/tr>\u003ctr>\u003ctd>证据位置与复测时间\u003c/td>\u003ctd>尚无证据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-2\">模块能力矩阵\u003c/h2>\n\u003cp>模块汇总只写已经验收的单元；不能用某一个单元的高等级代表整个模块。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"模块表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">模块\u003c/th>\u003cth scope=\"col\">目标\u003c/th>\u003cth scope=\"col\">当前能力\u003c/th>\u003cth scope=\"col\">已验收单元与证据\u003c/th>\u003cth scope=\"col\">下一弱项\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M01 Java\u003c/td>\u003ctd>L3\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02 基础与算法\u003c/td>\u003ctd>L2，关键链路 L3\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M03 并发\u003c/td>\u003ctd>L3\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M04 JVM\u003c/td>\u003ctd>L3\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05 数据库\u003c/td>\u003ctd>L3\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M06 Spring\u003c/td>\u003ctd>L3\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M07 工程质量\u003c/td>\u003ctd>L3/L4\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M08 中间件\u003c/td>\u003ctd>Redis/MQ L3，搜索 L2\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M09 分布式\u003c/td>\u003ctd>L3/L4\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10 可靠性\u003c/td>\u003ctd>L3/L4\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M11 架构\u003c/td>\u003ctd>L4\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12 安全协作\u003c/td>\u003ctd>L2/L3/L4，见单元\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待诊断\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">诊断记录\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"任务表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">任务\u003c/th>\u003cth scope=\"col\">结论（三选一，见方法）\u003c/th>\u003cth scope=\"col\">哪一步需要帮助\u003c/th>\u003cth scope=\"col\">证据\u003c/th>\u003cth scope=\"col\">补课与复测\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>D0-1 金额与状态\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>待记录\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待确定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D0-2 数据与查询\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>待记录\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待确定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D0-3 事务/并发\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>待记录\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待确定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D0-4 接口测试与定位\u003c/td>\u003ctd>待诊断\u003c/td>\u003ctd>待记录\u003c/td>\u003ctd>无\u003c/td>\u003ctd>待确定\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">单元验收记录\u003c/h2>\n\u003cp>每次追加一行，保留失败和复测记录。证据可放在后续创建的 \u003ccode>evidence/\u003c/code> 中；文件存在后再添加可点击链接。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"日期表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">日期\u003c/th>\u003cth scope=\"col\">单元/任务 ID\u003c/th>\u003cth scope=\"col\">执行状态\u003c/th>\u003cth scope=\"col\">等级\u003c/th>\u003cth scope=\"col\">正常/边界/失败证据\u003c/th>\u003cth scope=\"col\">变式复测结果\u003c/th>\u003cth scope=\"col\">下一步\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>—\u003c/td>\u003ctd>尚未开始\u003c/td>\u003ctd>未开始\u003c/td>\u003ctd>—\u003c/td>\u003ctd>无\u003c/td>\u003ctd>未进行\u003c/td>\u003ctd>完成 D0-1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-5\">阶段出口\u003c/h2>\n\u003cul class=\"checklist\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"PROGRESS.md::304bb63f1e6e\">\u003cspan>阶段 0：诊断记录完整，弱项与任务已确定。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"PROGRESS.md::fecc2600085d\">\u003cspan>阶段 1：业务规则、权限、回滚、测试与空环境初始化通过。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"PROGRESS.md::637bf279b129\">\u003cspan>阶段 2：并发不变量通过，诊断与性能对比可复现。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"PROGRESS.md::c273ea488a15\">\u003cspan>阶段 3：故障、重放、告警、备份恢复通过。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"PROGRESS.md::0e2fdad49f53\">\u003cspan>阶段 4：设计经过比较，迁移与回滚经过验证。\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\" data-check=\"PROGRESS.md::a69c4ee541ec\">\u003cspan>阶段 5：真实工作反馈可复核；模拟练习不能勾选真实验证。\u003c/span>\u003c/label>\u003c/li>\u003c/ul>", "toc": [{"id": "heading-0", "title": "个人进度与能力矩阵", "level": 1}, {"id": "heading-1", "title": "当前学习卡", "level": 2}, {"id": "heading-2", "title": "模块能力矩阵", "level": 2}, {"id": "heading-3", "title": "诊断记录", "level": 2}, {"id": "heading-4", "title": "单元验收记录", "level": 2}, {"id": "heading-5", "title": "阶段出口", "level": 2}], "units": [], "checks": [{"id": "PROGRESS.md::304bb63f1e6e", "text": "阶段 0：诊断记录完整，弱项与任务已确定。"}, {"id": "PROGRESS.md::fecc2600085d", "text": "阶段 1：业务规则、权限、回滚、测试与空环境初始化通过。"}, {"id": "PROGRESS.md::637bf279b129", "text": "阶段 2：并发不变量通过，诊断与性能对比可复现。"}, {"id": "PROGRESS.md::c273ea488a15", "text": "阶段 3：故障、重放、告警、备份恢复通过。"}, {"id": "PROGRESS.md::0e2fdad49f53", "text": "阶段 4：设计经过比较，迁移与回滚经过验证。"}, {"id": "PROGRESS.md::a69c4ee541ec", "text": "阶段 5：真实工作反馈可复核；模拟练习不能勾选真实验证。"}]}, {"path": "modules/m01-java.md", "title": "M01 Java 语言与核心库", "text": "M01 Java 语言与核心库 总纲 · 阶段 1 · 学习方法 学习问题与前置 为什么同样能运行的业务代码，在金额、集合、异常和时间边界上会得出不同结果？进入时应能独立编写类、方法和简单测试；不足处先补基本语法。目标：L3，能定位违反对象契约和资源管理规则的错误。 必修单元 表内单元从上到下推进，注明的跨模块前置按需插入。每行的验收都要留下代码、解释或实验结果。 单元 主题与关键原理 前置 怎么学 通过标准 M01-1 类型、值传递、对象身份、封装、继承/组合、动态绑定；equals/hashCode 基本语法 预测别名修改、重载/重写、集合查找结果，再验证 解释引用值传递；修复可变对象作键导致的查找问题 M01-2 泛型不变性、PECS、擦除；List/Set/Map 选型、散列、扩容和迭代 M01-1 写通用映射/拷贝函数；跟踪固定 JDK 的 HashMap put 路径 无未解释的 unchecked 警告；解释复杂度、冲突与 fail-fast 的边界 M01-3 异常边界、try-with-resources、字节/字符流、编码、NIO 基础 M01-1 导入客户 CSV，故意制造坏行和中途失败 资源被关闭，错误可定位；区分整体失败与逐行容错策略 M01-4 不可变性、BigDecimal、舍入、LocalDate/Instant/ZoneId M01-1 实现金额值对象、报价快照与可替换 Clock 0.10×3 得到精确金额；拒绝负数/超精度；历史报价不随对象修改变化 M01-5 Lambda、函数式接口、Stream 惰性与副作用；record、sealed、模式匹配 M01-2、M01-4 用循环和 Stream 分别汇总订单，比较可读性与边界 空集合和重复键有定义；解释 record 的浅不可变性；不滥用 parallelStream M01-6 注解、反射、动态代理、SPI 的机制与边界 M01-1、M01-3 写仅支持接口代理的调用计时器，画出委托过程 能解释代理对象与目标对象的关系、异常传播；连接到 M06 的代理事务 最小实验与项目映射 实验 A：报价快照。 先写金额与报价模型，再把外部可变明细列表传入报价；修改原列表，检查报价是否被污染。用防御性拷贝修复，说明复制列表与复制元素的差别。业务规则使用阶段 1 的单币种、两位小数基线。 实验 B：集合契约。 把一个参与 hashCode 的字段可变的客户对象放入 HashMap；修改字段后查找，再改成稳定标识作键。提交原始输出、修复版本及解释，不以遍历恰好找到元素代替契约分析。 场景 验证 正常 两条报价明细求和，输出金额和版本快照 边界 空明细、0.10、0.00、跨时区到期时间、同值不同 scale 的金额 失败 负单价、负数量、非法状态修改、资源读取中途异常 项目落点：客户标识、报价 Money、报价版本、订单快照、CSV 导入错误报告。 自测与模块验收 BigDecimal 的 equals 与 compareTo 有什么不同？你的金额值对象采用什么相等语义？ 判断依据 能说明 scale，并保证 equals/hashCode 一致。 为什么给字段加 final 仍可能被外部修改？ 判断依据 用可变列表或元素展示反例并修复。 List\u003cInteger> 为什么不是 List\u003cNumber>？ 判断依据 指出如果允许赋值会怎样破坏类型安全，并用通配符表达读写边界。 代理能拦截哪些调用？ 判断依据 画出经过代理与目标内部直接调用两条路径，不把一种代理实现的限制推及所有机制。 通过单元验收后，再把报价模型换为“合同版本”闭卷实现；能诊断注入的金额/可变性错误才达到 L3。 一手资料与阅读顺序 主入口： Java 官方教程 。依次读语言与对象、泛型、Collections/Streams、异常与反射；每次只读对应单元。 核对依据： Java 21 API 与 JLS ，重点查 BigDecimal、Object、Map、AutoCloseable、java.time 与 JLS 类型/泛型章节。源码使用本机匹配补丁版本的 src.zip，记录具体版本。 选修与边界 JPMS、MethodHandle 深入、注解处理器、JNI、Foreign Function & Memory 和框架级元编程按工作需求选学；预览特性不进入 Java 21 基线作业。", "html": "\u003ch1 id=\"heading-0\">M01 Java 语言与核心库\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-01-business.md\">阶段 1\u003c/a> · \u003ca href=\"#doc=METHOD.md\">学习方法\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>为什么同样能运行的业务代码，在金额、集合、异常和时间边界上会得出不同结果？进入时应能独立编写类、方法和简单测试；不足处先补基本语法。目标：L3，能定位违反对象契约和资源管理规则的错误。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cp>表内单元从上到下推进，注明的跨模块前置按需插入。每行的验收都要留下代码、解释或实验结果。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M01-1\u003c/td>\u003ctd>类型、值传递、对象身份、封装、继承/组合、动态绑定；equals/hashCode\u003c/td>\u003ctd>基本语法\u003c/td>\u003ctd>预测别名修改、重载/重写、集合查找结果，再验证\u003c/td>\u003ctd>解释引用值传递；修复可变对象作键导致的查找问题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01-2\u003c/td>\u003ctd>泛型不变性、PECS、擦除；List/Set/Map 选型、散列、扩容和迭代\u003c/td>\u003ctd>M01-1\u003c/td>\u003ctd>写通用映射/拷贝函数；跟踪固定 JDK 的 HashMap put 路径\u003c/td>\u003ctd>无未解释的 unchecked 警告；解释复杂度、冲突与 fail-fast 的边界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01-3\u003c/td>\u003ctd>异常边界、try-with-resources、字节/字符流、编码、NIO 基础\u003c/td>\u003ctd>M01-1\u003c/td>\u003ctd>导入客户 CSV，故意制造坏行和中途失败\u003c/td>\u003ctd>资源被关闭，错误可定位；区分整体失败与逐行容错策略\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01-4\u003c/td>\u003ctd>不可变性、BigDecimal、舍入、LocalDate/Instant/ZoneId\u003c/td>\u003ctd>M01-1\u003c/td>\u003ctd>实现金额值对象、报价快照与可替换 Clock\u003c/td>\u003ctd>0.10×3 得到精确金额；拒绝负数/超精度；历史报价不随对象修改变化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01-5\u003c/td>\u003ctd>Lambda、函数式接口、Stream 惰性与副作用；record、sealed、模式匹配\u003c/td>\u003ctd>M01-2、M01-4\u003c/td>\u003ctd>用循环和 Stream 分别汇总订单，比较可读性与边界\u003c/td>\u003ctd>空集合和重复键有定义；解释 record 的浅不可变性；不滥用 parallelStream\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01-6\u003c/td>\u003ctd>注解、反射、动态代理、SPI 的机制与边界\u003c/td>\u003ctd>M01-1、M01-3\u003c/td>\u003ctd>写仅支持接口代理的调用计时器，画出委托过程\u003c/td>\u003ctd>能解释代理对象与目标对象的关系、异常传播；连接到 M06 的代理事务\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：报价快照。\u003c/strong> 先写金额与报价模型，再把外部可变明细列表传入报价；修改原列表，检查报价是否被污染。用防御性拷贝修复，说明复制列表与复制元素的差别。业务规则使用阶段 1 的单币种、两位小数基线。\u003c/p>\n\u003cp>\u003cstrong>实验 B：集合契约。\u003c/strong> 把一个参与 hashCode 的字段可变的客户对象放入 HashMap；修改字段后查找，再改成稳定标识作键。提交原始输出、修复版本及解释，不以遍历恰好找到元素代替契约分析。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>两条报价明细求和，输出金额和版本快照\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>空明细、0.10、0.00、跨时区到期时间、同值不同 scale 的金额\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>负单价、负数量、非法状态修改、资源读取中途异常\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>项目落点：客户标识、报价 Money、报价版本、订单快照、CSV 导入错误报告。\u003c/p>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>BigDecimal 的 equals 与 compareTo 有什么不同？你的金额值对象采用什么相等语义？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 能说明 scale，并保证 equals/hashCode 一致。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么给字段加 final 仍可能被外部修改？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 用可变列表或元素展示反例并修复。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>List&lt;Integer&gt; 为什么不是 List&lt;Number&gt;？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 指出如果允许赋值会怎样破坏类型安全，并用通配符表达读写边界。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>代理能拦截哪些调用？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 画出经过代理与目标内部直接调用两条路径，不把一种代理实现的限制推及所有机制。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>通过单元验收后，再把报价模型换为“合同版本”闭卷实现；能诊断注入的金额/可变性错误才达到 L3。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=java\">Java 官方教程\u003c/a>。依次读语言与对象、泛型、Collections/Streams、异常与反射；每次只读对应单元。\u003c/p>\n\u003cp>核对依据：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=java-spec\">Java 21 API 与 JLS\u003c/a>，重点查 BigDecimal、Object、Map、AutoCloseable、java.time 与 JLS 类型/泛型章节。源码使用本机匹配补丁版本的 src.zip，记录具体版本。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>JPMS、MethodHandle 深入、注解处理器、JNI、Foreign Function &amp; Memory 和框架级元编程按工作需求选学；预览特性不进入 Java 21 基线作业。\u003c/p>", "toc": [{"id": "heading-0", "title": "M01 Java 语言与核心库", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M01-1", "topic": "类型、值传递、对象身份、封装、继承/组合、动态绑定；equals/hashCode", "prereq": "基本语法", "method": "预测别名修改、重载/重写、集合查找结果，再验证", "criteria": "解释引用值传递；修复可变对象作键导致的查找问题"}, {"id": "M01-2", "topic": "泛型不变性、PECS、擦除；List/Set/Map 选型、散列、扩容和迭代", "prereq": "M01-1", "method": "写通用映射/拷贝函数；跟踪固定 JDK 的 HashMap put 路径", "criteria": "无未解释的 unchecked 警告；解释复杂度、冲突与 fail-fast 的边界"}, {"id": "M01-3", "topic": "异常边界、try-with-resources、字节/字符流、编码、NIO 基础", "prereq": "M01-1", "method": "导入客户 CSV，故意制造坏行和中途失败", "criteria": "资源被关闭，错误可定位；区分整体失败与逐行容错策略"}, {"id": "M01-4", "topic": "不可变性、BigDecimal、舍入、LocalDate/Instant/ZoneId", "prereq": "M01-1", "method": "实现金额值对象、报价快照与可替换 Clock", "criteria": "0.10×3 得到精确金额；拒绝负数/超精度；历史报价不随对象修改变化"}, {"id": "M01-5", "topic": "Lambda、函数式接口、Stream 惰性与副作用；record、sealed、模式匹配", "prereq": "M01-2、M01-4", "method": "用循环和 Stream 分别汇总订单，比较可读性与边界", "criteria": "空集合和重复键有定义；解释 record 的浅不可变性；不滥用 parallelStream"}, {"id": "M01-6", "topic": "注解、反射、动态代理、SPI 的机制与边界", "prereq": "M01-1、M01-3", "method": "写仅支持接口代理的调用计时器，画出委托过程", "criteria": "能解释代理对象与目标对象的关系、异常传播；连接到 M06 的代理事务"}], "checks": []}, {"path": "modules/m02-foundations.md", "title": "M02 计算机基础与算法", "text": "M02 计算机基础与算法 总纲 · 学习方法 学习问题与前置 一次请求为什么会慢？一个循环、一个系统调用和一次网络往返分别消耗什么？前置：M01 基本类型、集合与 IO。目标：结构与算法 L2，请求链路和资源定位逐步达到 L3；按当前问题补课，不先背完整 OS 教材。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M02-1 渐进复杂度、均摊成本、数组/链表/栈/队列/哈希、排序与二分 M01-2 手写二分、LRU 的最小模型，比较两种客户去重算法 空/重复/极值测试通过；解释时间、空间和退化条件 M02-2 树、堆、图、BFS/DFS、拓扑排序、双指针、滑动窗口、动态规划与贪心 M02-1 组织树遍历、审批依赖环检测、Top K 客户、预算选择 不背解法也能写状态定义与循环不变量；解释贪心成立或失败的例子 M02-3 编译/链接/加载、进程线程、调度、上下文切换、用户态/内核态 M01-3 观察 Java 进程与线程，把应用线程等待映射到 OS 调度 区分高 CPU 与等待；说明增加线程为什么可能变慢 M02-4 缓存层级、缓存行、虚拟内存、页表、缺页；文件、页缓存、系统调用、IO 多路复用 M02-3 画文件读取路径；比较顺序/随机访问，记录页缓存影响 区分 JVM 堆、进程 RSS、虚拟内存；解释 IO 等待并避免把缓存命中当磁盘速度 M02-5 TCP 可靠性、连接与拥塞；HTTP 语义、DNS、TLS、代理和连接复用 M02-3、M01-3 用 curl 的时间指标拆解请求，在练习环境模拟连接失败和响应超时 画 DNS→连接→TLS→请求→响应链，区分连接超时、读超时和业务失败 M02-6 Linux 文件/权限、进程、端口、CPU/内存/磁盘/网络定位 M02-3–5 在 Linux 容器或 VM 上用 ps/top/ss/vmstat/iostat 等观察受控负载 每个结论有观测证据；能说明工具缺失时要补什么信息 最小实验与项目映射 实验 A：客户去重。 固定同一批虚构客户，先做双重循环，再使用散列表。以 10³、10⁴、10⁵ 条输入比较操作规模与耗时；不要只凭一次计时推导复杂度。测试全重复、全不同和空输入。 实验 B：请求的一生。 为练习服务分别构造：地址解析失败、端口未监听、下游延迟、接口返回 500。记录客户端错误、服务器是否收到请求、各阶段耗时，解释应在哪一层排查。 实验 C：组织关系。 把 CRM 部门层级建成树；加入一条形成环的错误关系，用图算法拒绝它。提交正常树、单节点、深链与环四组测试。 项目落点：客户去重、组织树权限范围、Top K 成交客户、外部接口超时排查。 自测与模块验收 应用延迟高而 CPU 低说明什么？ 判断依据 提出至少两个假设，并列出区分它们的观测手段。 为什么收到 TCP 确认不等于业务已成功？ 判断依据 区分传输、应用处理与持久化边界。 对 100 万客户取前 100 名，排序和堆有什么差别？ 判断依据 比较复杂度，并讨论输入更新频率。 一次文件读取是否一定访问磁盘？ 判断依据 画出用户缓冲、页缓存和设备的关系。 每轮算法至少完成一个未照抄的解法、边界测试和复杂度解释。阶段出口换一个业务对象复测，不用题量代替掌握。 一手资料与阅读顺序 主入口： OSTEP ，按线程/调度、内存、IO/文件章节定点阅读； MIT 算法课程与 HTTP 标准 分别对应算法和协议。 Linux 实验与开发机 macOS 的命令、调度和 IO 实现分别记录；epoll 是 Linux 机制，不把开发机观察直接作为 Linux 结论。 选修与边界 汇编优化、编译器实现、内核开发、竞赛算法、网络驱动为选修。AIO、零拷贝与 Netty 深入放在能解释基础 IO 路径之后。", "html": "\u003ch1 id=\"heading-0\">M02 计算机基础与算法\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=METHOD.md\">学习方法\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>一次请求为什么会慢？一个循环、一个系统调用和一次网络往返分别消耗什么？前置：M01 基本类型、集合与 IO。目标：结构与算法 L2，请求链路和资源定位逐步达到 L3；按当前问题补课，不先背完整 OS 教材。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M02-1\u003c/td>\u003ctd>渐进复杂度、均摊成本、数组/链表/栈/队列/哈希、排序与二分\u003c/td>\u003ctd>M01-2\u003c/td>\u003ctd>手写二分、LRU 的最小模型，比较两种客户去重算法\u003c/td>\u003ctd>空/重复/极值测试通过；解释时间、空间和退化条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02-2\u003c/td>\u003ctd>树、堆、图、BFS/DFS、拓扑排序、双指针、滑动窗口、动态规划与贪心\u003c/td>\u003ctd>M02-1\u003c/td>\u003ctd>组织树遍历、审批依赖环检测、Top K 客户、预算选择\u003c/td>\u003ctd>不背解法也能写状态定义与循环不变量；解释贪心成立或失败的例子\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02-3\u003c/td>\u003ctd>编译/链接/加载、进程线程、调度、上下文切换、用户态/内核态\u003c/td>\u003ctd>M01-3\u003c/td>\u003ctd>观察 Java 进程与线程，把应用线程等待映射到 OS 调度\u003c/td>\u003ctd>区分高 CPU 与等待；说明增加线程为什么可能变慢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02-4\u003c/td>\u003ctd>缓存层级、缓存行、虚拟内存、页表、缺页；文件、页缓存、系统调用、IO 多路复用\u003c/td>\u003ctd>M02-3\u003c/td>\u003ctd>画文件读取路径；比较顺序/随机访问，记录页缓存影响\u003c/td>\u003ctd>区分 JVM 堆、进程 RSS、虚拟内存；解释 IO 等待并避免把缓存命中当磁盘速度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02-5\u003c/td>\u003ctd>TCP 可靠性、连接与拥塞；HTTP 语义、DNS、TLS、代理和连接复用\u003c/td>\u003ctd>M02-3、M01-3\u003c/td>\u003ctd>用 curl 的时间指标拆解请求，在练习环境模拟连接失败和响应超时\u003c/td>\u003ctd>画 DNS→连接→TLS→请求→响应链，区分连接超时、读超时和业务失败\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02-6\u003c/td>\u003ctd>Linux 文件/权限、进程、端口、CPU/内存/磁盘/网络定位\u003c/td>\u003ctd>M02-3–5\u003c/td>\u003ctd>在 Linux 容器或 VM 上用 ps/top/ss/vmstat/iostat 等观察受控负载\u003c/td>\u003ctd>每个结论有观测证据；能说明工具缺失时要补什么信息\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：客户去重。\u003c/strong> 固定同一批虚构客户，先做双重循环，再使用散列表。以 10³、10⁴、10⁵ 条输入比较操作规模与耗时；不要只凭一次计时推导复杂度。测试全重复、全不同和空输入。\u003c/p>\n\u003cp>\u003cstrong>实验 B：请求的一生。\u003c/strong> 为练习服务分别构造：地址解析失败、端口未监听、下游延迟、接口返回 500。记录客户端错误、服务器是否收到请求、各阶段耗时，解释应在哪一层排查。\u003c/p>\n\u003cp>\u003cstrong>实验 C：组织关系。\u003c/strong> 把 CRM 部门层级建成树；加入一条形成环的错误关系，用图算法拒绝它。提交正常树、单节点、深链与环四组测试。\u003c/p>\n\u003cp>项目落点：客户去重、组织树权限范围、Top K 成交客户、外部接口超时排查。\u003c/p>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>应用延迟高而 CPU 低说明什么？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 提出至少两个假设，并列出区分它们的观测手段。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么收到 TCP 确认不等于业务已成功？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 区分传输、应用处理与持久化边界。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>对 100 万客户取前 100 名，排序和堆有什么差别？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 比较复杂度，并讨论输入更新频率。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>一次文件读取是否一定访问磁盘？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 画出用户缓冲、页缓存和设备的关系。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>每轮算法至少完成一个未照抄的解法、边界测试和复杂度解释。阶段出口换一个业务对象复测，不用题量代替掌握。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=foundations\">OSTEP\u003c/a>，按线程/调度、内存、IO/文件章节定点阅读；\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=foundations\">MIT 算法课程与 HTTP 标准\u003c/a> 分别对应算法和协议。\u003c/p>\n\u003cp>Linux 实验与开发机 macOS 的命令、调度和 IO 实现分别记录；epoll 是 Linux 机制，不把开发机观察直接作为 Linux 结论。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>汇编优化、编译器实现、内核开发、竞赛算法、网络驱动为选修。AIO、零拷贝与 Netty 深入放在能解释基础 IO 路径之后。\u003c/p>", "toc": [{"id": "heading-0", "title": "M02 计算机基础与算法", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M02-1", "topic": "渐进复杂度、均摊成本、数组/链表/栈/队列/哈希、排序与二分", "prereq": "M01-2", "method": "手写二分、LRU 的最小模型，比较两种客户去重算法", "criteria": "空/重复/极值测试通过；解释时间、空间和退化条件"}, {"id": "M02-2", "topic": "树、堆、图、BFS/DFS、拓扑排序、双指针、滑动窗口、动态规划与贪心", "prereq": "M02-1", "method": "组织树遍历、审批依赖环检测、Top K 客户、预算选择", "criteria": "不背解法也能写状态定义与循环不变量；解释贪心成立或失败的例子"}, {"id": "M02-3", "topic": "编译/链接/加载、进程线程、调度、上下文切换、用户态/内核态", "prereq": "M01-3", "method": "观察 Java 进程与线程，把应用线程等待映射到 OS 调度", "criteria": "区分高 CPU 与等待；说明增加线程为什么可能变慢"}, {"id": "M02-4", "topic": "缓存层级、缓存行、虚拟内存、页表、缺页；文件、页缓存、系统调用、IO 多路复用", "prereq": "M02-3", "method": "画文件读取路径；比较顺序/随机访问，记录页缓存影响", "criteria": "区分 JVM 堆、进程 RSS、虚拟内存；解释 IO 等待并避免把缓存命中当磁盘速度"}, {"id": "M02-5", "topic": "TCP 可靠性、连接与拥塞；HTTP 语义、DNS、TLS、代理和连接复用", "prereq": "M02-3、M01-3", "method": "用 curl 的时间指标拆解请求，在练习环境模拟连接失败和响应超时", "criteria": "画 DNS→连接→TLS→请求→响应链，区分连接超时、读超时和业务失败"}, {"id": "M02-6", "topic": "Linux 文件/权限、进程、端口、CPU/内存/磁盘/网络定位", "prereq": "M02-3–5", "method": "在 Linux 容器或 VM 上用 ps/top/ss/vmstat/iostat 等观察受控负载", "criteria": "每个结论有观测证据；能说明工具缺失时要补什么信息"}], "checks": []}, {"path": "modules/m03-concurrency.md", "title": "M03 并发编程", "text": "M03 并发编程 总纲 · 阶段 2 学习问题与前置 “检查后再执行”为什么在并发下出错？线程多了为何吞吐没有上升？前置：M01 对象/集合/异常，M02 线程与内存。目标 L3：能构造时序、解释正确性、限制资源并定位并发问题。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M03-1 竞态、原子性、可见性、有序性、JMM、happens-before、安全发布 M01-1、M02-3/4 用屏障复现丢失更新，画 HB 关系；比较 volatile 与锁 解释 volatile 不能让复合操作原子化；不凭一次运行证明安全 M03-2 synchronized、显式锁、Condition、读写锁、CAS/ABA、AQS 的状态与等待队列 M03-1 跟踪一次获取/阻塞/唤醒；构造死锁后调整顺序 区分互斥与协调；说明锁粒度、饥饿与公平性的取舍 M03-3 ConcurrentHashMap、原子类、阻塞队列、ThreadLocal 的生命周期 M03-1/2、M01-2 写幂等注册的并发模型；复现线程复用导致上下文串用 复合逻辑使用正确原子边界；请求结束清理上下文 M03-4 线程池参数、队列、拒绝策略、资源隔离、背压 M03-2/3 限制下游容量，比较无界排队与有界队列 明确过载时拒绝/等待规则；队列、活跃线程、延迟可观测 M03-5 Future、CompletableFuture、异常传播、超时、取消、并行组合 M03-4 同时查询客户与报价；注入一个慢任务和一个失败任务 不吞异常；解释超时返回与实际任务停止的区别，验证取消协作 M03-6 Java 21 虚拟线程、阻塞 IO、载体线程、资源限流 M03-4/5、M02-3 对照平台线程与虚拟线程执行等待型负载，再限制数据库连接 区分线程成本与外部容量；按 Java 21 资料检查 pinning 条件，不套用新版结论 最小实验与项目映射 实验 A：扣减不是两步。 内存库存初始 10，让 100 个任务在屏障后竞争扣减，先实现错误的读取后写入，再用锁或 CAS 修复。断言成功数与余量守恒。随后转到数据库条件更新，解释 JVM 锁为何不能保护多实例。 实验 B：慢下游。 下游每次等待 200ms，最大并发 10；用 100 个客户端请求比较线程池排队、拒绝、信号量限流。记录成功/失败/超时、P95、队列深度和下游在途数。再改为 CPU 型负载验证不能照搬结论。 场景 验证 正常 任务全部结束，返回值与异常有归属 边界 库存 0、队列恰满、取消在开始前或执行中到达 失败 两把锁反序、线程任务抛异常、下游一直阻塞、请求上下文未清理 自测与模块验收 sleep 为什么不能建立你需要的线程间通信保证？ 判断依据 用 HB 关系解释并改为明确同步。 CAS 成功是否意味着跨数据库和消息的业务整体正确？ 判断依据 说清原子操作的范围。 一个 CompletableFuture 超时后，下游是否还在工作？ 判断依据 用日志和资源指标验证，而非只看接口返回。 虚拟线程为什么仍需要限制数据库并发？ 判断依据 指出连接、CPU、下游限额与线程不是同一种资源。 验收需包含一个新注入的竞态和一个容量故障。诊断报告必须有时序、根因、修复和复测；不要求为了学习手写完整 AQS。 一手资料与阅读顺序 主入口： Java 21 API 与 JLS ：先读 JLS 第 17 章，再按单元查 java.util.concurrent。虚拟线程读 Java 21 官方指南及 JEP 444 背景入口 。源码只追踪当前实验相关的方法与状态变化。 选修与边界 锁自由算法、JCStress、结构化并发后续版本、Reactor/Netty 深入为选修。Java 21 中的预览 API 不作为必修实现依赖。", "html": "\u003ch1 id=\"heading-0\">M03 并发编程\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-02-correctness.md\">阶段 2\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>“检查后再执行”为什么在并发下出错？线程多了为何吞吐没有上升？前置：M01 对象/集合/异常，M02 线程与内存。目标 L3：能构造时序、解释正确性、限制资源并定位并发问题。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M03-1\u003c/td>\u003ctd>竞态、原子性、可见性、有序性、JMM、happens-before、安全发布\u003c/td>\u003ctd>M01-1、M02-3/4\u003c/td>\u003ctd>用屏障复现丢失更新，画 HB 关系；比较 volatile 与锁\u003c/td>\u003ctd>解释 volatile 不能让复合操作原子化；不凭一次运行证明安全\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M03-2\u003c/td>\u003ctd>synchronized、显式锁、Condition、读写锁、CAS/ABA、AQS 的状态与等待队列\u003c/td>\u003ctd>M03-1\u003c/td>\u003ctd>跟踪一次获取/阻塞/唤醒；构造死锁后调整顺序\u003c/td>\u003ctd>区分互斥与协调；说明锁粒度、饥饿与公平性的取舍\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M03-3\u003c/td>\u003ctd>ConcurrentHashMap、原子类、阻塞队列、ThreadLocal 的生命周期\u003c/td>\u003ctd>M03-1/2、M01-2\u003c/td>\u003ctd>写幂等注册的并发模型；复现线程复用导致上下文串用\u003c/td>\u003ctd>复合逻辑使用正确原子边界；请求结束清理上下文\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M03-4\u003c/td>\u003ctd>线程池参数、队列、拒绝策略、资源隔离、背压\u003c/td>\u003ctd>M03-2/3\u003c/td>\u003ctd>限制下游容量，比较无界排队与有界队列\u003c/td>\u003ctd>明确过载时拒绝/等待规则；队列、活跃线程、延迟可观测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M03-5\u003c/td>\u003ctd>Future、CompletableFuture、异常传播、超时、取消、并行组合\u003c/td>\u003ctd>M03-4\u003c/td>\u003ctd>同时查询客户与报价；注入一个慢任务和一个失败任务\u003c/td>\u003ctd>不吞异常；解释超时返回与实际任务停止的区别，验证取消协作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M03-6\u003c/td>\u003ctd>Java 21 虚拟线程、阻塞 IO、载体线程、资源限流\u003c/td>\u003ctd>M03-4/5、M02-3\u003c/td>\u003ctd>对照平台线程与虚拟线程执行等待型负载，再限制数据库连接\u003c/td>\u003ctd>区分线程成本与外部容量；按 Java 21 资料检查 pinning 条件，不套用新版结论\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：扣减不是两步。\u003c/strong> 内存库存初始 10，让 100 个任务在屏障后竞争扣减，先实现错误的读取后写入，再用锁或 CAS 修复。断言成功数与余量守恒。随后转到数据库条件更新，解释 JVM 锁为何不能保护多实例。\u003c/p>\n\u003cp>\u003cstrong>实验 B：慢下游。\u003c/strong> 下游每次等待 200ms，最大并发 10；用 100 个客户端请求比较线程池排队、拒绝、信号量限流。记录成功/失败/超时、P95、队列深度和下游在途数。再改为 CPU 型负载验证不能照搬结论。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>任务全部结束，返回值与异常有归属\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>库存 0、队列恰满、取消在开始前或执行中到达\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>两把锁反序、线程任务抛异常、下游一直阻塞、请求上下文未清理\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>sleep 为什么不能建立你需要的线程间通信保证？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 用 HB 关系解释并改为明确同步。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>CAS 成功是否意味着跨数据库和消息的业务整体正确？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说清原子操作的范围。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>一个 CompletableFuture 超时后，下游是否还在工作？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 用日志和资源指标验证，而非只看接口返回。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>虚拟线程为什么仍需要限制数据库并发？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 指出连接、CPU、下游限额与线程不是同一种资源。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>验收需包含一个新注入的竞态和一个容量故障。诊断报告必须有时序、根因、修复和复测；不要求为了学习手写完整 AQS。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=java-spec\">Java 21 API 与 JLS\u003c/a>：先读 JLS 第 17 章，再按单元查 java.util.concurrent。虚拟线程读 \u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=virtual-threads\">Java 21 官方指南及 JEP 444 背景入口\u003c/a>。源码只追踪当前实验相关的方法与状态变化。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>锁自由算法、JCStress、结构化并发后续版本、Reactor/Netty 深入为选修。Java 21 中的预览 API 不作为必修实现依赖。\u003c/p>", "toc": [{"id": "heading-0", "title": "M03 并发编程", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M03-1", "topic": "竞态、原子性、可见性、有序性、JMM、happens-before、安全发布", "prereq": "M01-1、M02-3/4", "method": "用屏障复现丢失更新，画 HB 关系；比较 volatile 与锁", "criteria": "解释 volatile 不能让复合操作原子化；不凭一次运行证明安全"}, {"id": "M03-2", "topic": "synchronized、显式锁、Condition、读写锁、CAS/ABA、AQS 的状态与等待队列", "prereq": "M03-1", "method": "跟踪一次获取/阻塞/唤醒；构造死锁后调整顺序", "criteria": "区分互斥与协调；说明锁粒度、饥饿与公平性的取舍"}, {"id": "M03-3", "topic": "ConcurrentHashMap、原子类、阻塞队列、ThreadLocal 的生命周期", "prereq": "M03-1/2、M01-2", "method": "写幂等注册的并发模型；复现线程复用导致上下文串用", "criteria": "复合逻辑使用正确原子边界；请求结束清理上下文"}, {"id": "M03-4", "topic": "线程池参数、队列、拒绝策略、资源隔离、背压", "prereq": "M03-2/3", "method": "限制下游容量，比较无界排队与有界队列", "criteria": "明确过载时拒绝/等待规则；队列、活跃线程、延迟可观测"}, {"id": "M03-5", "topic": "Future、CompletableFuture、异常传播、超时、取消、并行组合", "prereq": "M03-4", "method": "同时查询客户与报价；注入一个慢任务和一个失败任务", "criteria": "不吞异常；解释超时返回与实际任务停止的区别，验证取消协作"}, {"id": "M03-6", "topic": "Java 21 虚拟线程、阻塞 IO、载体线程、资源限流", "prereq": "M03-4/5、M02-3", "method": "对照平台线程与虚拟线程执行等待型负载，再限制数据库连接", "criteria": "区分线程成本与外部容量；按 Java 21 资料检查 pinning 条件，不套用新版结论"}], "checks": []}, {"path": "modules/m04-jvm.md", "title": "M04 JVM 与性能诊断", "text": "M04 JVM 与性能诊断 总纲 · 阶段 2 学习问题与前置 响应变慢、内存增长或进程退出时，怎样把现象变成可验证的根因？前置：M01 对象与资源、M02 OS、M03 线程基础。目标 L3：以观测排除假设，完成同条件复测。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M04-1 字节码、类加载/初始化、链接、类加载器与委派边界 M01-1/6 用 javap 对照重载、泛型擦除；构造初始化异常 区分编译、链接、初始化错误；解释同名类的类型身份 M04-2 堆、栈、元空间、直接内存、对象布局、引用关系 M02-4 画对象保留链，区分堆内存与进程 RSS 不把所有内存增长归因于堆泄漏；能给出验证路径 M04-3 GC Roots、可达性、分代思想、G1/ZGC、暂停/吞吐/占用 M04-2 在固定堆限制下记录分配速率、存活量与 GC 日志 解释回收效果与业务延迟关系，提出有目标的调整而非背参数 M04-4 JIT、内联、逃逸分析、预热、基准测试陷阱 M04-1/3 比较冷启动与稳定期，用 JMH 做一个小实验 识别死代码消除和常量折叠；区分微基准与端到端性能 M04-5 jcmd、线程转储、JFR、堆转储、性能剖析 M03、M04-2/3 依次注入死循环、锁竞争、对象保留和慢 IO 用不同工具找到实际热点或保留链，解释工具开销 M04-6 诊断闭环、资源预算、性能回归 M04-4/5、M05 索引基础 对报价接口建立负载基线，每次只改一个主变量 交付根因、对照、重复结果和退化场景，无法确认的结论明确标注 最小实验与项目映射 实验 A：三种“慢”。 同一个练习接口分别执行高 CPU 循环、等待同一把锁、等待慢下游。固定输入与并发，记录 CPU、线程状态、JFR 和接口延迟；比较工具证据能否区分三者。 实验 B：客户导出内存。 对比一次性加载所有客户与分批读取/输出，逐步增大数据量。注入一个长期保存批次引用的集合；通过堆转储找到保留链，再修复并复测。样本使用虚构数据；转储也视为敏感产物管理。 场景 验证 正常 稳定输入下资源与延迟基线可复现 边界 小堆、空导出、较大单条记录、容器 CPU 限制 失败 内存耗尽、死循环、死锁、下游超时；比较 CPU 与壁钟时间 自测与模块验收 Full GC 后内存仍很高一定是泄漏吗？ 判断依据 讨论正常存活集、堆外内存和泄漏，并给出区分证据。 为什么一次堆转储可能找不到 CPU 问题？ 判断依据 说明工具适用范围，选择线程与采样证据。 更换 GC 后 P99 降低但吞吐也下降，如何判断是否值得？ 判断依据 关联业务目标与资源成本。 为什么“执行一次循环计时”不足以证明优化？ 判断依据 说明预热、测量噪声和编译优化。 至少完成 CPU、等待、内存三类诊断；优化报告依照 证据模板 ，相同负载重复至少 3 次。现有测量无法区分假设时继续补证据。 一手资料与阅读顺序 主入口： JDK 21 故障排查指南 ，先读诊断流程与工具，再按问题查内存和性能章节；基准实验查 JMH。字节码/运行时概念回查 Java 21 规范与对应发行版工具文档。 选修与边界 HotSpot C++ 实现、收集器算法证明、复杂字节码增强、Native Image 调优为选修。练习可用较小内存触发故障；真实环境诊断需考虑暂停、磁盘与采样成本。", "html": "\u003ch1 id=\"heading-0\">M04 JVM 与性能诊断\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-02-correctness.md\">阶段 2\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>响应变慢、内存增长或进程退出时，怎样把现象变成可验证的根因？前置：M01 对象与资源、M02 OS、M03 线程基础。目标 L3：以观测排除假设，完成同条件复测。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M04-1\u003c/td>\u003ctd>字节码、类加载/初始化、链接、类加载器与委派边界\u003c/td>\u003ctd>M01-1/6\u003c/td>\u003ctd>用 javap 对照重载、泛型擦除；构造初始化异常\u003c/td>\u003ctd>区分编译、链接、初始化错误；解释同名类的类型身份\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M04-2\u003c/td>\u003ctd>堆、栈、元空间、直接内存、对象布局、引用关系\u003c/td>\u003ctd>M02-4\u003c/td>\u003ctd>画对象保留链，区分堆内存与进程 RSS\u003c/td>\u003ctd>不把所有内存增长归因于堆泄漏；能给出验证路径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M04-3\u003c/td>\u003ctd>GC Roots、可达性、分代思想、G1/ZGC、暂停/吞吐/占用\u003c/td>\u003ctd>M04-2\u003c/td>\u003ctd>在固定堆限制下记录分配速率、存活量与 GC 日志\u003c/td>\u003ctd>解释回收效果与业务延迟关系，提出有目标的调整而非背参数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M04-4\u003c/td>\u003ctd>JIT、内联、逃逸分析、预热、基准测试陷阱\u003c/td>\u003ctd>M04-1/3\u003c/td>\u003ctd>比较冷启动与稳定期，用 JMH 做一个小实验\u003c/td>\u003ctd>识别死代码消除和常量折叠；区分微基准与端到端性能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M04-5\u003c/td>\u003ctd>jcmd、线程转储、JFR、堆转储、性能剖析\u003c/td>\u003ctd>M03、M04-2/3\u003c/td>\u003ctd>依次注入死循环、锁竞争、对象保留和慢 IO\u003c/td>\u003ctd>用不同工具找到实际热点或保留链，解释工具开销\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M04-6\u003c/td>\u003ctd>诊断闭环、资源预算、性能回归\u003c/td>\u003ctd>M04-4/5、M05 索引基础\u003c/td>\u003ctd>对报价接口建立负载基线，每次只改一个主变量\u003c/td>\u003ctd>交付根因、对照、重复结果和退化场景，无法确认的结论明确标注\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：三种“慢”。\u003c/strong> 同一个练习接口分别执行高 CPU 循环、等待同一把锁、等待慢下游。固定输入与并发，记录 CPU、线程状态、JFR 和接口延迟；比较工具证据能否区分三者。\u003c/p>\n\u003cp>\u003cstrong>实验 B：客户导出内存。\u003c/strong> 对比一次性加载所有客户与分批读取/输出，逐步增大数据量。注入一个长期保存批次引用的集合；通过堆转储找到保留链，再修复并复测。样本使用虚构数据；转储也视为敏感产物管理。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>稳定输入下资源与延迟基线可复现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>小堆、空导出、较大单条记录、容器 CPU 限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>内存耗尽、死循环、死锁、下游超时；比较 CPU 与壁钟时间\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>Full GC 后内存仍很高一定是泄漏吗？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 讨论正常存活集、堆外内存和泄漏，并给出区分证据。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么一次堆转储可能找不到 CPU 问题？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说明工具适用范围，选择线程与采样证据。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>更换 GC 后 P99 降低但吞吐也下降，如何判断是否值得？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 关联业务目标与资源成本。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么“执行一次循环计时”不足以证明优化？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说明预热、测量噪声和编译优化。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>至少完成 CPU、等待、内存三类诊断；优化报告依照 \u003ca href=\"#doc=templates%2Fevidence.md\">证据模板\u003c/a>，相同负载重复至少 3 次。现有测量无法区分假设时继续补证据。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=jvm\">JDK 21 故障排查指南\u003c/a>，先读诊断流程与工具，再按问题查内存和性能章节；基准实验查 JMH。字节码/运行时概念回查 Java 21 规范与对应发行版工具文档。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>HotSpot C++ 实现、收集器算法证明、复杂字节码增强、Native Image 调优为选修。练习可用较小内存触发故障；真实环境诊断需考虑暂停、磁盘与采样成本。\u003c/p>", "toc": [{"id": "heading-0", "title": "M04 JVM 与性能诊断", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M04-1", "topic": "字节码、类加载/初始化、链接、类加载器与委派边界", "prereq": "M01-1/6", "method": "用 javap 对照重载、泛型擦除；构造初始化异常", "criteria": "区分编译、链接、初始化错误；解释同名类的类型身份"}, {"id": "M04-2", "topic": "堆、栈、元空间、直接内存、对象布局、引用关系", "prereq": "M02-4", "method": "画对象保留链，区分堆内存与进程 RSS", "criteria": "不把所有内存增长归因于堆泄漏；能给出验证路径"}, {"id": "M04-3", "topic": "GC Roots、可达性、分代思想、G1/ZGC、暂停/吞吐/占用", "prereq": "M04-2", "method": "在固定堆限制下记录分配速率、存活量与 GC 日志", "criteria": "解释回收效果与业务延迟关系，提出有目标的调整而非背参数"}, {"id": "M04-4", "topic": "JIT、内联、逃逸分析、预热、基准测试陷阱", "prereq": "M04-1/3", "method": "比较冷启动与稳定期，用 JMH 做一个小实验", "criteria": "识别死代码消除和常量折叠；区分微基准与端到端性能"}, {"id": "M04-5", "topic": "jcmd、线程转储、JFR、堆转储、性能剖析", "prereq": "M03、M04-2/3", "method": "依次注入死循环、锁竞争、对象保留和慢 IO", "criteria": "用不同工具找到实际热点或保留链，解释工具开销"}, {"id": "M04-6", "topic": "诊断闭环、资源预算、性能回归", "prereq": "M04-4/5、M05 索引基础", "method": "对报价接口建立负载基线，每次只改一个主变量", "criteria": "交付根因、对照、重复结果和退化场景，无法确认的结论明确标注"}], "checks": []}, {"path": "modules/m05-data.md", "title": "M05 数据库与数据访问", "text": "M05 数据库与数据访问 总纲 · 阶段 1 · 阶段 2 学习问题与前置 数据什么时候算正确，SQL 为什么这样执行，提交后的结果如何恢复？前置：M01 对象、集合、异常；存储机制补 M02-4。目标 L3。阶段 1 先做 M05-1/2/5/6 的基础任务，阶段 2 回访索引与事务，阶段 3 验证恢复。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M05-1 关系模型、键/约束、NULL、SQL 逻辑、JOIN、分组、窗口函数、分页 M01-2 用客户/订单数据写明细与汇总，手算预期 区分行数膨胀、NULL 和重复；分页排序稳定，统计口径明确 M05-2 ER 建模、函数依赖与范式、反范式、类型与精度、历史快照 M05-1 设计客户→报价版本→订单模型，注入不合法数据 主键/唯一/外键/检查约束各有理由；历史金额不随商品/报价修改变化 M05-3 页、B+ 树、聚簇/二级索引、缓冲池、联合索引、统计信息、执行计划 M05-1、M02-4 对不同选择性、偏斜数据比较 EXPLAIN ANALYZE 解释估计与实际行数差异、回表和排序；测量写入与空间代价 M05-4 ACID、隔离异常、锁/死锁、MVCC、快照读/锁定读、事务边界 M05-2、M03-1 基础 两会话脚本复现 RC/RR 差异和冲突，修改加锁策略 明确快照建立时机和读类型；不把 RR 简化成通用快照隔离或绝对防幻读 M05-5 JDBC、预编译、批处理、连接池；MyBatis 映射/动态 SQL/缓存 M01-3、M05-1/4 基础 JDBC 实现一次事务，再用 MyBatis 对照；注入池耗尽 参数绑定正确、连接归还、异常回滚；解释池大小与数据库容量的关系 M05-6 redo/undo/binlog、崩溃恢复、schema 迁移、备份/恢复、复制基础 M05-4、M02-4 扩展字段兼容旧应用；独立实例恢复并校验业务数据 区分撤销、重做与复制用途；说明回滚应用、恢复备份、前向修复的差别 最小实验与项目映射 实验 A：客户成交额。 生成含“无订单客户、多个订单、多行明细、已取消订单”的数据。分别用错误 JOIN 聚合和正确口径查询，解释重复累计的原因。加入按负责人和时间段筛选，比较联合索引方案。 实验 B：事务时序。 两个独立连接显示隔离级别、自动提交状态与每条 SQL 顺序；在 RC/RR 下分别执行普通 SELECT、锁定读、UPDATE。记录返回值和等待，不把别的引擎结论直接搬到 InnoDB。 实验 C：迁移与恢复。 用“新增可空字段→兼容写入→回填→校验→加约束”演练客户等级变更。对练习库备份，在全新实例恢复并核对条数、金额合计及抽样明细。 场景 验证 正常 报价转订单与明细同一事务提交；查询金额与手算一致 边界 无订单客户、金额 0、数据倾斜、深分页、长事务 失败 唯一键冲突、事务中途异常、反序加锁、连接泄漏、迁移中断 自测与模块验收 有联合索引为什么仍可能全表扫描？ 判断依据 从选择性、统计信息与代价解释，并拿执行计划验证。 RC 与 RR 中普通查询和 UPDATE 使用同一种可见性规则吗？ 判断依据 用明确版本与时序回答，不只背隔离级别表。 已备份为何仍可能达不到恢复目标？ 判断依据 解释恢复时间、丢失窗口及验证方法。 参数化查询能解决动态表名/排序字段的注入吗？ 判断依据 区分值绑定与标识符白名单。 至少一条聚合 SQL、一组隔离实验、一份索引对比和一次恢复验证；阶段 1 只先验收对应基础单元，不要求提前完成全模块。 一手资料与阅读顺序 主入口： MySQL 8.4 手册 ：SQL/数据类型 → InnoDB 事务与锁 → 索引与优化 → Backup and Recovery。数据访问查 MyBatis 官方资料 。所有实验记录精确版本和隔离级别。 选修与边界 PostgreSQL 作为另一种实现对照；LSM、列存、NewSQL、存储引擎开发为选修。分库分表先比较索引、归档、读模型等更简单方案，进入 M11 决策后再实践。", "html": "\u003ch1 id=\"heading-0\">M05 数据库与数据访问\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-01-business.md\">阶段 1\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-02-correctness.md\">阶段 2\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>数据什么时候算正确，SQL 为什么这样执行，提交后的结果如何恢复？前置：M01 对象、集合、异常；存储机制补 M02-4。目标 L3。阶段 1 先做 M05-1/2/5/6 的基础任务，阶段 2 回访索引与事务，阶段 3 验证恢复。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M05-1\u003c/td>\u003ctd>关系模型、键/约束、NULL、SQL 逻辑、JOIN、分组、窗口函数、分页\u003c/td>\u003ctd>M01-2\u003c/td>\u003ctd>用客户/订单数据写明细与汇总，手算预期\u003c/td>\u003ctd>区分行数膨胀、NULL 和重复；分页排序稳定，统计口径明确\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-2\u003c/td>\u003ctd>ER 建模、函数依赖与范式、反范式、类型与精度、历史快照\u003c/td>\u003ctd>M05-1\u003c/td>\u003ctd>设计客户→报价版本→订单模型，注入不合法数据\u003c/td>\u003ctd>主键/唯一/外键/检查约束各有理由；历史金额不随商品/报价修改变化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-3\u003c/td>\u003ctd>页、B+ 树、聚簇/二级索引、缓冲池、联合索引、统计信息、执行计划\u003c/td>\u003ctd>M05-1、M02-4\u003c/td>\u003ctd>对不同选择性、偏斜数据比较 EXPLAIN ANALYZE\u003c/td>\u003ctd>解释估计与实际行数差异、回表和排序；测量写入与空间代价\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-4\u003c/td>\u003ctd>ACID、隔离异常、锁/死锁、MVCC、快照读/锁定读、事务边界\u003c/td>\u003ctd>M05-2、M03-1 基础\u003c/td>\u003ctd>两会话脚本复现 RC/RR 差异和冲突，修改加锁策略\u003c/td>\u003ctd>明确快照建立时机和读类型；不把 RR 简化成通用快照隔离或绝对防幻读\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-5\u003c/td>\u003ctd>JDBC、预编译、批处理、连接池；MyBatis 映射/动态 SQL/缓存\u003c/td>\u003ctd>M01-3、M05-1/4 基础\u003c/td>\u003ctd>JDBC 实现一次事务，再用 MyBatis 对照；注入池耗尽\u003c/td>\u003ctd>参数绑定正确、连接归还、异常回滚；解释池大小与数据库容量的关系\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05-6\u003c/td>\u003ctd>redo/undo/binlog、崩溃恢复、schema 迁移、备份/恢复、复制基础\u003c/td>\u003ctd>M05-4、M02-4\u003c/td>\u003ctd>扩展字段兼容旧应用；独立实例恢复并校验业务数据\u003c/td>\u003ctd>区分撤销、重做与复制用途；说明回滚应用、恢复备份、前向修复的差别\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：客户成交额。\u003c/strong> 生成含“无订单客户、多个订单、多行明细、已取消订单”的数据。分别用错误 JOIN 聚合和正确口径查询，解释重复累计的原因。加入按负责人和时间段筛选，比较联合索引方案。\u003c/p>\n\u003cp>\u003cstrong>实验 B：事务时序。\u003c/strong> 两个独立连接显示隔离级别、自动提交状态与每条 SQL 顺序；在 RC/RR 下分别执行普通 SELECT、锁定读、UPDATE。记录返回值和等待，不把别的引擎结论直接搬到 InnoDB。\u003c/p>\n\u003cp>\u003cstrong>实验 C：迁移与恢复。\u003c/strong> 用“新增可空字段→兼容写入→回填→校验→加约束”演练客户等级变更。对练习库备份，在全新实例恢复并核对条数、金额合计及抽样明细。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>报价转订单与明细同一事务提交；查询金额与手算一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>无订单客户、金额 0、数据倾斜、深分页、长事务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>唯一键冲突、事务中途异常、反序加锁、连接泄漏、迁移中断\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>有联合索引为什么仍可能全表扫描？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 从选择性、统计信息与代价解释，并拿执行计划验证。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>RC 与 RR 中普通查询和 UPDATE 使用同一种可见性规则吗？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 用明确版本与时序回答，不只背隔离级别表。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>已备份为何仍可能达不到恢复目标？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 解释恢复时间、丢失窗口及验证方法。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>参数化查询能解决动态表名/排序字段的注入吗？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 区分值绑定与标识符白名单。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>至少一条聚合 SQL、一组隔离实验、一份索引对比和一次恢复验证；阶段 1 只先验收对应基础单元，不要求提前完成全模块。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=mysql\">MySQL 8.4 手册\u003c/a>：SQL/数据类型 → InnoDB 事务与锁 → 索引与优化 → Backup and Recovery。数据访问查 \u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=mybatis\">MyBatis 官方资料\u003c/a>。所有实验记录精确版本和隔离级别。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>PostgreSQL 作为另一种实现对照；LSM、列存、NewSQL、存储引擎开发为选修。分库分表先比较索引、归档、读模型等更简单方案，进入 M11 决策后再实践。\u003c/p>", "toc": [{"id": "heading-0", "title": "M05 数据库与数据访问", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M05-1", "topic": "关系模型、键/约束、NULL、SQL 逻辑、JOIN、分组、窗口函数、分页", "prereq": "M01-2", "method": "用客户/订单数据写明细与汇总，手算预期", "criteria": "区分行数膨胀、NULL 和重复；分页排序稳定，统计口径明确"}, {"id": "M05-2", "topic": "ER 建模、函数依赖与范式、反范式、类型与精度、历史快照", "prereq": "M05-1", "method": "设计客户→报价版本→订单模型，注入不合法数据", "criteria": "主键/唯一/外键/检查约束各有理由；历史金额不随商品/报价修改变化"}, {"id": "M05-3", "topic": "页、B+ 树、聚簇/二级索引、缓冲池、联合索引、统计信息、执行计划", "prereq": "M05-1、M02-4", "method": "对不同选择性、偏斜数据比较 EXPLAIN ANALYZE", "criteria": "解释估计与实际行数差异、回表和排序；测量写入与空间代价"}, {"id": "M05-4", "topic": "ACID、隔离异常、锁/死锁、MVCC、快照读/锁定读、事务边界", "prereq": "M05-2、M03-1 基础", "method": "两会话脚本复现 RC/RR 差异和冲突，修改加锁策略", "criteria": "明确快照建立时机和读类型；不把 RR 简化成通用快照隔离或绝对防幻读"}, {"id": "M05-5", "topic": "JDBC、预编译、批处理、连接池；MyBatis 映射/动态 SQL/缓存", "prereq": "M01-3、M05-1/4 基础", "method": "JDBC 实现一次事务，再用 MyBatis 对照；注入池耗尽", "criteria": "参数绑定正确、连接归还、异常回滚；解释池大小与数据库容量的关系"}, {"id": "M05-6", "topic": "redo/undo/binlog、崩溃恢复、schema 迁移、备份/恢复、复制基础", "prereq": "M05-4、M02-4", "method": "扩展字段兼容旧应用；独立实例恢复并校验业务数据", "criteria": "区分撤销、重做与复制用途；说明回滚应用、恢复备份、前向修复的差别"}], "checks": []}, {"path": "modules/m06-spring.md", "title": "M06 Spring 与 Web 工程", "text": "M06 Spring 与 Web 工程 总纲 · 阶段 1 学习问题与前置 一条请求如何经过安全过滤、参数转换、应用逻辑、事务和数据库？注解为什么有时不生效？前置：M01 异常/反射/代理，M05 JDBC 与事务基础，HTTP 不足先补 M02-5。目标 L3。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M06-1 IoC、构造器注入、Bean 生命周期、作用域、依赖方向 M01-1/6 跟踪服务与仓储实例创建，设计依赖图 解释 singleton 与线程安全无直接保证；无隐蔽循环依赖 M06-2 AOP、代理边界、事务传播/回滚规则、连接与事务上下文 M06-1、M05-4/5 对照外部调用与自调用，注入受检/运行时异常 能证实实际事务是否生效；明确回滚规则、传播与异步边界 M06-3 Boot 自动配置、条件装配、配置来源、环境差异、starter M06-1 查条件报告，改变一个配置或依赖观察 Bean 变化 从证据解释为什么配置生效；敏感配置不写进代码 M06-4 Servlet/Filter、DispatcherServlet、参数绑定、校验、异常映射、HTTP 契约 M02-5、M06-1 跟踪报价转订单请求，制造格式/权限/业务/系统错误 分清 400/401/403/404/409/500；错误有稳定业务码和请求标识 M06-5 Spring Security、认证与授权、会话/令牌、CSRF/CORS、对象级权限 M06-4、M12-1 固定练习账号测试角色和客户数据范围 伪造请求字段不能越权；认证信息取自可信安全上下文 M06-6 Web 与数据库集成测试、事务测试边界、接口文档 M06-2/4、M07-3 测试真实数据库提交后的状态；核对错误契约 测试不因自动回滚或全量 mock 掩盖真实提交问题 最小实验与项目映射 实验 A：请求的路径。 为报价转订单画时序图：安全过滤→控制器→应用服务→仓储→数据库→响应。跟踪成功与异常两个分支，记录事务开始/结束和异常转换的位置。 实验 B：事务失效。 在隔离实验中构造代理外部调用和同对象内部调用；分别在第二次写入前抛异常。查询真实数据库验证结果，再把事务边界移至清晰的应用服务入口。不要只看到注解就判定事务存在。 实验 C：配置解释。 让练习环境读取两个冲突配置，依据对应版本官方规则预测最终值，再查实际配置与条件报告；移除冲突并说明配置归属。 场景 验证 正常 合法账号完成报价转订单，返回创建资源标识 边界 空明细、重复请求、未知客户、过期报价 失败 未认证、跨负责人访问、数据库写入失败、错误装配、代理未经过 自测与模块验收 为什么控制器里调用另一个方法不一定开启新事务？ 判断依据 画调用对象与代理路径，注明代理机制。 单元测试通过为什么接口仍可能提交部分数据？ 判断依据 说明 mock 和测试事务可能遮蔽的边界，补集成测试。 CORS 与权限校验解决的是同一个问题吗？ 判断依据 分别解释浏览器来源限制、身份和数据权限。 新增依赖为何改变了应用行为？ 判断依据 用自动配置条件定位原因，不靠猜测移除依赖。 模块证据包括请求时序、事务故障与修复、配置定位、权限与错误响应测试。源码只追当前请求链上的关键节点。 一手资料与阅读顺序 主入口： Spring Framework 与 Boot ：Core/IoC → AOP/事务 → Web MVC → Boot 配置与测试。安全查 Spring Security 。资料必须与实际依赖主版本匹配，避免把 Boot 3/4 的配置直接混用。 选修与边界 手写最小 IoC 可选；完整 Spring 仿制不是毕业要求。WebFlux、响应式数据访问、gRPC、GraphQL、自定义 starter 按具体问题选学，先掌握同步 MVC 链路。", "html": "\u003ch1 id=\"heading-0\">M06 Spring 与 Web 工程\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-01-business.md\">阶段 1\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>一条请求如何经过安全过滤、参数转换、应用逻辑、事务和数据库？注解为什么有时不生效？前置：M01 异常/反射/代理，M05 JDBC 与事务基础，HTTP 不足先补 M02-5。目标 L3。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M06-1\u003c/td>\u003ctd>IoC、构造器注入、Bean 生命周期、作用域、依赖方向\u003c/td>\u003ctd>M01-1/6\u003c/td>\u003ctd>跟踪服务与仓储实例创建，设计依赖图\u003c/td>\u003ctd>解释 singleton 与线程安全无直接保证；无隐蔽循环依赖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M06-2\u003c/td>\u003ctd>AOP、代理边界、事务传播/回滚规则、连接与事务上下文\u003c/td>\u003ctd>M06-1、M05-4/5\u003c/td>\u003ctd>对照外部调用与自调用，注入受检/运行时异常\u003c/td>\u003ctd>能证实实际事务是否生效；明确回滚规则、传播与异步边界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M06-3\u003c/td>\u003ctd>Boot 自动配置、条件装配、配置来源、环境差异、starter\u003c/td>\u003ctd>M06-1\u003c/td>\u003ctd>查条件报告，改变一个配置或依赖观察 Bean 变化\u003c/td>\u003ctd>从证据解释为什么配置生效；敏感配置不写进代码\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M06-4\u003c/td>\u003ctd>Servlet/Filter、DispatcherServlet、参数绑定、校验、异常映射、HTTP 契约\u003c/td>\u003ctd>M02-5、M06-1\u003c/td>\u003ctd>跟踪报价转订单请求，制造格式/权限/业务/系统错误\u003c/td>\u003ctd>分清 400/401/403/404/409/500；错误有稳定业务码和请求标识\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M06-5\u003c/td>\u003ctd>Spring Security、认证与授权、会话/令牌、CSRF/CORS、对象级权限\u003c/td>\u003ctd>M06-4、M12-1\u003c/td>\u003ctd>固定练习账号测试角色和客户数据范围\u003c/td>\u003ctd>伪造请求字段不能越权；认证信息取自可信安全上下文\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M06-6\u003c/td>\u003ctd>Web 与数据库集成测试、事务测试边界、接口文档\u003c/td>\u003ctd>M06-2/4、M07-3\u003c/td>\u003ctd>测试真实数据库提交后的状态；核对错误契约\u003c/td>\u003ctd>测试不因自动回滚或全量 mock 掩盖真实提交问题\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：请求的路径。\u003c/strong> 为报价转订单画时序图：安全过滤→控制器→应用服务→仓储→数据库→响应。跟踪成功与异常两个分支，记录事务开始/结束和异常转换的位置。\u003c/p>\n\u003cp>\u003cstrong>实验 B：事务失效。\u003c/strong> 在隔离实验中构造代理外部调用和同对象内部调用；分别在第二次写入前抛异常。查询真实数据库验证结果，再把事务边界移至清晰的应用服务入口。不要只看到注解就判定事务存在。\u003c/p>\n\u003cp>\u003cstrong>实验 C：配置解释。\u003c/strong> 让练习环境读取两个冲突配置，依据对应版本官方规则预测最终值，再查实际配置与条件报告；移除冲突并说明配置归属。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>合法账号完成报价转订单，返回创建资源标识\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>空明细、重复请求、未知客户、过期报价\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>未认证、跨负责人访问、数据库写入失败、错误装配、代理未经过\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么控制器里调用另一个方法不一定开启新事务？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 画调用对象与代理路径，注明代理机制。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>单元测试通过为什么接口仍可能提交部分数据？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 说明 mock 和测试事务可能遮蔽的边界，补集成测试。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>CORS 与权限校验解决的是同一个问题吗？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 分别解释浏览器来源限制、身份和数据权限。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>新增依赖为何改变了应用行为？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 用自动配置条件定位原因，不靠猜测移除依赖。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>模块证据包括请求时序、事务故障与修复、配置定位、权限与错误响应测试。源码只追当前请求链上的关键节点。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=spring\">Spring Framework 与 Boot\u003c/a>：Core/IoC → AOP/事务 → Web MVC → Boot 配置与测试。安全查 \u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=security\">Spring Security\u003c/a>。资料必须与实际依赖主版本匹配，避免把 Boot 3/4 的配置直接混用。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>手写最小 IoC 可选；完整 Spring 仿制不是毕业要求。WebFlux、响应式数据访问、gRPC、GraphQL、自定义 starter 按具体问题选学，先掌握同步 MVC 链路。\u003c/p>", "toc": [{"id": "heading-0", "title": "M06 Spring 与 Web 工程", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M06-1", "topic": "IoC、构造器注入、Bean 生命周期、作用域、依赖方向", "prereq": "M01-1/6", "method": "跟踪服务与仓储实例创建，设计依赖图", "criteria": "解释 singleton 与线程安全无直接保证；无隐蔽循环依赖"}, {"id": "M06-2", "topic": "AOP、代理边界、事务传播/回滚规则、连接与事务上下文", "prereq": "M06-1、M05-4/5", "method": "对照外部调用与自调用，注入受检/运行时异常", "criteria": "能证实实际事务是否生效；明确回滚规则、传播与异步边界"}, {"id": "M06-3", "topic": "Boot 自动配置、条件装配、配置来源、环境差异、starter", "prereq": "M06-1", "method": "查条件报告，改变一个配置或依赖观察 Bean 变化", "criteria": "从证据解释为什么配置生效；敏感配置不写进代码"}, {"id": "M06-4", "topic": "Servlet/Filter、DispatcherServlet、参数绑定、校验、异常映射、HTTP 契约", "prereq": "M02-5、M06-1", "method": "跟踪报价转订单请求，制造格式/权限/业务/系统错误", "criteria": "分清 400/401/403/404/409/500；错误有稳定业务码和请求标识"}, {"id": "M06-5", "topic": "Spring Security、认证与授权、会话/令牌、CSRF/CORS、对象级权限", "prereq": "M06-4、M12-1", "method": "固定练习账号测试角色和客户数据范围", "criteria": "伪造请求字段不能越权；认证信息取自可信安全上下文"}, {"id": "M06-6", "topic": "Web 与数据库集成测试、事务测试边界、接口文档", "prereq": "M06-2/4、M07-3", "method": "测试真实数据库提交后的状态；核对错误契约", "criteria": "测试不因自动回滚或全量 mock 掩盖真实提交问题"}], "checks": []}, {"path": "modules/m07-engineering.md", "title": "M07 软件设计与工程质量", "text": "M07 软件设计与工程质量 总纲 · 阶段 1 学习问题与前置 怎样让需求变化的代价可控，让别人能验证和维护自己的交付？前置：M01 基础；测试数据库边界时配合 M05/M06。目标：实现与排障达到 L3，设计取舍达到 L4。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M07-1 高内聚低耦合、SOLID、组合、职责、依赖反转、常用模式 M01-1 对比条件分支与策略对象实现报价规则 以变化成本解释设计；能说明何时保留简单分支更合适 M07-2 小步重构、坏味道、模块边界、兼容与回退 M07-1 先补特征测试，再拆分巨型报价服务 行为不变有测试证明；每步能回退，无跨模块直连内部实现 M07-3 单元/集成/契约/端到端测试、测试替身、TDD、确定性 M01-3、M05 基础 为 Money、事务和 API 分别选测试层级，固定 Clock 与数据 能解释每个测试保护什么风险；关键失败场景通过真实边界验证 M07-4 Git 提交/分支/冲突、Maven 生命周期与依赖、版本锁定 基本命令行 制造练习分支冲突；查依赖树；全新目录构建 能解释冲突解决；重现构建，定位版本冲突与传递依赖 M07-5 代码规范、评审、CI、制品追溯、发布检查 M07-3/4 让一次故意破坏业务不变量的修改被 CI 拦截 同一制品可追溯源码与依赖，CI 检查与本地一致 M07-6 技术写作、需求拆分、完成定义、评审反馈 M07-1/5 为报价版本变更写小设计和评审记录 接手者不依赖口头解释也能理解动机、风险与验收方法 最小实验与项目映射 实验 A：安全重构。 先把报价计算、状态判断和数据库操作混在一个应用服务中，补齐金额和失败回滚测试；分步抽出纯计算和仓储接口。比较修改“报价到期规则”前后的影响范围。 实验 B：测试层级。 用单元测试验证金额；用真实 MySQL 验证唯一约束与事务；用 HTTP 集成测试验证权限及错误码。故意删掉唯一约束，确认相关测试确实失败。 实验 C：可复现交付。 在全新工作目录按说明拉取依赖、初始化库、测试、打包；记录 JDK、构建工具、锁定依赖和制品校验值。自动化尚未建立时先手工验证同样流程，再放入 CI。 场景 验证 正常 新增报价规则后原有测试仍保护旧行为 边界 日期跨日、空输入、构建无本地缓存、两个提交修改同一处 失败 回归测试失败、数据库不可用、依赖冲突、错误配置导致启动失败 自测与模块验收 覆盖率很高为什么仍可能漏掉业务错误？ 判断依据 举出无有效断言或 mock 遮蔽边界的例子。 何时不应该引入设计模式？ 判断依据 根据变化频率和理解成本比较两种实现。 测试失败但只在某台机器发生时怎样定位？ 判断依据 检查版本、时区、随机性、并发和外部依赖。 为什么不能把“编译成功”当交付完成？ 判断依据 给出包含行为、文档和恢复的完成定义。 交付一次有测试保护的重构和一次由 CI 阻止的错误变更；评审记录至少包含一个根据反馈调整的决定。 一手资料与阅读顺序 主入口： JUnit、Maven、Git 官方资料 。测试按 JUnit 用户指南和对应 Boot 测试章节阅读；设计部分先结合代码案例，再读模块边界与 M11 的架构资料。 选修与边界 Gradle、多仓/单仓治理、插件开发、性质测试与 mutation testing 为选修。不要为可逆文档修改或纯粹复制实现的逻辑编写无价值测试。", "html": "\u003ch1 id=\"heading-0\">M07 软件设计与工程质量\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-01-business.md\">阶段 1\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>怎样让需求变化的代价可控，让别人能验证和维护自己的交付？前置：M01 基础；测试数据库边界时配合 M05/M06。目标：实现与排障达到 L3，设计取舍达到 L4。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M07-1\u003c/td>\u003ctd>高内聚低耦合、SOLID、组合、职责、依赖反转、常用模式\u003c/td>\u003ctd>M01-1\u003c/td>\u003ctd>对比条件分支与策略对象实现报价规则\u003c/td>\u003ctd>以变化成本解释设计；能说明何时保留简单分支更合适\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M07-2\u003c/td>\u003ctd>小步重构、坏味道、模块边界、兼容与回退\u003c/td>\u003ctd>M07-1\u003c/td>\u003ctd>先补特征测试，再拆分巨型报价服务\u003c/td>\u003ctd>行为不变有测试证明；每步能回退，无跨模块直连内部实现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M07-3\u003c/td>\u003ctd>单元/集成/契约/端到端测试、测试替身、TDD、确定性\u003c/td>\u003ctd>M01-3、M05 基础\u003c/td>\u003ctd>为 Money、事务和 API 分别选测试层级，固定 Clock 与数据\u003c/td>\u003ctd>能解释每个测试保护什么风险；关键失败场景通过真实边界验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M07-4\u003c/td>\u003ctd>Git 提交/分支/冲突、Maven 生命周期与依赖、版本锁定\u003c/td>\u003ctd>基本命令行\u003c/td>\u003ctd>制造练习分支冲突；查依赖树；全新目录构建\u003c/td>\u003ctd>能解释冲突解决；重现构建，定位版本冲突与传递依赖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M07-5\u003c/td>\u003ctd>代码规范、评审、CI、制品追溯、发布检查\u003c/td>\u003ctd>M07-3/4\u003c/td>\u003ctd>让一次故意破坏业务不变量的修改被 CI 拦截\u003c/td>\u003ctd>同一制品可追溯源码与依赖，CI 检查与本地一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M07-6\u003c/td>\u003ctd>技术写作、需求拆分、完成定义、评审反馈\u003c/td>\u003ctd>M07-1/5\u003c/td>\u003ctd>为报价版本变更写小设计和评审记录\u003c/td>\u003ctd>接手者不依赖口头解释也能理解动机、风险与验收方法\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-3\">最小实验与项目映射\u003c/h2>\n\u003cp>\u003cstrong>实验 A：安全重构。\u003c/strong> 先把报价计算、状态判断和数据库操作混在一个应用服务中，补齐金额和失败回滚测试；分步抽出纯计算和仓储接口。比较修改“报价到期规则”前后的影响范围。\u003c/p>\n\u003cp>\u003cstrong>实验 B：测试层级。\u003c/strong> 用单元测试验证金额；用真实 MySQL 验证唯一约束与事务；用 HTTP 集成测试验证权限及错误码。故意删掉唯一约束，确认相关测试确实失败。\u003c/p>\n\u003cp>\u003cstrong>实验 C：可复现交付。\u003c/strong> 在全新工作目录按说明拉取依赖、初始化库、测试、打包；记录 JDK、构建工具、锁定依赖和制品校验值。自动化尚未建立时先手工验证同样流程，再放入 CI。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"场景表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">场景\u003c/th>\u003cth scope=\"col\">验证\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常\u003c/td>\u003ctd>新增报价规则后原有测试仍保护旧行为\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边界\u003c/td>\u003ctd>日期跨日、空输入、构建无本地缓存、两个提交修改同一处\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败\u003c/td>\u003ctd>回归测试失败、数据库不可用、依赖冲突、错误配置导致启动失败\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"heading-4\">自测与模块验收\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>覆盖率很高为什么仍可能漏掉业务错误？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 举出无有效断言或 mock 遮蔽边界的例子。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>何时不应该引入设计模式？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 根据变化频率和理解成本比较两种实现。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>测试失败但只在某台机器发生时怎样定位？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 检查版本、时区、随机性、并发和外部依赖。\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"answer-card\">\u003csummary>为什么不能把“编译成功”当交付完成？\u003c/summary>\u003cp>\u003cb>判断依据\u003c/b> 给出包含行为、文档和恢复的完成定义。\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cp>交付一次有测试保护的重构和一次由 CI 阻止的错误变更；评审记录至少包含一个根据反馈调整的决定。\u003c/p>\n\u003ch2 id=\"heading-5\">一手资料与阅读顺序\u003c/h2>\n\u003cp>主入口：\u003ca href=\"#doc=resources%2FREFERENCES.md&amp;section=engineering\">JUnit、Maven、Git 官方资料\u003c/a>。测试按 JUnit 用户指南和对应 Boot 测试章节阅读；设计部分先结合代码案例，再读模块边界与 M11 的架构资料。\u003c/p>\n\u003ch2 id=\"heading-6\">选修与边界\u003c/h2>\n\u003cp>Gradle、多仓/单仓治理、插件开发、性质测试与 mutation testing 为选修。不要为可逆文档修改或纯粹复制实现的逻辑编写无价值测试。\u003c/p>", "toc": [{"id": "heading-0", "title": "M07 软件设计与工程质量", "level": 1}, {"id": "heading-1", "title": "学习问题与前置", "level": 2}, {"id": "heading-2", "title": "必修单元", "level": 2}, {"id": "heading-3", "title": "最小实验与项目映射", "level": 2}, {"id": "heading-4", "title": "自测与模块验收", "level": 2}, {"id": "heading-5", "title": "一手资料与阅读顺序", "level": 2}, {"id": "heading-6", "title": "选修与边界", "level": 2}], "units": [{"id": "M07-1", "topic": "高内聚低耦合、SOLID、组合、职责、依赖反转、常用模式", "prereq": "M01-1", "method": "对比条件分支与策略对象实现报价规则", "criteria": "以变化成本解释设计；能说明何时保留简单分支更合适"}, {"id": "M07-2", "topic": "小步重构、坏味道、模块边界、兼容与回退", "prereq": "M07-1", "method": "先补特征测试，再拆分巨型报价服务", "criteria": "行为不变有测试证明；每步能回退，无跨模块直连内部实现"}, {"id": "M07-3", "topic": "单元/集成/契约/端到端测试、测试替身、TDD、确定性", "prereq": "M01-3、M05 基础", "method": "为 Money、事务和 API 分别选测试层级，固定 Clock 与数据", "criteria": "能解释每个测试保护什么风险；关键失败场景通过真实边界验证"}, {"id": "M07-4", "topic": "Git 提交/分支/冲突、Maven 生命周期与依赖、版本锁定", "prereq": "基本命令行", "method": "制造练习分支冲突；查依赖树；全新目录构建", "criteria": "能解释冲突解决；重现构建，定位版本冲突与传递依赖"}, {"id": "M07-5", "topic": "代码规范、评审、CI、制品追溯、发布检查", "prereq": "M07-3/4", "method": "让一次故意破坏业务不变量的修改被 CI 拦截", "criteria": "同一制品可追溯源码与依赖，CI 检查与本地一致"}, {"id": "M07-6", "topic": "技术写作、需求拆分、完成定义、评审反馈", "prereq": "M07-1/5", "method": "为报价版本变更写小设计和评审记录", "criteria": "接手者不依赖口头解释也能理解动机、风险与验收方法"}], "checks": []}, {"path": "modules/m08-middleware.md", "title": "M08 缓存、消息与搜索", "text": "M08 缓存、消息与搜索 总纲 · 阶段 3 学习问题与前置 缓存、异步消息和搜索分别改变了哪种成本，又引入了哪种不一致？前置：M05 事务/索引、M06 接口；可靠投递与 M09 联动。Redis 与 RabbitMQ 为主要实现，目标 L3；搜索基础目标 L2。 必修单元 单元 主题与关键原理 前置 怎么学 通过标准 M08-1 Redis 数据结构、过期/淘汰、持久化、复制、热点与容量 M01-2、M05-6 基础 为客户摘要选结构，限制内存观察淘汰 解释缓存中可丢失什么，区分 TTL、淘汰与持久化承诺 M08-2 Cache Aside、一致性窗口、穿透/击穿/雪崩、热键、降级 M08-1、M09-1 注入并发更新与失效、缓存中断、批量过期 说明陈旧值来源和收敛手段；降级不把数据库打垮 M08-3 RabbitMQ 路由/队列、发布确认、消费者确认、持久化、背压 M05-4、M06 从模拟发布到持久化消费；在确认前后停止组件 区分 broker 接受、投递与业务提交；不宣称“一次且仅一次”业务效果由 MQ 自动保证 M08-4 幂等、顺序、重试、死信、积压、重放、毒消息 M08-3、M05-4 CRM 成交统计重复消费，失败后重启与重放；完成后接 M09-3 的 Outbox 去重与业务更新同事务；重试有上限，积压有观测与处理入口 M08-5 倒排索引、分词、查询相关性、近实时可见性、数据同步与重建 M05-3、M08-4 做客户名称检索或最小倒排模型，对比关系库查询 新建/修改/删除都可同步或重建；接受并说明可见性延迟，过滤权限范围 最小实验与项目映射 实验 A：客户摘要缓存。 定义数据库为事实来源，缓存只保存可重建摘要。并发“读旧值、更新数据库、删除缓存、旧值回填”，画出陈旧值形成的时序，再选择 TTL/版本校验等策略并解释残余窗口。 实验 B：成交事件。 消费者更新客户统计并登记事件 ID，在数据库提交后、确认消息前故意退出；重启后观察重投，验证成交额没有重复增加。另一轮在提交前退出，验证事务回滚后消息仍可处理。 实验 C：客户搜索。 至少验证新客户、重命名、删除/停用、中文分词和跨负责人访问。搜索结果只作为检索入口，详情权限在服务端重新校验。 场景 验证 正常 命中缓存；成交更新统计；新客户可检索 边界 空值、热键、消息乱序、同 ID 重放、索引尚未刷新 失败 缓存断连、确认丢失、消费者重启、永久格式错误、搜索索引丢失 自测与模块验收 Redis 可用是否意味着缓存数据一定完整？ 判断依据 区分故障切换、淘汰、持久化与业务事实来源。 发布确认成功是否代表 CRM 统计已完成？ 判断依据 解释确认所属层次与业务状态查询方式。 为什么“先写去重表，再单独更新统计”仍可能漏处理？ 判断依据 给出中间崩溃时序，并用同事务修复。 搜索返回旧名称时如何判断是故障还是允许延迟？ 判断依据 关联同步机制与可见性目标。 验收必须提交组件失败矩阵、重复消费证据和一次重建/重放记录；Redis/MQ 的持久化与队列配置注明版本和具体值。 一手资料与阅读顺序 主入口： Redis 文档 ，按数据类型、过期、淘汰、持久化阅读； RabbitMQ 文档 先读 confirmations，再读可靠性、prefetch、死信。搜索查同页 Elasticsearch 官方入口。 选修与边界 Kafka、Redis Cluster、Lua 脚本深入、CDC、搜索集群调优为选修。Kafka 对照重点是日志/分区/消费位点语义；不为凑技术栈同时引入两种 MQ。", "html": "\u003ch1 id=\"heading-0\">M08 缓存、消息与搜索\u003c/h1>\n\u003cp>\u003ca href=\"#doc=ROADMAP.md\">总纲\u003c/a> · \u003ca href=\"#doc=practice%2Fstage-03-resilience.md\">阶段 3\u003c/a>\u003c/p>\n\u003ch2 id=\"heading-1\">学习问题与前置\u003c/h2>\n\u003cp>缓存、异步消息和搜索分别改变了哪种成本，又引入了哪种不一致？前置：M05 事务/索引、M06 接口；可靠投递与 M09 联动。Redis 与 RabbitMQ 为主要实现，目标 L3；搜索基础目标 L2。\u003c/p>\n\u003ch2 id=\"heading-2\">必修单元\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"单元表格\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">单元\u003c/th>\u003cth scope=\"col\">主题与关键原理\u003c/th>\u003cth scope=\"col\">前置\u003c/th>\u003cth scope=\"col\">怎么学\u003c/th>\u003cth scope=\"col\">通过标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M08-1\u003c/td>\u003ctd>Redis 数据结构、过期/淘汰、持久化、复制、热点与容量\u003c/td>\u003ctd>M01-2、M05-6 基础\u003c/td>\u003ctd>为客户摘要选结构，限制内存观察淘汰\u003c/td>\u003ctd>解释缓存中可丢失什么，区分 TTL、淘汰与持久化承诺\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M08-2\u003c/td>\
